<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exclusive Tense Course</title>

  <!-- Google Fonts Preconnect & Imports matching LearnEra styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Lottie Player CDN for animations -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <!-- Firebase Web SDK Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <!-- Dynamic Theme & Space configuration loader -->
  <script>
    (function() {
        try {
            const savedTheme = localStorage.getItem('appThemeMode') || 'system';
            const isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                const darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
                document.documentElement.setAttribute('data-dark-text', darkStyle);
            } else {
                document.documentElement.removeAttribute('data-dark-text');
            }
            
            const topSp = localStorage.getItem('appTopSpace') || '5';
            document.documentElement.style.setProperty('--top-space', topSp + 'vh');
            
            const navGradOp = localStorage.getItem('navGradientOpacity') || '15';
            document.documentElement.style.setProperty('--nav-grad-op', navGradOp / 100);
        } catch (e) {
            document.documentElement.style.setProperty('--top-space', '5vh');
            document.documentElement.style.setProperty('--nav-grad-op', '0.15');
        }
    })();

    // Helper to extract localStorage securely across sandboxes
    function getLocalStorageItem(key, defaultValue) {
        try {
            const val = localStorage.getItem(key);
            return val !== null ? val : defaultValue;
        } catch (e) {
            return defaultValue;
        }
    }

    // Early navigation bar styler to prevent late load issues
    function applyDynamicEnrollBarStyles() {
        const bar = document.getElementById('enrollmentFloatingBar');
        if (!bar) return;

        const isLiquid = getLocalStorageItem('navbarLiquidTheme', '') === 'enabled';
        const stdGrad = getLocalStorageItem('standardNavGradient', '') === 'enabled';
        const liqStyle = getLocalStorageItem('liquidNavStyle', 'gradient');

        bar.className = 'box';

        if (isLiquid) {
            if (liqStyle === 'glass') {
                bar.classList.add('liquid-glass'); 
            } else if (liqStyle === 'gradient') {
                bar.classList.add('liquid-gradient');
            } else if (liqStyle === 'fit') {
                bar.classList.add('liquid-fit');
            } else {
                bar.classList.add('liquid-classic');
            }
        } else {
            if (stdGrad) {
                bar.classList.add('standard-gradient');
            } else {
                bar.classList.add('standard-normal'); 
            }
        }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none; 
      -ms-user-select: none; 
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Core Neumorphic Variables aligned exactly with LearnEra.html */
    /* Theme palette mirrored 1:1 from LearnEra.html so CourseScreen flips with the same modes (light, dark colorful, deep-dark). */
    :root {
        --body-bg: #e6edf7; 
        --neu-shadow-light: #ffffff;
        --neu-shadow-dark: #c8d3e4;
        
        --text-color: #8A2BE2; 
        --sub-text-color: #7a8b9e;
        --h1-color-part1: #a158e6;
        --gradient-btn-bg: var(--body-bg);
        
        --card-bg-opacity: var(--body-bg);
        --pink-card-text: #FF1493;
        --blue-card-text: #1E90FF;
        --purple-card-text: #8A2BE2;

        --tool-text-color: #1E90FF;
        --avatar-bg: var(--body-bg);
        --strong-color: #FF69B4;

        --search-bar-bg: var(--body-bg);
        --search-input-color: #FF69B4;
        --search-input-placeholder-color: #a3b1c6;
        --search-shadow-out-1: var(--neu-shadow-dark);
        --search-shadow-out-2: var(--neu-shadow-light);
        --search-shadow-in-1: transparent;
        --search-shadow-in-2: transparent;
        --search-icon-theme: #FF69B4;

        --category-heading-color: #FF69B4;
        --popular-card-bg: var(--body-bg);
        --category-item-bg: var(--body-bg);
        --course-item-card-bg: var(--body-bg);
        --upcoming-tag-bg: #d1d9e6;
        --affiliate-heading-color: #1E90FF;
        --settings-header-bg: var(--body-bg);
        --settings-item-bg: var(--body-bg);
        --search-results-bg: var(--body-bg);
        --search-results-item-color: #8A2BE2;
        --search-results-item-border: #d1d9e6;
        --search-results-item-hover-bg: #d1d9e6;
        --sub-arrangement-bg: var(--body-bg);
        --sub-arrangement-h2: #FF69B4;
        --sub-arrangement-p: #a3b1c6;
        --back-button-bg: var(--body-bg);

        --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
        --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
        --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), -2px -2px 5px var(--neu-shadow-light);
        --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -6px -6px 12px var(--neu-shadow-light);
        --settings-shadow-sharp: 4px 4px 6px var(--neu-shadow-dark), -4px -4px 6px var(--neu-shadow-light);
        --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);

        --toggle-blue: #89CFF0;
        --toggle-pink: #FF69B4;
        --toggle-shadow: 6px 6px 14px var(--neu-shadow-dark), -6px -6px 14px var(--neu-shadow-light);

        --dynamic-h1-color: var(--h1-color-part1);
        --dynamic-sub-color: var(--sub-text-color);
        --dynamic-heading-color: #FF69B4;
        --dynamic-more-heading: #1E90FF;
        --dynamic-pop-heading: #a906f980;
        --dynamic-tc-heading: var(--dynamic-pop-heading);
        --dynamic-aff-heading: var(--dynamic-pop-heading);
        --dynamic-more-span: var(--sub-text-color);
        --dynamic-search-icon: var(--search-icon-theme);

        --my-courses-btn-opacity: 1.0;
        --my-courses-btn-bg: var(--body-bg);

        --top-notch-space-color: var(--sub-text-color);
        --transparency-color: var(--sub-text-color);
        --search-blur-bg: rgba(230, 237, 247, 0.4);

        --top-space: 5vh;
        --nav-grad-op: 0.15;
    }

    body[data-theme="dark"] {
        --body-bg: #1e1e24; 
        --neu-shadow-dark: #101014;
        --neu-shadow-light: rgba(255, 255, 255, 0.05);
        
        --text-color: rgba(255, 255, 255, 0.7); 
        --sub-text-color: rgba(163, 71, 232, 0.6);
        --h1-color-part1: rgba(233, 30, 99, 0.6);
        
        --gradient-btn-bg: var(--body-bg);
        --card-bg-opacity: var(--body-bg);
        --avatar-bg: var(--body-bg);
        --search-bar-bg: #191A1E;
        --category-item-bg: var(--body-bg);
        --course-item-card-bg: var(--body-bg);
        --settings-header-bg: var(--body-bg);
        --settings-item-bg: var(--body-bg);
        --search-results-bg: var(--body-bg);
        --sub-arrangement-bg: var(--body-bg);
        --back-button-bg: var(--body-bg);

        --search-shadow-out-1: #0e0e0e;
        --search-shadow-out-2: rgba(95, 94, 94, 0.25);
        --search-shadow-in-1: #0e0e0e;
        --search-shadow-in-2: #5f5e5e;
        --search-icon-theme: rgba(187, 134, 252, 0.7);

        --dynamic-heading-color: rgba(255, 105, 180, 0.8);
        --dynamic-more-heading: rgba(30, 144, 255, 0.8);
        --dynamic-pop-heading: rgba(169, 6, 249, 0.6);

        --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.02);
        --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
        --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.02);
        --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.02);
        --settings-shadow-sharp: 4px 4px 6px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
        --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -2px -2px 4px rgba(255, 255, 255, 0.02);

        --toggle-shadow: 6px 6px 14px #000, -6px -6px 14px #1a1a20;

        --my-courses-btn-opacity: 1.0;
        --search-blur-bg: rgba(30, 30, 36, 0.6);
    }

    body[data-dark-text="deep-dark"] {
        --body-bg: #0c0c0f; 
        --neu-shadow-dark: #050506;
        --neu-shadow-light: rgba(255, 255, 255, 0.02);

        --dynamic-h1-color: rgba(255, 255, 255, 0.35);
        --dynamic-sub-color: rgba(255, 255, 255, 0.3);
        --dynamic-heading-color: rgba(255, 255, 255, 0.35);
        --dynamic-more-heading: rgba(255, 255, 255, 0.35);
        --dynamic-pop-heading: rgba(255, 255, 255, 0.35);
        --dynamic-tc-heading: rgba(255, 255, 255, 0.35);
        --dynamic-aff-heading: rgba(255, 255, 255, 0.35);
        --dynamic-more-span: rgba(255, 255, 255, 0.3);
        --dynamic-search-icon: rgba(255, 255, 255, 0.35);

        --text-color: rgba(255, 255, 255, 0.35);

        --my-courses-btn-opacity: 1.0;
        --my-courses-btn-bg: #050506;

        --top-notch-space-color: rgba(255, 255, 255, 0.35);
        --transparency-color: rgba(255, 255, 255, 0.35);
        --search-blur-bg: rgba(12, 12, 15, 0.8);
    }

    html, body {
      height: 100%;
      background-color: var(--body-bg);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Protection layers against image downloading and dragging */
    img {
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        -khtml-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        pointer-events: none !important;
    }

    .course-container {
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
      padding: 20px;
      padding-top: calc(var(--top-space) + 15px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 120px;
    }

    /* Floating Pill Back Button Container */
    .back-btn-float-container {
        position: fixed;
        top: calc(var(--top-space) + 15px);
        left: 20px;
        z-index: 1500;
        opacity: 1;
        transform: translateX(0);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .back-btn-float-container.hide {
        opacity: 0;
        transform: translateX(-40px);
        pointer-events: none;
    }

    /* Back button matches LearnEra screen arrangements back buttons exactly with SVG arrow */
    .back-pill-button {
        position: relative; 
        background: var(--body-bg); 
        color: var(--text-color); 
        border: 2px solid var(--body-bg); 
        border-radius: 16px; 
        padding: 10px 14px; 
        cursor: pointer; 
        box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.7); 
        z-index: 70; 
        transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s ease; 
        display: inline-flex; 
        align-items: center; 
        justify-content: center; 
        outline: none;
    }
    .back-pill-button:active {
        transform: scale(0.95);
        box-shadow: inset 2px 2px 4px var(--neu-shadow-dark) !important;
    }

    /* Neumorphic Groups and Panels matching LearnEra */
    .settings-group { 
        background: var(--body-bg); 
        border-radius: 20px; 
        padding: 20px 15px; 
        width: 100%; 
        margin-bottom: 25px; 
        box-shadow: var(--settings-shadow-inset-sharp); 
        border: 1px solid rgba(255,255,255,0.3); 
        transition: background-color 0.8s ease; 
    }
    body[data-theme="dark"] .settings-group {
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .settings-group-title { 
        color: var(--text-color); 
        font-size: 1.1em; 
        font-weight: 700; 
        margin-bottom: 15px; 
        padding-left: 5px; 
        opacity: 0.85;
        transition: opacity 1.8s cubic-bezier(0.19, 1, 0.22, 1);
    }
    
    .settings-item { 
        background: var(--body-bg); 
        border-radius: 15px; 
        padding: 14px 18px; 
        margin-bottom: 12px; 
        color: var(--text-color); 
        font-size: 0.95em; 
        font-weight: 500;
        transition: transform 0.3s ease, box-shadow 0.3s; 
        box-shadow: var(--card-shadow-micro); 
        border: 1px solid rgba(255,255,255,0.4);
        display: flex;
        align-items: center;
        gap: 15px;
        opacity: 0.9;
    }
    body[data-theme="dark"] .settings-item {
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .settings-item:last-child { margin-bottom: 0; }

    /* Course banner outline card style */
    .banner-outline-wrapper {
        border: 2px solid var(--body-bg);
        box-shadow: var(--settings-shadow-sharp);
        padding: 0; 
        background: var(--body-bg);
        border-radius: 18px;
        width: 100%;
        height: auto;
        overflow: hidden; 
    }
    .banner-outline-wrapper img {
        width: 100%;
        height: auto;
        display: block;
        opacity: 0.95;
    }

    #bannerOutline.loading-banner {
        min-height: 220px;
        aspect-ratio: 16/9;
        background: var(--body-bg);
    }

    /* Course Overview Texts Container */
    .overview-text-container {
        display: flex;
        flex-direction: column;
        gap: 8px; 
        width: 100%;
        margin: 12px auto; 
        padding: 2px 2px 14px 2px; 
    }

    .overview-paragraph {
        font-size: 9px !important;
        font-weight: 500;
        color: #ff007f !important; /* fuchsia fuchsia color */
        line-height: 1.4;
        text-align: left;
        margin: 2px 0; 
        opacity: 0.75; 
    }

    .overview-paragraph strong {
        font-weight: 800;
        opacity: 1.0; 
    }

    .settings-item .episode-title-text {
        font-weight: 600;
        font-size: 0.8em !important;
    }

    .settings-item .episode-duration-text {
        font-size: 0.8em !important;
        color: var(--sub-text-color);
    }

    /* Episode bubble-style card numbers */
    .episode-bubble-num {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--body-bg);
        box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Nunito', 'Poppins', sans-serif;
        font-size: 16px;
        font-weight: 800;
        color: var(--text-color);
        text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        flex-shrink: 0;
        margin-right: 15px !important; 
    }
    body[data-theme="dark"] .episode-bubble-num {
        box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.05);
        text-shadow: none;
    }

    /* Liquid Glass & Custom Nav style bindings matching LearnEra */
    .box {
        position: fixed;
        bottom: 20px !important; /* Fallback for browsers without env() support */
        bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important; /* Adjusted safe boundary margins */
        left: 50%;
        transform: translateX(-50%);
        width: calc(90% - 20px);
        max-width: 500px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 25px;
        z-index: 100;
        transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        height: 72px !important; 
        padding: 12px 12px 12px 20px !important; 
        box-sizing: border-box !important;
    }

    /* Red liquid-glass theme option */
    .box.liquid-glass {
        background: rgba(220, 20, 60, 0.15) !important; 
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(220, 20, 60, 0.3) !important;
        box-shadow: 0 8px 32px 0 rgba(220, 20, 60, 0.25) !important;
    }

    /* Liquid Gradient Style with inside 2px shadow effect [3] */
    .box.liquid-gradient {
        border: 1.5px solid transparent !important;
        background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                    linear-gradient(90deg, #FF69B4, #8A2BE2, #1E90FF) border-box !important;
        box-shadow: inset 0px 0px 0px 2px rgba(255, 105, 180, 0.25), 
                    inset 0px 0px 0px 2px rgba(30, 144, 255, 0.25),
                    inset 0px 4px 10px rgba(255, 105, 180, calc(var(--nav-grad-op, 0.15) * 0.375)), 
                    inset 0px -4px 10px rgba(30, 144, 255, calc(var(--nav-grad-op, 0.15) * 0.375)) !important;
    }

    /* Liquid Fit Style */
    .box.liquid-fit {
        bottom: 0 !important;
        width: 100% !important;
        max-width: 100% !important; 
        border-radius: 0 !important;
        background: rgba(230, 237, 247, 0.4) !important; 
        backdrop-filter: blur(15px) !important;
        -webkit-backdrop-filter: blur(15px) !important;
        border: none !important;
        border-top: 1px solid rgba(255,255,255,0.4) !important;
        box-shadow: 0px -4px 10px rgba(0,0,0,0.05) !important;
        padding-bottom: env(safe-area-inset-bottom) !important;
        height: calc(72px + env(safe-area-inset-bottom)) !important;
    }
    body[data-theme="dark"] .box.liquid-fit {
        background: rgba(30, 30, 36, 0.4) !important; 
        box-shadow: 0px -4px 10px rgba(0,0,0,0.3) !important;
        border-top: 1px solid rgba(255,255,255,0.05) !important;
    }

    /* Liquid Classic Style */
    .box.liquid-classic {
        background: var(--body-bg) !important;
        box-shadow: var(--settings-shadow-inset-sharp) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
    }

    /* Standard Gradient Outline Style with inside 2px shadow effect [3] */
    .box.standard-gradient {
        border: 1px solid transparent !important;
        background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                    linear-gradient(90deg, #FF69B4, #8A2BE2, #1E90FF) border-box !important;
        box-shadow: var(--settings-shadow-inset-sharp), 
                    inset 0px 0px 0px 2px rgba(255, 105, 180, 0.3), 
                    inset 0px 0px 0px 2px rgba(30, 144, 255, 0.3) !important;
    }

    /* Standard Normal Style - Pure Red/Crimson gradient */
    .box.standard-normal {
        background: linear-gradient(135deg, #dc143c, #8b0000) !important;
        box-shadow: 0 8px 30px rgba(220, 20, 60, 0.45) !important;
        border: none !important;
    }

    /* Refined price typography styles using professional Nunito/Quicksand */
    .box .price-display {
        font-family: 'Quicksand', 'Nunito', 'Poppins', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-color);
        letter-spacing: -0.3px;
        text-transform: capitalize;
    }
    body:not([data-theme="dark"]) .box.standard-normal .price-display {
        color: #ffffff !important;
    }

    /* Premium card styles matching Dexter-st Generate button */
    .btn-wrapper {
      position: relative;
      display: inline-block;
      height: 100% !important; 
      width: 48% !important; 
      max-width: 48% !important; 
      box-sizing: border-box !important;
    }

    .btn {
      --border-radius: 24px;
      --padding: 4px;
      --transition: 0.4s;
      background: linear-gradient(135deg, #FF69B4 0%, #8A2BE2 50%, #1E90FF 100%) !important;
      --highlight-color-hue: 210deg;

      user-select: none;
      -webkit-user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 1.5em;
      font-family: "Poppins", "Inter", "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 500;

      box-shadow:
        inset 0px 1px 1px rgba(255, 255, 255, 0.2),
        inset 0px 2px 2px rgba(255, 255, 255, 0.15),
        inset 0px 4px 4px rgba(255, 255, 255, 0.1),
        inset 0px 8px 8px rgba(255, 255, 255, 0.05),
        inset 0px 16px 16px rgba(255, 255, 255, 0.05),
        0px -1px 1px rgba(0, 0, 0, 0.02),
        0px -2px 2px rgba(0, 0, 0, 0.03),
        0px -4px 4px rgba(0, 0, 0, 0.05),
        0px -8px 8px rgba(0, 0, 0, 0.06),
        0px -16px 16px rgba(0, 0, 0, 0.08);

      border: none !important; 
      border-radius: var(--border-radius);
      cursor: pointer;
      transition:
        box-shadow var(--transition),
        border var(--transition),
        background-color var(--transition);

      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
    }

    body[data-theme="dark"]:not([data-dark-text="deep-dark"]) .btn {
      background: linear-gradient(135deg, #FF69B4 0%, #8A2BE2 50%, #1E90FF 100%) !important;
      border: none !important;
    }
    body[data-dark-text="deep-dark"] .btn {
      background: #101010 !important; 
      border: none !important;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: calc(0px - var(--padding));
      left: calc(0px - var(--padding));
      width: calc(100% + var(--padding) * 2);
      height: calc(100% + var(--padding) * 2);

    const COURSE_ID_PARAM_KEYS = [
        'id', 'courseId', 'courseID', 'course', 'cid', 'c', 'key', 'courseKey',
        'selectedCourseId', 'selectedCourseID', 'currentCourseId', 'activeCourseId'
    ];

    function normalizeCourseId(rawValue) {
        if (rawValue === undefined || rawValue === null) return "";

        if (Array.isArray(rawValue)) {
            for (const item of rawValue) {
                const normalizedItem = normalizeCourseId(item);
                if (normalizedItem) return normalizedItem;
            }
            return "";
        }

        if (typeof rawValue === 'object') {
            return normalizeCourseId(
                rawValue.courseID || rawValue.courseId || rawValue.id || rawValue.key ||
                rawValue.slug || rawValue.coursePage || rawValue.page || ""
            );
        }

        let value = String(rawValue).trim();
        if (!value) return "";

        try { value = decodeURIComponent(value).trim(); } catch (e) {}

        if ((value.startsWith('{') && value.endsWith('}')) || (value.startsWith('[') && value.endsWith(']'))) {
            try {
                return normalizeCourseId(JSON.parse(value));
            } catch (e) {}
        }

        value = value.replace(/^['"]|['"]$/g, '').trim();
        value = value.split('#')[0].split('?')[0].trim();

        if (value.includes('/')) {
            const pathParts = value.split('/').filter(Boolean).reverse();
            for (const part of pathParts) {
                const normalizedPart = normalizeCourseId(part);
                if (normalizedPart) return normalizedPart;
            }
        }

        value = value.replace(/\.html?$/i, '').trim();

        const courseMatch = value.match(/course[^a-zA-Z0-9]*(\d+)/i) || value.match(/course(\d+)/i);
        if (courseMatch && courseMatch[1]) {
            return `course${courseMatch[1].padStart(3, '0')}`;
        }

        if (/^\d+$/.test(value)) {
            return `course${value.padStart(3, '0')}`;
        }

        return value;
    }

    function getCourseIdFromParams(params) {
        for (const key of COURSE_ID_PARAM_KEYS) {

            if (normalized) return normalized;

    }

    function resolveCourseDataById(courseDataRoot, requestedCourseId) {
        const normalizedRequestedId = normalizeCourseId(requestedCourseId);
        if (!courseDataRoot || typeof courseDataRoot !== 'object') {

        }

        const directKeys = [requestedCourseId, normalizedRequestedId]
            .map((key) => String(key || '').trim())
            .filter(Boolean);

        for (const key of directKeys) {
            if (courseDataRoot[key] && typeof courseDataRoot[key] === 'object') {
                return { courseId: key, courseData: courseDataRoot[key] };
            }
        }

        for (const key of Object.keys(courseDataRoot)) {
            const possibleCourse = courseDataRoot[key];
            if (!possibleCourse || typeof possibleCourse !== 'object') continue;

            const possibleIds = [
                key,
                possibleCourse.courseID,
                possibleCourse.courseId,
                possibleCourse.id,
                possibleCourse.key,
                possibleCourse.slug,
                possibleCourse.coursePage
            ].map((value) => normalizeCourseId(value)).filter(Boolean);

            if (possibleIds.includes(normalizedRequestedId)) {
                return { courseId: key, courseData: possibleCourse };
            }
        }

        return { courseId: normalizedRequestedId, courseData: null };
    }

    async function fetchCourseDataFromAirtable(courseId) {
        const normalizedCourseId = normalizeCourseId(courseId);
        const safeCourseId = normalizedCourseId.replace(/'/g, "\'");
        const filterFormula = `({courseID} = '${safeCourseId}')`;
        const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_NAME}?filterByFormula=${encodeURIComponent(filterFormula)}`;

        try {
            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${AIRTABLE_API_KEY}` }
            });

            if (!response.ok) throw new Error(`Airtable API Exception: ${response.status}`);

            const data = await response.json();
            if (data.records && data.records.length > 0) {
                const fields = data.records[0].fields;
                coursePrice = fields.coursePrice || coursePrice;
                courseTitle = fields.courseName || fields.CourseTitle || courseTitle;
                courseCommissionPercentage = fields.courseCommission || courseCommissionPercentage;
                
                await fetchEpisodeUrlFromAirtable(fields);
            }
        } catch (error) {
            console.warn("Airtable fallback applied.");
        }
    }

    async function fetchEpisodeUrlFromAirtable(fields) {
        if (fields) {
            const possibleFields = ['episode1Url', 'episodeUrl', 'videoUrl', 'embedUrl', 'video1Url', 'streamUrl', 'iframeUrl', 'link'];
            for (let f of possibleFields) {
                if (fields[f]) {
                    episodeStreamUrl = fields[f];
                    return;
                }
            }
        }

        const safeCourseId = normalizeCourseId(currentCourseId).replace(/'/g, "\'");
        const filterFormula = `({courseID} = '${safeCourseId}')`;
        const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/episodeData?filterByFormula=${encodeURIComponent(filterFormula)}`;

        try {
            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${AIRTABLE_API_KEY}` }
            });
            if (response.ok) {
                const resData = await response.json();
                if (resData.records && resData.records.length > 0) {
                    const epFields = resData.records[0].fields;
                    episodeStreamUrl = epFields.episodeUrl || epFields.videoUrl || epFields.streamUrl || epFields.url || episodeStreamUrl;
                    episodeNameValue = epFields.episodeName || epFields.title || episodeNameValue;
                    episodeDescValue = epFields.description || epFields.desc || episodeDescValue;
                }
            }
        } catch (e) {
            console.warn("Episode data fallbacks configured.");
        }
    }

    // Update the referrer's affiliate node: totalSales, availablePoints, totalEarnings.
    async function updateReferrerAffiliateData(referrerUid, priceForCourse, commissionPercentage) {

            let currentData = snapshot.val() || { totalSales: 0, totalEarnings: 0, availablePoints: 0, totalRefer: 0 };

            currentData.totalSales      = (currentData.totalSales || 0) + 1;
            currentData.availablePoints = parseFloat(((currentData.availablePoints || 0) + commissionAmount).toFixed(2));
            currentData.totalEarnings   = parseFloat(((currentData.totalEarnings   || 0) + commissionAmount).toFixed(2));

    // Update the admin's sales record: totalSales (+1) and totalEarn (+remainder).
    async function updateAdminSalesData(adminUid, priceForCourse, commissionPercentage) {
        console.log("Attempting to update admin sales data for:", adminUid);
        if (!database || !adminUid || adminUid === "YOUR_ACTUAL_ADMIN_FIREBASE_UID_HERE") {
            console.error("Admin UID for sales not set. Skipping admin sales data update.");
            return;
        }
        const adminSalesRef = database.ref(`admins/${adminUid}/totalSales`);
        const adminEarnRef  = database.ref(`admins/${adminUid}/totalEarn`);
        try {
            const commissionAmount = parseFloat((Number(priceForCourse) * Number(commissionPercentage)).toFixed(2));
            const remainingBalance = parseFloat((Number(priceForCourse) - commissionAmount).toFixed(2));
            const salesSnapshot = await adminSalesRef.once('value');
            const currentSales = salesSnapshot.val() || 0;
            await adminSalesRef.set(currentSales + 1);
            const earnSnapshot = await adminEarnRef.once('value');
            const currentEarn = earnSnapshot.val() || 0;
            await adminEarnRef.set(parseFloat((currentEarn + remainingBalance).toFixed(2)));
            console.log(`Admin ${adminUid} totalSales -> ${currentSales + 1}, totalEarn -> ${parseFloat((currentEarn + remainingBalance).toFixed(2))}`);
        } catch (error) {
            console.error("Error updating admin sales data:", error);
        }
    }

    // keep working. Fires the referrer + admin updates with per-enrollment
    // localStorage idempotency keys, exactly like course002.html.
    function processAffiliateCommission(price) {
        if (!database || !currentUserUid) return;
        const priceForCourse = (function(){
            let p = parseFloat(price);
            if (isNaN(p) || p < 0) p = parseFloat(coursePrice) || 0;
            return p;
        })();
        const commissionPercentage = parseFloat(courseCommissionPercentage) || 0;

        const referrerUpdatedKey = `referrerUpdated_${currentCourseId}_${currentUserUid}`;
        const adminUpdatedKey    = `adminUpdated_${currentCourseId}_${currentUserUid}`;

        const finalReferrerUid = currentUsersReferrerUid && currentUsersReferrerUid !== currentUserUid
            ? currentUsersReferrerUid : null;

        if (finalReferrerUid && getLocalStorageItem(referrerUpdatedKey, '') !== 'true') {
            updateReferrerAffiliateData(finalReferrerUid, priceForCourse, commissionPercentage);
            try { setLocalStorageItem(referrerUpdatedKey, 'true'); } catch(e){}
        } else if (!finalReferrerUid) {
            console.log("[Affiliate] No referrer for current user — skipping referrer credit.");
        } else {
            console.log("[Affiliate] Referrer already credited for this enrollment.");
        }

        if (ADMIN_UID_FOR_SALES && getLocalStorageItem(adminUpdatedKey, '') !== 'true') {
            updateAdminSalesData(ADMIN_UID_FOR_SALES, priceForCourse, commissionPercentage);
            try { setLocalStorageItem(adminUpdatedKey, 'true'); } catch(e){}
        }
    }

                    database.ref(`courseData/${currentCourseId}`).once('value').then((snap) => {
                        const cd = snap.val() || {};
                        const unlocked = cd.unlockCourseBanner || cd.courseUnlockBanner ||
                                         (cd.enrollmentScreen && (cd.enrollmentScreen.unlockCourseBanner || cd.enrollmentScreen.courseUnlockBanner)) || '';
                        const fallback = cd.courseBanner || pendingLoadedData.courseBanner || (courseBanner ? courseBanner.src : '');
                        const finalBanner = unlocked || fallback;
                        if (courseBanner && finalBanner && courseBanner.src !== finalBanner) {
                            const pre = new Image();
                            pre.onload = () => {
                                {
                                    courseBanner.src = finalBanner;
                                    courseBanner.style.display = 'block';
                                    courseBanner.classList.add('blur-fade-in');
                                };
                            };
                            pre.onerror = () => {
                                if (fallback && courseBanner.src !== fallback) courseBanner.src = fallback;
                            };
                            pre.src = finalBanner;
                        }
                        if (unlocked) pendingLoadedData.courseUnlockBanner = unlocked;
                        if (cd.courseBanner) pendingLoadedData.courseBanner = cd.courseBanner;

                        // Ensure database video streams are automatically upgraded to direct high quality files
                        if (currentUserUid && cd) {
                            autoUpdateVideoUrlInFirebase(currentCourseId, cd);

                        if (cd.episodes) {
                            pendingLoadedData.episodes = cd.episodes;

                applyUnlockBanner();

        });

    let globalAudioCtx = null;
    function getGlobalAudioCtx() {
        if (!globalAudioCtx) {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) globalAudioCtx = new Ctx();
            } catch(e) {}
        }
        if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
            globalAudioCtx.resume().catch(() => {});
        }
        return globalAudioCtx;
    }

    // Unified AudioContext SFX engines triggered reliably on every interaction
    function playClickSFX() {
        try {
            const soundOption = getLocalStorageItem('appSoundEffects', getLocalStorageItem('soundEffects', 'enabled'));
            if (soundOption === 'disabled' || soundOption === 'false') return;

            const ctx = getGlobalAudioCtx();
            if (!ctx) return;
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
            
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.exponentialRampToValueAtTime(0.15, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start(t);
            osc.stop(t + 0.08);
        } catch (e) {}
    }

    function playSuccessSFX() {
        try {
            const soundOption = getLocalStorageItem('appSoundEffects', getLocalStorageItem('soundEffects', 'enabled'));
            if (soundOption === 'disabled' || soundOption === 'false') return;

            const ctx = getGlobalAudioCtx();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, t0); 
            osc1.frequency.setValueAtTime(659.25, t0 + 0.1); 
            
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(1046.50, t0 + 0.1); 
            
            gain.gain.setValueAtTime(0.001, t0);
            gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
            
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            
            osc1.start(t0);
            osc2.start(t0);
            osc1.stop(t0 + 0.6);
            osc2.stop(t0 + 0.6);
        } catch(e) {}
    }

    function playCancelSFX() {
        try {
            const soundOption = getLocalStorageItem('appSoundEffects', getLocalStorageItem('soundEffects', 'enabled'));
            if (soundOption === 'disabled' || soundOption === 'false') return;

            const ctx = getGlobalAudioCtx();

    // Live theme sync — mirror whichever mode LearnEra switched to
    // (light, dark colorful, deep-dark) without needing a page reload.
    (function setupLiveThemeSync(){
        try {
            // 1) Another tab / LearnEra writes to localStorage -> re-apply.
            window.addEventListener('storage', function(ev){
                if (!ev) return;
                if (ev.key === 'appThemeMode' || ev.key === 'darkTextStyle' || ev.key === null) {
                    applyAppSelectedTheme();
                }
            });
            // 2) System color-scheme flipped while 'system' is selected.
            if (window.matchMedia) {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                const onChange = function(){ applyAppSelectedTheme(); };
                if (mq.addEventListener) mq.addEventListener('change', onChange);
                else if (mq.addListener) mq.addListener(onChange);
            }
            // 3) Returning to this tab from LearnEra -> re-pull latest theme.
            document.addEventListener('visibilitychange', function(){
                if (document.visibilityState === 'visible') applyAppSelectedTheme();
            });
            window.addEventListener('focus', applyAppSelectedTheme);
            // 4) Parent (LearnEra iframe host) can postMessage theme updates directly.
            window.addEventListener('message', function(ev){
                const d = ev && ev.data;
                if (!d || typeof d !== 'object') return;
                if (d.type === 'learnera:theme' || d.appThemeMode || d.darkTextStyle) {
                    try {
                        if (d.appThemeMode)  setLocalStorageItem('appThemeMode', d.appThemeMode);
                        if (d.darkTextStyle) setLocalStorageItem('darkTextStyle', d.darkTextStyle);
                    } catch(e){}
                    applyAppSelectedTheme();
                }
            });
        } catch(e) {
            console.warn('Theme sync setup failed:', e);
        }
    })();

    // Dynamic course switching: same screen, different courseID, no reload.
    window.switchCourse = function(rawCourseId) {
        try {
            const next = normalizeCourseId(rawCourseId);
            if (!next || next === currentCourseId) return;

            // Detach any open listeners on the previous course (root + per-course nodes).
            try {
                if (database) {
                    if (window.__courseDataRootRef) { try { window.__courseDataRootRef.off(); } catch(e){} window.__courseDataRootRef = null; }
                    database.ref(`courseEnrollments/${currentCourseId}`).off();
                    database.ref(`courseData/${currentCourseId}`).off();
                }
            } catch(e){}

            currentCourseId = next;
            window.isEnrolledGlobal = false;
            isFirebaseDataFullyLoaded = false;
            isBannerImageFullyLoaded = false;

            // Reset cached episode + banner data so the new course's episodes node
            // re-renders dynamically without leftovers from the previous course.
            try {
                pendingLoadedData.episodes = null;
                pendingLoadedData.courseBanner = "";
                pendingLoadedData.courseDarkBanner = "";
                pendingLoadedData.courseUnlockBanner = "";
                pendingLoadedData.highlight1 = null;
                pendingLoadedData.highlight2 = null;
                pendingLoadedData.highlight3 = null;
            } catch(e){}

            // Immediately clear visible episode lists so user sees a fresh state.
            try {
                const lockedC = document.getElementById('lockedEpisodesList');
                const unlockedC = document.getElementById('unlockedEpisodesList');
                if (lockedC) lockedC.innerHTML = '';
                if (unlockedC) unlockedC.innerHTML = '';
                const epsSkel = document.getElementById('episodesSkeletonList');
                if (epsSkel) epsSkel.style.display = 'block';
            } catch(e){}

            // Stop any playing video and forget its src so quality switch can't restore it.
            try { window.__currentEpisodeSrc = null; } catch(e){}

            try { setLocalStorageItem('selectedCourseId', next); } catch(e){}
            try { sessionStorage.setItem('selectedCourseId', next); } catch(e){}

            // Reflect in URL so reloads land on the same course.
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('courseId', next);
                window.history.replaceState({}, '', url.toString());
            } catch(e){}

            // Reset visible state then re-bootstrap data pipelines for the new course.
            try { window.closeEpisodePlayer && window.closeEpisodePlayer(); } catch(e){}
            try { lockCourseContent(); } catch(e){}
            try { fetchEnrollmentDataFromFirebase(); } catch(e){}
            try { setupEnrollmentListener(); } catch(e){}
            fetchCourseDataFromAirtable(currentCourseId).catch(function(err){
                console.warn('Course switch Airtable sync skipped:', err);
            });
            console.log('[CourseSwitch] active courseID ->', currentCourseId, '| episodes node will reload dynamically');
        } catch(e) {
            console.error('switchCourse failed:', e);
        }
    };

    // Any element with [data-course-switch="courseXYZ"] becomes a course button.
    document.addEventListener('click', function(ev){
        const t = ev.target && ev.target.closest && ev.target.closest('[data-course-switch]');
        if (!t) return;
        const id = t.getAttribute('data-course-switch');
        if (id) { ev.preventDefault(); window.switchCourse(id); }
    });

    // React to hash / popstate course changes (e.g. user pastes ?courseId=course003).
    window.addEventListener('hashchange', function(){
        const id = getDynamicCourseId();
        if (id && id !== currentCourseId) window.switchCourse(id);
    });
    window.addEventListener('popstate', function(){
        const id = getDynamicCourseId();
        if (id && id !== currentCourseId) window.switchCourse(id);
    });
    // Parent can also drive course switching via postMessage.
    window.addEventListener('message', function(ev){
        const d = ev && ev.data;
        if (!d || typeof d !== 'object') return;
        if (d.type === 'learnera:switchCourse' && d.courseId) {

  <script>
    const SurfaceEquations = { 
        convex_squircle: (x) => Math.pow(1 - Math.pow(1 - x, 4), 1 / 4) 
    };

    class Spring { 
        constructor(v, s = 300, d = 20) { 
            this.value = v; 
            this.target = v; 
            this.velocity = 0; 
            this.stiffness = s; 
            this.damping = d; 
        } 
        setTarget(t) { 
            this.target = t; 
        } 
        update(dt) { 
            const f = (this.target - this.value) * this.stiffness;
            const df = this.velocity * this.damping; 
            this.velocity += (f - df) * dt; 
            this.value += this.velocity * dt; 
            return this.value; 
        } 
        isSettled() { 
            return Math.abs(this.target - this.value) < 0.001 && Math.abs(this.velocity) < 0.001; 
        } 
    }

    function calculateDisplacementMap1D(gt, bw, sf, ri, s = 128) { 
        const e = 1 / ri;
        const r =[]; 
        for (let i = 0; i < s; i++) { 
            const x = i / s;
            const y = sf(x);
            const dx = x < 1 ? 0.0001 : -0.0001;
            const d = (sf(Math.max(0, Math.min(1, x + dx))) - y) / dx;
            const m = Math.sqrt(d * d + 1);
            const n =[-d / m, -1 / m];
            const dt = n[1];
            const k = 1 - e * e * (1 - dt * dt); 
            
            if (k < 0) {
                r.push(0); 
            } else { 
                const rf =[
                    -(e * dt + Math.sqrt(k)) * n[0], 
                    e - (e * dt + Math.sqrt(k)) * n[1]
                ]; 
                r.push(rf[0] * ((y * bw + gt) / rf[1])); 
            } 
        } 
        return r; 
    }

    function calculateDisplacementMap2D(cw, ch, ow, oh, rad, bw, md, pMap) { 
        const img = new ImageData(cw, ch); 
        for (let i = 0; i < img.data.length; i += 4) {
            img.data[i] = 128;
            img.data[i + 1] = 128;
            img.data[i + 3] = 255;
        } 
        const rSq = rad * rad;
        const rp1Sq = (rad + 1) ** 2;
        const rmBwSq = Math.max(0, rad - bw) ** 2;
        const wB = ow - rad * 2;
        const hB = oh - rad * 2;
        const oX = (cw - ow) / 2;
        const oY = (ch - oh) / 2; 

        for (let y1 = 0; y1 < oh; y1++) {
            for (let x1 = 0; x1 < ow; x1++) {
                const idx = ((oY + y1) * cw + oX + x1) * 4;
                const x = x1 < rad ? x1 - rad : x1 >= ow - rad ? x1 - rad - wB : 0;
                const y = y1 < rad ? y1 - rad : y1 >= oh - rad ? y1 - rad - hB : 0;
                const dSq = x * x + y * y; 

                if (dSq <= rp1Sq && dSq >= rmBwSq) {
                    const dist = Math.sqrt(dSq);
                    const op = dSq < rSq ? 1 : 1 - (dist - rad) / (Math.sqrt(rp1Sq) - rad);
                    const bIdx = Math.floor(Math.max(0, Math.min(1, (rad - dist) / bw)) * pMap.length);
                    const dVal = pMap[Math.max(0, Math.min(bIdx, pMap.length - 1))] || 0;
                    const dX = md > 0 ? (-(dist > 0 ? x / dist : 0) * dVal) / md : 0;
                    const dY = md > 0 ? (-(dist > 0 ? y / dist : 0) * dVal) / md : 0; 

                    img.data[idx] = Math.max(0, Math.min(255, 128 + dX * 127 * op)); 
                    img.data[idx + 1] = Math.max(0, Math.min(255, 128 + dY * 127 * op));
                }
            }
        } 
        return img; 
    }

    function calculateSpecularHighlight(ow, oh, rad, bw) { 
        const img = new ImageData(ow, oh);
        const sVec =[Math.cos(Math.PI / 3), Math.sin(Math.PI / 3)];
        const rSq = rad * rad;
        const rp1Sq = (rad + 1) ** 2;
        const rmSSq = Math.max(0, (rad - 1.5) ** 2); 

        for (let y1 = 0; y1 < oh; y1++) {
            for (let x1 = 0; x1 < ow; x1++) {
                const x = x1 < rad ? x1 - rad : x1 >= ow - rad ? x1 - rad - (ow - rad * 2) : 0;
                const y = y1 < rad ? y1 - rad : y1 >= oh - rad ? y1 - rad - (oh - rad * 2) : 0;
                const dSq = x * x + y * y; 

                if (dSq <= rp1Sq && dSq >= rmSSq) {
                    const dist = Math.sqrt(dSq);
                    const op = dSq < rSq ? 1 : 1 - (dist - rad) / (Math.sqrt(rp1Sq) - rad);
                    const dp = Math.abs((dist > 0 ? x / dist : 0) * sVec[0] + (dist > 0 ? -y / dist : 0) * sVec[1]);
                    const cf = dp * Math.sqrt(1 - (1 - Math.max(0, Math.min(1, (rad - dist) / 1.5))) ** 2);
                    const c = Math.min(255, 255 * cf);
                    const idx = (y1 * ow + x1) * 4; 

                    img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = c; 
                    img.data[idx + 3] = Math.min(255, c * cf * op);
                }
            }
        } 
        return img; 
    }

        const volState = { value: 100, isDragging: false };

        } 

        const brightState = { value: 0, isDragging: false }; 
        const brightSprings = {

        }; 
        
        const brightContainer = document.getElementById('enhanceContainer');

        let physicsFrameId = null;

        function runPhysicsLoop() {
            const dt = Math.min(0.032, 1 / 60); 

            let volOverpull = 0; 
            if (volState.value > 100) volOverpull = volState.value - 100; 
            else if (volState.value < 0) volOverpull = volState.value; 
            
            volSprings.squishY.setTarget(Math.max(0.65, Math.min(1.35, 1.0 + (volOverpull * 0.006)))); 
            volSprings.squishX.setTarget(Math.max(0.75, Math.min(1.25, 1.0 - (volOverpull * 0.003)))); 
            
            let volVisualVal = Math.max(0, Math.min(100, volState.value)); 
            volSprings.fill.setTarget(volVisualVal); 
            
            const vf = volSprings.fill.update(dt), vsy = volSprings.squishY.update(dt), vsx = volSprings.squishX.update(dt); 
            
            volFill.style.height = `${vf}%`; 
            volGlass.style.transform = `scale(${vsx}, ${vsy})`; 
            document.getElementById("volDisplacementMap").setAttribute("scale", config.maxDisp * vsx); 
            
            if (!useBackdropFilter) { 
                const areaRect = mediaContainer.getBoundingClientRect(); 
                volCloneWorld.style.width = areaRect.width + "px"; 
                volCloneWorld.style.height = areaRect.height + "px"; 
                const offsetLeft = (areaRect.width - config.width) / 2; 
                const offsetTop = (areaRect.height - config.height) / 2; 
                volCloneWorld.style.transform = `scale(${1 / vsx}, ${1 / vsy}) translate(${-offsetLeft}px, ${-offsetTop - config.height}px)`; 
            } 

            let brightOverpull = 0; 
            if (brightState.value > 100) brightOverpull = brightState.value - 100; 
            else if (brightState.value < 0) brightOverpull = brightState.value; 
            
            brightSprings.squishY.setTarget(Math.max(0.65, Math.min(1.35, 1.0 + (brightOverpull * 0.006)))); 
            brightSprings.squishX.setTarget(Math.max(0.75, Math.min(1.25, 1.0 - (brightOverpull * 0.003)))); 
            
            let brightVisualVal = Math.max(0, Math.min(100, brightState.value)); 
            brightSprings.fill.setTarget(brightVisualVal); 
            
            const bf = brightSprings.fill.update(dt), bsy = brightSprings.squishY.update(dt), bsx = brightSprings.squishX.update(dt); 
            
            brightFill.style.height = `${bf}%`; 
            brightGlass.style.transform = `scale(${bsx}, ${bsy})`; 
            document.getElementById("enhanceDisplacementMap").setAttribute("scale", config.maxDisp * bsx); 
            
            if (!useBackdropFilter) { 
                const areaRect = mediaContainer.getBoundingClientRect(); 
                brightCloneWorld.style.width = areaRect.width + "px"; 
                brightCloneWorld.style.height = areaRect.height + "px"; 
                const offsetLeft = (areaRect.width - config.width) / 2; 
                const offsetTop = (areaRect.height - config.height) / 2; 
                brightCloneWorld.style.transform = `scale(${1 / bsx}, ${1 / bsy}) translate(${-offsetLeft}px, ${-offsetTop - config.height}px)`; 
            } 

            const volSettled = Object.values(volSprings).every(sp => sp.isSettled());
            const brightSettled = Object.values(brightSprings).every(sp => sp.isSettled());

            if (!volSettled || !brightSettled) {
                physicsFrameId = requestAnimationFrame(runPhysicsLoop);
            } else {
                physicsFrameId = null;
            }
        }

        function wakePhysics() {
            if (!physicsFrameId) {
                physicsFrameId = requestAnimationFrame(runPhysicsLoop);
            }
        }

        function updateEnhancementFilters() {
            let val = Math.max(0, Math.min(100, brightState.value));
            let contrastVal = 100 + (val / 100) * 20;   
            let saturateVal = 100 + (val / 100) * 25;

        /* Swipe Gesture Engine with Slider 1 second autohide configuration */
        let touchStartX = 0, touchStartY = 0;

        const activeTitle = document.getElementById('sliderActiveTitle');

        function resetSliderInactivityTimer() {
            clearTimeout(sliderInactivityTimeout);
            sliderInactivityTimeout = setTimeout(() => {
                volContainer.style.opacity = '0';
                brightContainer.style.opacity = '0';
                activeTitle.classList.remove('show');
                mediaContainer.classList.remove('slider-active');
                
                setTimeout(() => {
                    volContainer.style.display = 'none';

            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            if (gestureType === null) {
                if (Math.abs(deltaY) > 10 || Math.abs(deltaX) > 10) {
                    if (Math.abs(deltaY) > Math.abs(deltaX)) {
                        gestureType = 'vertical';
                        if (touchStartX < screenWidth / 2) {

            const episodeSrc = window.__currentEpisodeSrc || '';
            const currentSrc = video.currentSrc || video.src || '';

            }, { passive: true });
        }

        window.playEpisode = function(title, epNumber, videoURL, description, episode) {
            if (!window.isEnrolledGlobal) {
                try { (window.showToast && window.showToast('Please enroll to watch episodes.')); } catch(e){}
                console.warn('[Player] Blocked: user not enrolled.');
                return;
            }
            episode = episode || {};

            var header = document.getElementById('episodePlayerHeader');
            if (header) header.textContent = 'Episode Player';

            var ttl       = document.getElementById('episodePlayTitle');
            var subEl     = document.getElementById('episodePlaySubtitle');
            var metaEpEl  = document.getElementById('episodeMetaEp');
            var metaDurEl = document.getElementById('episodeMetaDuration');
            var desc      = document.getElementById('episodePlayDesc');
            var srcWrap   = document.getElementById('episodeSourcesWrapper');
            var srcList   = document.getElementById('episodeSourceLinks');

            if (ttl)    ttl.textContent    = title || 'Episode';
            if (subEl)  { subEl.textContent = episode.subtitle || ''; subEl.style.display = episode.subtitle ? 'block' : 'none'; }
            if (metaEpEl)  metaEpEl.textContent  = 'Episode ' + (epNumber || 1);
            if (metaDurEl) metaDurEl.textContent = 'Duration: ' + (episode.duration || '—');
            if (desc)   desc.textContent   = description || episode.description || '';

            if (srcWrap && srcList) {
                srcList.innerHTML = '';
                var links = episode.sourceLinks;
                var entries = [];
                var hasData = links && typeof links === 'object' && Object.keys(links).length > 0;
                if (hasData) {
                    Object.keys(links).sort(function(a,b){
                        return (parseInt(a)||0) - (parseInt(b)||0);
                    }).forEach(function(k){
                        var val = links[k];
                        var url = val;
                        var label = k;
                        if (typeof val === 'object' && val) {
                            url = val.url || val.link || val.href || '';
                            label = val.title || val.label || val.name || val.value || k;
                        }
                        if (url && typeof url === 'string' && url.trim()) entries.push({ label: label, url: url.trim() });
                    });
                }
                if (entries.length > 0) {
                    entries.forEach(function(e){
                        var a = document.createElement('a');
                        a.href = e.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
                        a.textContent = e.label; 
                        a.style.cssText = 'font-size:0.78em; font-weight:700; color: var(--text-color); background: var(--body-bg); border-radius: 12px; padding: 8px 12px; box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.6); text-decoration:none; display:inline-flex; align-items:center; gap:6px; margin-bottom: 8px;';
                        srcList.appendChild(a);
                    });
                    srcWrap.style.display = 'block';
                } else {
                    srcWrap.style.display = 'none';
                }
            }

            var v = getPlayerVideo();
            if (v) {
                try { v.pause(); } catch(e){}
                try { v.loop = true; v.setAttribute('loop', ''); } catch(e){}
                try { v.setAttribute('preload', 'metadata'); v.preload = 'metadata'; } catch(e){}
                try { v.removeAttribute('autoplay'); v.autoplay = false; } catch(e){}
                var poster = episode.thumbnailURL || episode.thumbnailUrl || episode.thumbnail ||
                             episode.poster || episode.posterURL || episode.image || episode.imageURL || episode.cover || '';
                if (poster) { v.setAttribute('poster', poster); v.poster = poster; }
                else { v.removeAttribute('poster'); }
                var src = videoURL || episode.videoURL || episode.videoUrl || episode.video_url ||
                          episode.video || episode.url || episode.streamUrl || episode.embedUrl || episode.link || '';
                if (src) {
                    window.__currentEpisodeSrc = src;
                    try {
                        var srcs = v.querySelectorAll('source');
                        for (var i = 0; i < srcs.length; i++) srcs[i].parentNode.removeChild(srcs[i]);
                    } catch(e){}
                    v.setAttribute('src', src);
                    v.src = src;
                    try { v.load(); } catch(e){}
                    console.log('[Player] Episode src set ->', src);
                } else {
                    console.warn('[Player] Episode has no videoURL in Firebase node:', episode);
                }
            }

            var screen = document.getElementById('episodePlayerArrangement');
            if (screen) {
                resetHeaderAnimations(screen);
                screen.style.display = 'flex';
                screen.style.opacity = '1';
                try { screen.scrollTop = 0; } catch(e){}
                var contentArea = screen.querySelector('.theme-content-area');
                if (contentArea) { 
                    try { contentArea.scrollTop = 0; } catch(e){} 
                    playerLastY.value = 0;
                }
                setTimeout(function() {
                    playHeaderAnimations(screen);
                }, 50);
            }

            if (!window.isPlayerOpenState) {
                window.isPlayerOpenState = true;
                window.history.pushState({ playerOpen: true }, '');
            }

            var inFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (inFullscreen) {
                setTimeout(function(){
                    if (v) { v.play().catch(function(){}); }
                }, 150);
            }
        };

        window.closeEpisodePlayer = function() {
            var screen = document.getElementById('episodePlayerArrangement');
            if (screen) screen.style.display = 'none';
            var v = getPlayerVideo();
            if (v) {
                try { v.pause(); } catch(e){}
            }

            if (window.isPlayerOpenState) {
                window.isPlayerOpenState = false;
                if (window.history.state && window.history.state.playerOpen) {
                    window.history.back();
                }
            }
        };
    })();
  </script>

</body>
</html>
