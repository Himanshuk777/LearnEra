<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnEra - News Hub</title>
    
    <!-- External Font Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- React & Babel CDN Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Early theme bootstrap -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('appThemeMode') || 'system';
                const isDark = savedTheme === 'dark' ||
                    (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.setAttribute('data-dark-text', darkStyle);
                } else {
                    document.documentElement.removeAttribute('data-dark-text');
                }
                const topSp = localStorage.getItem('appTopSpace') || '5';
                document.documentElement.style.setProperty('--top-space', topSp + 'vh');
            } catch (e) {
                document.documentElement.style.setProperty('--top-space', '5vh');
            }
            const savedLang = localStorage.getItem('appLanguageSelection') || 'en';
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>

    <style>
        /* CSS Reset Elements */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* Color Tokens & Global Variables */
        :root {
            --body-bg: #e6edf7; 
            --neu-shadow-light: #ffffff;
            --neu-shadow-dark: #c8d3e4;
            
            --text-color: #2d3748; 
            --sub-text-color: #718096; 
            --blue: #1E90FF;
            --select-active-color: #1E90FF;
            --divider-color: rgba(138, 43, 226, 0.15);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
            
            --top-space: 5vh;
            --transition-theme: background-color 0.8s ease, color 0.8s ease, box-shadow 0.8s ease, border-color 0.8s ease;

            /* LearnEra Header Gradient Outline Tokens */
            --header-gradient: linear-gradient(135deg, #8A2BE2, #a158e6, #DA70D6);
        }

        /* Standard Dark Mode Modifiers */
        html[data-theme="dark"] {
            --body-bg: #1e1e24; 
            --neu-shadow-dark: #101014;
            --neu-shadow-light: rgba(255, 255, 255, 0.05);
            
            --text-color: #d1d9e6; 
            --sub-text-color: #a3b1c6; 
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.02);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.02);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.02);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 5px rgba(255, 255, 255, 0.03);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
        }

        /* Deep-Dark Mode Specific Styles */
        html[data-dark-text="deep-dark"] {
            --body-bg: #0c0c0f; 
            --neu-shadow-dark: #050506;
            --divider-color: rgba(255, 255, 255, 0.04);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.01);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.01);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.01);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.01);
            
            --blue: #7a8b9e;
            --select-active-color: #7a8b9e;
            --header-gradient: linear-gradient(135deg, #7a8b9e, #55555d);
        }

        html[data-dark-text="deep-dark"] *,
        html[data-dark-text="deep-dark"] i,
        html[data-dark-text="deep-dark"] h3,
        html[data-dark-text="deep-dark"] h4,
        html[data-dark-text="deep-dark"] p,
        html[data-dark-text="deep-dark"] span,
        html[data-dark-text="deep-dark"] li,
        html[data-dark-text="deep-dark"] button,
        html[data-dark-text="deep-dark"] input {
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] img,
        html[data-dark-text="deep-dark"] .news-card-banner {
            filter: grayscale(100%) brightness(0.75) opacity(0.8) !important;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border-color: #55555d !important;
        }

        /* Custom Scrollbar Visual Hidden Settings */
        ::-webkit-scrollbar {
            display: none !important;
        }

        /* Enabled natural scrolling heights to fire native browser window scroll listeners */
        html, body {
            width: 100%;
            min-height: 100%; 
            background-color: var(--body-bg);
            color: var(--text-color);
            overscroll-behavior: none;
            font-family: 'Poppins', sans-serif !important;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            font-size: 13px; 
            transition: var(--transition-theme);
            padding-top: var(--top-space);
        }

        /* Layout Framework Container */
        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px 15px 15px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: flex-start;
            height: auto;
            min-height: 100%;
        }

        /* Main Content Section Card with Gradient Outline Style */
        .app-card {
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            border-radius: 20px;
            padding: 20px;
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            display: flex;
            flex-direction: column;
            transition: var(--transition-theme);
            height: auto;
            width: 100%;
            z-index: 1;
        }

        html[data-dark-text="deep-dark"] .app-card {
            border: 1.5px solid rgba(180, 180, 180, 0.22) !important;
            background: #0c0c0f !important;
        }

        /* Header Floating Controls Card with Gradient Outline Style */
        .floating-controls-panel {
            position: sticky;
            top: 15px;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            padding: 16px;
            border-radius: 20px;
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            z-index: 1000 !important;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, visibility 0.4s ease;
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
            will-change: transform, opacity;
        }

        .floating-controls-panel.hidden {
            transform: translateY(-130%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        html[data-dark-text="deep-dark"] .floating-controls-panel {
            background: #0c0c0f !important;
            border: 1.5px solid rgba(180, 180, 180, 0.22) !important;
        }

        @media (max-width: 768px) {
            .floating-controls-panel {
                margin-bottom: 16px !important;
            }
        }
        @media (min-width: 769px) {
            .floating-controls-panel {
                margin-bottom: 0px !important;
            }
        }

        /* Search Input Wrapper: Neumorphic Inset default, Gradient Outline when Active */
        .search-wrapper {
            position: relative;
            width: 100%;
            height: 44px;
            border-radius: 14px;
            background: var(--body-bg);
            border: 1.5px solid transparent;
            transition: all 0.3s ease;
        }

        .search-wrapper:focus-within {
            border: 1.5px solid transparent;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            box-shadow: none !important;
        }

        .search-input {
            width: 100%;
            height: 100%;
            padding: 0 16px 0 42px;
            border: none;
            border-radius: 12px;
            background: var(--body-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif !important;
            font-size: 0.95em;
            font-weight: 500;
            box-shadow: var(--settings-shadow-inset-sharp);
            outline: none;
            transition: box-shadow 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-wrapper:focus-within .search-input {
            box-shadow: none;
            background: transparent;
        }

        /* Search Icon: Standard grey idle, Gradient Color when Search Bar Active */
        .search-wrapper-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--sub-text-color);
            font-size: 1.05em;
            pointer-events: none;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .search-wrapper:focus-within .search-wrapper-icon {
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        html[data-dark-text="deep-dark"] .search-wrapper:focus-within .search-wrapper-icon {
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: initial !important;
            color: #7a8b9e !important;
        }

        /* Search wrapper skeleton loading effect - exact height matching real textbox */
        .search-wrapper.skeleton-loading {
            border-color: transparent !important;
            aspect-ratio: auto !important;
            height: 44px !important;
            min-height: 44px !important;
            max-height: 44px !important;
            border-radius: 14px !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
        }

        /* Categories Scroller */
        .categories-filter-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 2px;
        }

        /* Category pills: Grey outline style when inactive, Gradient Outline when ACTIVE */
        .category-pill {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            background: transparent !important;
            color: var(--sub-text-color);
            box-shadow: none !important;
            border: 1.5px solid rgba(150, 150, 150, 0.35) !important;
            transition: all 0.2s ease;
        }

        html[data-theme="dark"] .category-pill {
            border: 1.5px solid rgba(180, 180, 180, 0.30) !important;
        }

        .category-pill:active {
            transform: scale(0.95);
        }

        /* Category pill Active State: Gradient Outline */
        .category-pill.active {
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            color: #8A2BE2 !important;
            font-weight: 700;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border: 1.5px solid rgba(122, 139, 158, 0.3) !important;
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] .category-pill.active {
            border: 1.5px solid #7a8b9e !important;
            background: #0c0c0f !important;
            color: #7a8b9e !important;
        }

        /* News cards grid layout */
        .news-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            overflow: visible;
        }

        /* News Card with ListScrollingEffect animation (No gradient outline on news cards) */
        .news-card {
            background: var(--body-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow-micro);
            border: 1px solid rgba(255,255,255,0.25);
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.15s ease;
            will-change: transform, opacity;
        }

        .news-card.in-view {
            opacity: 1;
            transform: scale(1);
        }

        html[data-theme="dark"] .news-card {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .news-card-banner {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .news-card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .news-title {
            font-size: 1.05em;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.3;
        }

        .news-desc {
            font-size: 0.82em;
            color: var(--sub-text-color);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78em;
            font-weight: 700;
            color: var(--sub-text-color);
            margin-top: 5px;
        }

        .news-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .news-meta i {
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        html[data-dark-text="deep-dark"] .news-meta i {
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: initial !important;
            color: #7a8b9e !important;
        }

        /* Action Pill button elements */
        .back-pill-button {
            position: relative;
            background: var(--body-bg);
            color: var(--text-color);
            border: 2px solid var(--body-bg);
            border-radius: 16px;
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.7);
            z-index: 70;
            transition: transform 0.15s ease, box-shadow 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            font-weight: 600;
        }

        .back-pill-button:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 4px var(--neu-shadow-dark) !important;
        }

        /* Shimmer Loading Skeletons rules */
        .skeleton-loading {
            background: var(--body-bg) !important;
            border-color: transparent !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
            color: transparent !important;
            pointer-events: none !important;
            position: relative !important;
            overflow: hidden !important;
            height: 140px !important;
            border-radius: 20px;
            opacity: 0.75;
        }

        .skeleton-loading * {
            visibility: hidden !important;
        }

        .skeleton-loading::after {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            animation: skeleton-shimmer-animation 2.5s linear infinite;
        }
        body[data-theme="dark"] .skeleton-loading::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }
        @keyframes skeleton-shimmer-animation {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        @media (min-width: 768px) {
            body {
                justify-content: center;
                align-items: center;
                padding-bottom: 40px;
            }
        }

        /* ============================================================
           LearnEra Unified Header (identical to Laws.html header)
           ============================================================ */
        :root {
            --learnera-purple: #7c3aed;
            --learnera-pink: #ec4899;
            --themed-blue: var(--blue);
            --header-outline-start: var(--learnera-purple);
            --header-outline-end: var(--learnera-pink);
            --icon-gradient-start: var(--learnera-purple);
            --icon-gradient-end: var(--learnera-pink);
            --search-bar-bg: var(--body-bg);
            --search-icon-theme: var(--learnera-purple);
            --search-input-color: var(--learnera-purple);
            --search-input-placeholder-color: #a3b1c6;
        }

        html[data-theme="dark"] {
            --search-icon-theme: var(--learnera-purple);
            --search-input-color: var(--learnera-purple);
        }

        /* Deep Dark monochrome replaces every accent and outline. */
        html[data-theme="dark"][data-dark-text]:not([data-dark-text="colorful"]) {
            --blue: #ffffff;
            --select-active-color: #ffffff;
            --themed-blue: #ffffff;
            --search-input-color: #ffffff;
            --search-input-placeholder-color: #9b9b9f;
            --header-outline-start: #080808;
            --header-outline-end: #ffffff;
            --icon-gradient-start: #080808;
            --icon-gradient-end: #ffffff;
        }

        body {
            padding-top: 0 !important;
        }

        .app-container {
            padding-top: 0 !important;
            gap: 15px;
        }

        /* Neumorphic header with a LearnEra outline and no lower shadow. */
        .header-card {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            width: calc(100% + 30px);
            margin: 0 -15px;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            border-bottom-left-radius: 20px !important;
            border-bottom-right-radius: 20px !important;
            padding: 20px;
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background:
                linear-gradient(var(--body-bg), var(--body-bg)) padding-box,
                linear-gradient(110deg, var(--header-outline-start), var(--header-outline-end)) border-box !important;
            outline: none !important;
            border-top: none !important;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition-theme), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, visibility 0.4s ease;
            z-index: 1000;
        }

        .header-card.hidden {
            transform: translateY(-130%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .header-card {
                width: calc(100% + 30px) !important;
                margin: 0 -15px !important;
                padding: 18px 15px !important;
            }
        }

        /* Search Row & Bar */
        .search-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            transition: gap 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .search-bar-container {
            flex: 1;
            min-width: 0;
            background: var(--search-bar-bg);
            border-radius: 25px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--card-shadow-micro);
            transition: box-shadow 0.3s ease, flex 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .search-bar-container:focus-within {
            border-color: transparent;
            box-shadow: var(--card-shadow-inset);
            background:
                linear-gradient(var(--search-bar-bg), var(--search-bar-bg)) padding-box,
                linear-gradient(110deg, var(--header-outline-start), var(--header-outline-end)) border-box;
        }

        .search-icon-mask {
            width: 20px;
            height: 20px;
            background: linear-gradient(110deg, var(--icon-gradient-start), var(--icon-gradient-end));
            -webkit-mask: url('https://ik.imagekit.io/lssafvcmr/magnifying-glass%20(1).png') no-repeat center / contain;
            mask: url('https://ik.imagekit.io/lssafvcmr/magnifying-glass%20(1).png') no-repeat center / contain;
            opacity: 0.9;
            margin-right: 10px;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        .search-bar-container input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: transparent;
            background-image: linear-gradient(110deg, var(--icon-gradient-start), var(--icon-gradient-end));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            caret-color: var(--learnera-pink);
            font-size: 0.95em;
            font-weight: 600;
            font-family: 'Poppins', sans-serif !important;
            transition: color 0.3s ease;
        }

        .search-bar-container input::placeholder {
            color: var(--search-input-placeholder-color);
            -webkit-text-fill-color: var(--search-input-placeholder-color);
            font-weight: 500;
        }

        /* Filter Toggle Button with active 1px gradient outline */
        .filter-toggle-btn {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            background: var(--body-bg);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--card-shadow-micro);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1),

                } finally {
                    setLoading(false);
                    setMoreLoading(false);
                }
            };

            // Switch active category tab with starting skeleton loading effect
            const handleCategoryChange = (cat) => {
                triggerSound(4);
                setActiveCategory(cat);
                setSearchQuery(""); 
                setNextPageId(null);
                nextPageIdRef.current = null; 
                setArticles([]); 
                setLoading(true);

                if (window.catLoadTimeout) clearTimeout(window.catLoadTimeout);
                window.catLoadTimeout = setTimeout(() => {
                    fetchNewsFeed("", cat, false);
                }, 1200); 
            };

            // Search change with local de-bounce and skeleton loading effect
            const handleSearchChange = (e) => {
                const val = e.target.value;
                setSearchQuery(val);
                setArticles([]); 
                setLoading(true);
                setNextPageId(null);
                nextPageIdRef.current = null; 
                
                if (window.searchTimeout) clearTimeout(window.searchTimeout);
                window.searchTimeout = setTimeout(() => {
                    setActiveCategory(""); 
                    fetchNewsFeed(val, "", false);
                }, 1200); 
            };

            // Load More button click handler
            const handleLoadMoreClick = () => {
                triggerSound(1);
                setMoreLoading(true);
                setTimeout(() => {
                    fetchNewsFeed(searchQuery, activeCategory, true);
                }, 1200); 
            };

            // Open article in secondary browser tab
            const handleArticleClick = (url) => {
                triggerSound(1);
                if (url) {
                    window.open(url, '_blank');
                } else {
                    window.showToast ? window.showToast("No direct link available.") : alert("No link available.");
                }
            };

            return (
                <div className="app-container">
                    
                    {/* Header Card Area with Outline & Rounded Bottom Left/Right Corners */}
                    <div className={`header-card ${controlsHidden ? 'hidden' : ''}`}>

                        {/* Search Row & Filter Toggle matching Laws.html design */}
                        <div className={`search-row ${isSearchActive ? "search-active" : ""}`}>
                            <div className="search-bar-container">
                                <div className="search-icon-mask"></div>
                                <input
                                    type="text"
                                    placeholder="Search latest news stories..."
                                    autoComplete="off"
                                    value={searchQuery}
                                    onChange={handleSearchChange}
                                    onFocus={() => {
                                        setIsSearchActive(true);
                                        setFilterCollapsed(true);
                                    }}
                                    onBlur={() => {
                                        setTimeout(() => setIsSearchActive(false), 150);
                                    }}
                                />
                            </div>
                            <button
                                className={`filter-toggle-btn ${!filterCollapsed ? "active" : ""}`}
                                onClick={toggleFilter}
                                aria-label="Toggle filters"
                                title="Toggle filters"
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                                    <defs>
                                        <linearGradient id="learneraIconGradient" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                                            <stop stopColor="var(--icon-gradient-start)" />
                                            <stop offset="1" stopColor="var(--icon-gradient-end)" />
                                        </linearGradient>
                                    </defs>
                                    <line x1="4" y1="6" x2="20" y2="6"></line>
                                    <line x1="7" y1="12" x2="17" y2="12"></line>
                                    <line x1="10" y1="18" x2="14" y2="18"></line>
                                </svg>
                            </button>
                        </div>

                        {/* Collapsible Category Filter Pills Row */}
                        <div className={`categories-filter-wrapper ${filterCollapsed ? "collapsed" : ""}`}>
                            {predefinedNewsCategories.map((cat) => (
                                <div
                                    key={cat.value}
                                    className={`category-pill ${activeCategory === cat.value ? "active" : ""}`}
                                    onClick={() => {
                                        if (window.playTouchSound) window.playTouchSound(4);
                                        handleCategoryChange(cat.value);
                                    }}
                                >
                                    <span>{cat.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Main Content Card with Gradient Outline Style */}
                    <div className="app-card">
                        {/* News Grid display panel with ListScrollingEffect animation */}
                        <div className="news-grid">
                            {loading && articles.length === 0 ? (
                                Array(10).fill(0).map((_, idx) => (
                                    <div key={idx} className="skeleton-loading"></div>
                                ))
                            ) : articles.length > 0 ? (
                                <React.Fragment>
                                    {articles.map((art, idx) => (
                                        <div 
                                            key={art.id || idx} 
                                            className="news-card"
                                            onClick={() => handleArticleClick(art.link)}
                                        >
                                            <img 
                                                className="news-card-banner" 
                                                src={art.image_url || "https://placehold.co/400x225/333333/FFFFFF?text=No+Image"} 
                                                alt={art.title}
                                                onError={(e) => {
                                                    e.target.src = "https://placehold.co/400x225/333333/FFFFFF?text=No+Image";
                                                }}
                                            />
                                            <div className="news-card-content">
                                                <h3 className="news-title">{art.title}</h3>
                                                <p className="news-desc">{art.description || "No description available."}</p>
                                                <div className="news-meta">
                                                    <span><i className="fas fa-newspaper"></i> {art.source_id || "Unknown Source"}</span>
                                                    <span><i className="fas fa-calendar-alt"></i> {art.pubDate ? new Date(art.pubDate).toLocaleDateString() : "N/A"}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    
                                    {/* Appended skeletons while clicking Load More */}
                                    {moreLoading && (
                                        Array(10).fill(0).map((_, idx) => (
                                            <div key={`inf-skel-${idx}`} className="skeleton-loading" style={{ height: "180px" }}></div>
                                        ))
                                    )}
                                </React.Fragment>
                            ) : (
                                <div style={{ textAlign: "center", padding: "30px 10px", color: "var(--sub-text-color)" }}>
                                    No stories found matching your request.
                                </div>
                            )}
                        </div>

                        {/* Neumorphic Load More pagination button */}
                        {!loading && !moreLoading && articles.length > 0 && (
                            <button 
                                className="back-pill-button" 
                                onClick={handleLoadMoreClick}
                                style={{ width: "100%", marginTop: "20px", height: "46px" }}
                            >
                                Load More Stories
                            </button>
                        )}

                    </div>
                </div>
            );
        }

        // Render application instance
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
