<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnEra - Grammar Hub</title>
    
    <!-- External Font Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- React & Babel CDN Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <!-- Early theme bootstrap -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('appThemeMode') || 'system';
                const isDark = savedTheme === 'dark' ||
                    (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.setAttribute('data-dark-text', darkStyle);
                } else {
                    document.documentElement.removeAttribute('data-dark-text');
                }
                const topSp = localStorage.getItem('appTopSpace') || '5';
                document.documentElement.style.setProperty('--top-space', topSp + 'vh');
            } catch (e) {
                document.documentElement.style.setProperty('--top-space', '5vh');
            }
            const savedLang = localStorage.getItem('appLanguageSelection') || 'en';
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>

    <style>
        /* CSS Reset Elements */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* Color Tokens & Global Variables */
        :root {
            --body-bg: #e6edf7; 
            --neu-shadow-light: #ffffff;
            --neu-shadow-dark: #c8d3e4;
            
            --text-color: #2d3748; 
            --sub-text-color: #718096; 
            --blue: #1E90FF;
            --select-active-color: #1E90FF;
            --divider-color: rgba(138, 43, 226, 0.15);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), -2px -2px 5px var(--neu-shadow-light);
            --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -6px -6px 12px var(--neu-shadow-light);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
            
            --top-space: 5vh;
            --transition-theme: background-color 0.8s ease, color 0.8s ease, box-shadow 0.8s ease, border-color 0.8s ease;

            /* LearnEra Header Gradient Outline Tokens */
            --header-gradient: linear-gradient(135deg, #8A2BE2, #a158e6, #DA70D6);
        }

        /* Standard Dark Mode Modifiers */
        html[data-theme="dark"] {
            --body-bg: #1e1e24; 
            --neu-shadow-dark: #101014;
            --neu-shadow-light: rgba(255, 255, 255, 0.05);
            
            --text-color: #d1d9e6; 
            --sub-text-color: #a3b1c6; 
            --divider-color: rgba(255, 255, 255, 0.08);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.02);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.02);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.02);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 5px rgba(255, 255, 255, 0.03);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
        }

        /* Deep-Dark Mode Specific Styles */
        html[data-dark-text="deep-dark"] {
            --body-bg: #0c0c0f; 
            --neu-shadow-dark: #050506;
            --divider-color: rgba(255, 255, 255, 0.04);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.01);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.01);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.01);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.01);
            
            --blue: #7a8b9e;
            --select-active-color: #7a8b9e;
            --header-gradient: linear-gradient(135deg, #7a8b9e, #55555d);
        }

        html[data-dark-text="deep-dark"] *,
        html[data-dark-text="deep-dark"] i,
        html[data-dark-text="deep-dark"] h3,
        html[data-dark-text="deep-dark"] h4,
        html[data-dark-text="deep-dark"] h5,
        html[data-dark-text="deep-dark"] p,
        html[data-dark-text="deep-dark"] span,
        html[data-dark-text="deep-dark"] li,
        html[data-dark-text="deep-dark"] button,
        html[data-dark-text="deep-dark"] textarea,
        html[data-dark-text="deep-dark"] input {
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] .grammar-error-badge,
        html[data-dark-text="deep-dark"] .category-pill,
        html[data-dark-text="deep-dark"] .tab-button {
            border-color: #55555d !important;
        }

        ::-webkit-scrollbar {
            display: none !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--body-bg);
            color: var(--text-color);
            overflow-y: auto; 
            overscroll-behavior: none;
            font-family: 'Poppins', sans-serif !important;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            font-size: 13px; 
            transition: var(--transition-theme);
            padding-top: var(--top-space);
        }

        /* Layout Framework Container */
        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px 15px 15px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-start;
            height: auto;
            min-height: 100%;
        }

        /* Neumorphic Responsive Card Style */
        .app-card {
            background: var(--body-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow), inset 1px 1px 2px rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.35);
            display: flex;
            flex-direction: column;
            transition: var(--transition-theme);
            height: auto;
        }

        /* Tabs Selection Panel */
        .nav-tabs {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        /* Top Three Tab Buttons */
        .tab-button {
            flex: 1;
            padding: 12px 10px;
            border: 1.5px solid rgba(150, 150, 150, 0.35);
            border-radius: 14px;
            background: transparent;
            color: var(--text-color);
            font-family: 'Poppins', sans-serif !important;
            font-size: 0.9em;
            font-weight: 600;
            box-shadow: none !important;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, color 0.15s ease, border 0.2s ease;
            text-align: center;
        }

        html[data-theme="dark"] .tab-button {
            border: 1.5px solid rgba(180, 180, 180, 0.30);
        }

        .tab-button:active {
            transform: scale(0.97);
        }

        .tab-button.active {
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            font-weight: 700;
        }

        .tab-button.active span {
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        html[data-dark-text="deep-dark"] .tab-button.active span {
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: initial !important;
            color: #7a8b9e !important;
        }

        /* Custom input elements styled as Neumorphic inset fields */
        .custom-input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 14px;
            background: var(--body-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif !important;
            font-size: 0.95em;
            font-weight: 500;
            box-shadow: var(--settings-shadow-inset-sharp);
            outline: none;
            transition: box-shadow 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .custom-input:focus {
            box-shadow: var(--settings-shadow-inset-sharp), 0 0 0 2px rgba(30, 144, 255, 0.15);
        }

        /* Large input textarea */
        .custom-textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: var(--body-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif !important;
            font-size: 0.95em;
            font-weight: 500;
            box-shadow: var(--settings-shadow-inset-sharp);
            outline: none;
            resize: vertical;
            transition: box-shadow 0.3s ease;
        }

        .custom-textarea:focus {
            box-shadow: var(--settings-shadow-inset-sharp), 0 0 0 2px rgba(30, 144, 255, 0.15);
        }

        /* Action Pill button elements */
        .back-pill-button {
            position: relative;
            background: var(--body-bg);
            color: var(--text-color);
            border: 2px solid var(--body-bg);
            border-radius: 16px;
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.7);
            z-index: 70;
            transition: transform 0.15s ease, box-shadow 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            font-weight: 600;
        }

        .back-pill-button:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 4px var(--neu-shadow-dark) !important;
        }

        /* Categories Scroller */
        .categories-filter-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 12px;
            margin-bottom: 10px;
        }

        /* Inactive category pills */
        .category-pill {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            background: transparent !important;
            color: var(--sub-text-color);
            box-shadow: none !important;
            border: 1.5px solid rgba(150, 150, 150, 0.35) !important;
            transition: all 0.2s ease;
        }

        html[data-theme="dark"] .category-pill {
            border: 1.5px solid rgba(180, 180, 180, 0.30) !important;
        }

        .category-pill:active {
            transform: scale(0.95);
        }

        /* Active Topics Category Button: Gradient Outline */
        .category-pill.active {
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            color: #8A2BE2 !important;
            font-weight: 700;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border: 1.5px solid rgba(122, 139, 158, 0.3) !important;
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] .category-pill.active {
            border: 1.5px solid #7a8b9e !important;
            background: #0c0c0f !important;
            color: #7a8b9e !important;
        }

        /* General layout blocks for categories and topics */
        .category-group-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            text-align: left;
        }

        /* ============================================================ */
        /* EXACT ACCORDION CARD STYLES MATCHING FAQs (3).html           */
        /* ============================================================ */
        .faq-item {
            background: var(--body-bg);
            border-radius: 16px;
            border: none;
            box-shadow: var(--card-shadow-micro); 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.4s ease;
            overflow: hidden;
            width: 100%;
        }

        html[data-theme="dark"] .faq-item, html[data-dark-text="deep-dark"] .faq-item {
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .faq-question .icon {
            font-size: 0.9em;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.8;
        }

        /* Super Smooth Answer Wrapper (Exact height calculation transition) */
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
        }

        /* Inner Content with Outline/Divider */
        .faq-answer-content {
            margin: 0 18px; 
            padding: 12px 0 18px 0;
            border-top: 1px solid var(--divider-color); 
            color: var(--sub-text-color);
            font-size: 0.82em;
            line-height: 1.6;
            text-align: left;
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Active Expanded State */
        .faq-item.active {
            box-shadow: var(--card-shadow-inset) !important;
            transform: scale(0.99);
        }

        .faq-item.active .faq-question {
            color: var(--text-color);
        }

        .faq-item.active .faq-question .icon {
            transform: rotate(180deg);
        }

        .faq-item.active .faq-answer-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Error suggestions cards */
        .error-card-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }

        .grammar-error-card {
            background: rgba(231, 76, 60, 0.06);
            border-left: 5px solid #e74c3c;
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: var(--card-shadow-micro);
            color: var(--text-color);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.76em !important; 
        }

        .grammar-error-badge {
            display: inline-block;
            background: rgba(30, 144, 255, 0.12);
            color: var(--blue);
            font-size: 0.85em !important; 
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 5px;
            margin-right: 4px;
            margin-top: 3px;
        }

        .grammar-error-highlight {
            background: rgba(255, 243, 205, 0.18);
            color: #FFD700;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        /* Dictionary Meaning Section elements */
        .dictionary-output-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 15px;
            text-align: left;
        }

        .meaning-section {
            background: var(--body-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--card-shadow-micro);
            border: 1px solid rgba(255,255,255,0.25);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meaning-part-of-speech {
            font-size: 0.78em;
            font-weight: 800;
            color: var(--blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meaning-definition-item {
            font-size: 0.88em;
            color: var(--text-color);
            line-height: 1.5;
            list-style-type: decimal;
            margin-left: 15px;
        }

        .audio-trigger-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .audio-pill {
            background: var(--body-bg);
            border-radius: 12px;
            box-shadow: var(--card-shadow-micro);
            padding: 6px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
        }

        /* Overlay Popup Structure */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.45) !important;
            backdrop-filter: blur(16px) !important; 
            -webkit-backdrop-filter: blur(16px) !important;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }

        .custom-modal-overlay.show {
            display: flex !important;
        }

        .custom-modal {
            background: var(--body-bg);
            border-radius: 24px;
            padding: 24px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: none !important;
        }

        body[data-theme="dark"] .custom-modal {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Shimmer Loading Skeletons */
        .skeleton-loading {
            background: var(--body-bg) !important;
            border-color: transparent !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
            color: transparent !important;
            pointer-events: none !important;
            position: relative !important;
            overflow: hidden !important;
            min-height: 50px;
            border-radius: 14px;
        }

        .skeleton-loading * {
            visibility: hidden !important;
        }

        .skeleton-loading::after {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: skeleton-shimmer-animation 1.5s infinite;
        }
        body[data-theme="dark"] .skeleton-loading::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }
        @keyframes skeleton-shimmer-animation {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        html[data-dark-text="deep-dark"] .skeleton-loading {
            background: #08080a !important;
        }

        @media (min-width: 768px) {
            body {
                justify-content: center;
                align-items: center;
                padding-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Target Root Mounting Division for React App -->
    <div id="root" style="width: 100%;"></div>

    <!-- Live Execution Module Scripts -->
    <script type="text/babel">
        // Sound FX System matching Tools.html implementation
        (function initDashboardSoundFX(){
            const LS_MASTER = 'touchSoundsEnabled';
            const LS_GROUPS = 'touchSoundsGroupState';

            const CLICK_SOUND_URLS = [
                "Click1.ogg", "Click2.ogg", "Click3.ogg", "Click4.ogg", "Click5.ogg",
                "Click6.ogg", "Click7.ogg", "Click8.ogg", "Click9.ogg", "Click10.ogg",
                "Click11.ogg", "Click12.ogg", "Click13.ogg", "Click14.ogg"
            ];

            const GROUP_TO_CLICKS = {
                'buttons'   : [1, 2, 3, 7, 8, 9, 14],
                'navigation': [5],
                'inputs'    : [4, 6],
                'reserved'  : [10, 11, 12, 13]
            };

            const CLICK_TO_GROUP = {};
            Object.keys(GROUP_TO_CLICKS).forEach(g => {
                GROUP_TO_CLICKS[g].forEach(n => { CLICK_TO_GROUP[n] = g; });
            });

            const audioCache = {};
            let _ac = null;
            let _masterGain = null;

            function getAC(){
                if (_ac) return _ac;
                try {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) {
                        _ac = new Ctx();
                        const comp = _ac.createDynamicsCompressor();
                        comp.threshold.value = -10;
                        comp.knee.value = 6;
                        comp.ratio.value = 12;
                        comp.attack.value = 0.001;
                        comp.release.value = 0.05;
                        _masterGain = _ac.createGain();
                        _masterGain.gain.value = 1.0;
                        comp.connect(_masterGain).connect(_ac.destination);
                        _ac._busIn = comp;
                    }
                } catch(e){}
                return _ac;
            }

            function synthClick(n){
                const ac = getAC();
                if (!ac) return;
                if (ac.state === 'suspended') { ac.resume().catch(()=>{}); }
                const SYNTH = {
                    1:  { f: 880,  d: 0.05, w: 'triangle', g: 0.18 },
                    2:  { f: 520,  d: 0.07, w: 'sine',     g: 0.22 },
                    3:  { f: 660,  d: 0.08, w: 'square',   g: 0.16 },
                    4:  { f: 1200, d: 0.03, w: 'sine',     g: 0.12 },
                    5:  { f: 740,  d: 0.05, w: 'triangle', g: 0.18 },
                    6:  { f: 1000, d: 0.025,w: 'sine',     g: 0.10 },
                    7:  { f: 600,  d: 0.05, w: 'square',   g: 0.16 },
                    8:  { f: 820,  d: 0.05, w: 'triangle', g: 0.18 },
                    9:  { f: 420,  d: 0.06, w: 'sine',     g: 0.18 },
                    10: { f: 480,  d: 0.05, w: 'triangle', g: 0.16 },
                    11: { f: 560,  d: 0.05, w: 'triangle', g: 0.16 },
                    12: { f: 640,  d: 0.05, w: 'triangle', g: 0.16 },
                    13: { f: 720,  d: 0.05, w: 'triangle', g: 0.16 },
                    14: { f: 440,  d: 0.08, w: 'sine',     g: 0.60 }
                };
                const r = SYNTH[n] || SYNTH[7];
                const t0 = ac.currentTime;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = r.w;
                osc.frequency.setValueAtTime(r.f, t0);
                osc.frequency.exponentialRampToValueAtTime(Math.max(80, r.f * 0.6), t0 + r.d);
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(r.g, t0 + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + r.d);
                osc.connect(gain).connect(ac._busIn || ac.destination);
                osc.start(t0);
                osc.stop(t0 + r.d + 0.02);
            }

                opts = opts || {};

                        a.volume = 1.0;

                    return;
                } catch(e) {

                }

                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: new URLSearchParams({
                            text: grammarText,
                            language: "en-US"
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setGrammarErrors(data.matches || []);
                        triggerSound(14);
                    } else {
                        throw new Error("LanguageTool connection issue.");
                    }

                    console.error(err);

                                            </div>
                                        ) : (
                                            <div style={{display: "flex", flexDirection: "column", gap: "12px"}}>
                                                <div style={{display: "flex", justifyContent: "space-between", alignItems: "baseline"}}>
                                                    <h3 style={{fontSize: "1.4em", fontWeight: "800"}}>{definitionData.word}</h3>
                                                    {definitionData.phonetic && (
                                                        <span style={{color: "var(--sub-text-color)", fontSize: "0.9em"}}>{definitionData.phonetic}</span>
                                                    )}
                                                </div>

                                                {/* Audio pronunciation controls */}
                                                {definitionData.phonetics && definitionData.phonetics.find(p => p.audio) && (
                                                    <div className="audio-trigger-wrapper">
                                                        <div 
                                                            className="audio-pill"
                                                            onClick={() => playAudio(definitionData.phonetics.find(p => p.audio).audio)}
                                                        >
                                                            <i className="fa-solid fa-volume-high"></i> Pronounce
                                                        </div>
                                                    </div>
                                                )}

                                                {/* Meaning segments */}
                                                {definitionData.meanings && definitionData.meanings.map((meaning, idx) => (
                                                    <div className="meaning-section" key={idx}>
                                                        <span className="meaning-part-of-speech">{meaning.partOfSpeech}</span>
                                                        <ol style={{paddingLeft: "15px", margin: "5px 0"}}>
                                                            {meaning.definitions.slice(0, 3).map((def, dIdx) => (
                                                                <li key={dIdx} className="meaning-definition-item">
                                                                    {def.definition}
                                                                    {def.example && (
                                                                        <div style={{fontStyle: "italic", opacity: 0.75, fontSize: "0.95em", marginTop: "3px"}}>
                                                                            "{def.example}"
                                                                        </div>
                                                                    )}
                                                                </li>
                                                            ))}
                                                        </ol>
                                                        
                                                        {meaning.synonyms && meaning.synonyms.length > 0 && (
                                                            <div style={{fontSize: "0.82em", marginTop: "5px"}}>
                                                                <strong>Synonyms:</strong> &nbsp;
                                                                {meaning.synonyms.slice(0, 4).map((syn, sIdx) => (
                                                                    <span key={sIdx} className="grammar-error-badge">{syn}</span>
                                                                ))}
                                                            </div>
                                                        )}

                                                        {meaning.antonyms && meaning.antonyms.length > 0 && (
                                                            <div style={{fontSize: "0.82em", marginTop: "5px"}}>
                                                                <strong>Antonyms:</strong> &nbsp;
                                                                {meaning.antonyms.slice(0, 4).map((ant, aIdx) => (
                                                                    <span key={aIdx} className="grammar-error-badge" style={{background: 'rgba(231, 76, 60, 0.08)', color: '#e74c3c'}}>{ant}</span>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 3: DYNAMIC GRAMMAR TOPICS */}
                        {activeTab === "topics" && (
                            <div style={{display: "flex", flexDirection: "column", gap: "12px"}}>
                                
                                {/* Filter category pills with Active Gradient Outline */}
                                <div className="categories-filter-wrapper">
                                    {topicCategories.map((cat) => (
                                        <div 
                                            key={cat.code}
                                            className={`category-pill ${activeCategory === cat.code ? "active" : ""}`}
                                            onClick={() => {
                                                triggerSound(4);
                                                setActiveCategory(cat.code);
                                            }}
                                        >
                                            {cat.name}
                                        </div>
                                    ))}
                                </div>

                                <div className="category-group-wrapper">
                                    {loading ? (
                                        Array(4).fill(0).map((_, idx) => (
                                            <div key={idx} className="skeleton-loading" style={{height: "50px"}}></div>
                                        ))
                                    ) : filteredTopics.length > 0 ? (
                                        filteredTopics.map((topic) => (
                                            <div key={topic.id} className="faq-item">
                                                <div 
                                                    className="faq-question"
                                                    onClick={(e) => handleAccordionToggle(e, topic.id)}
                                                >
                                                    <span>{topic.title}</span>
                                                    <i className="fas fa-chevron-down icon"></i>
                                                </div>
                                                <div className="faq-answer">
                                                    <div className="faq-answer-content">
                                                        <p style={{marginBottom: "8px"}}>{topic.explanation}</p>
                                                        {topic.examples && (
                                                            <div style={{background: "rgba(255,255,255,0.05)", padding: "10px", borderRadius: "10px", border: "1px solid rgba(255,255,255,0.1)"}}>
                                                                <strong style={{fontSize: "0.92em", color: "var(--blue)"}}>Examples:</strong>
                                                                <ul style={{paddingLeft: "15px", marginTop: "5px"}}>
                                                                    {topic.examples.map((ex, eIdx) => (
                                                                        <li key={eIdx} style={{fontSize: "0.95em", fontStyle: "italic"}}>{ex}</li>
                                                                    ))}
                                                                </ul>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div style={{textAlign: "center", padding: "30px", color: "var(--sub-text-color)"}}>
                                            No topics matching the selected category.
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Custom warning dialog popup */}
                    <div className={`custom-modal-overlay ${showWarning ? "show" : ""}`} onClick={() => setShowWarning(false)}>
                        <div className="custom-modal" onClick={(e) => e.stopPropagation()}>
                            <div style={{ textAlign: "center", display: "flex", flexDirection: "column", gap: "15px" }}>
                                <i className="fa-solid fa-circle-exclamation" style={{ fontSize: "2.4em", color: "#e74c3c" }}></i>
                                <h3 style={{ fontSize: "1.15em", fontWeight: "800", color: "var(--text-color)" }}>Warning</h3>
                                <p style={{ fontSize: "0.85em", color: "var(--sub-text-color)", lineHeight: "1.5" }}>
                                    {warningMsg}
                                </p>
                                <button 
                                    className="back-pill-button" 
                                    style={{ width: "100%", marginTop: "8px" }}
                                    onClick={() => {
                                        triggerSound(2);
                                        setShowWarning(false);
                                    }}
                                >
                                    Dismiss
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        // Render application instance
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
