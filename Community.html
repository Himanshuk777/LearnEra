    // Requirement 2: ONE shared date-filter renderer, so the room chat screen
    // uses exactly the same date divider logic + animation as the "All" screen.
    function renderPostsWithDateFilter(container, displayPosts, currentUid, showCategoryTag) {
        let lastDateGroup = '';
        displayPosts.forEach((post, idx) => {
            const prevPost = displayPosts[idx - 1];

            const dateGroup = formatTelegramDate(post.timestamp);
            if (dateGroup !== lastDateGroup) {
                container.appendChild(createDateDivider(dateGroup, post.timestamp));
                lastDateGroup = dateGroup;
            }

            const isGrouped = prevPost && (prevPost.uid === post.uid) && (prevPost.subClean === post.subClean)
                && formatTelegramDate(prevPost.timestamp) === dateGroup;

            container.appendChild(createScoopStyleMessageHTML(post, currentUid, showCategoryTag, isGrouped));
        });

        requestAnimationFrame(() => { updateStickyDateHeader(); updateDateDividerCollision(); });
    }

    // Requirement 7: only the latest 20 messages are rendered, older load on scroll up
    function renderRoomMessages(options) {
        options = options || {};
        const container = document.getElementById('roomFeedContainer');
        const scroller = document.getElementById('viewRoomChat');
        if (!container) return;

        const merged = currentRoomPosts.slice();
        Object.keys(pendingMessages).forEach(k => {
            if (!merged.some(p => p.postKey === k)) merged.push(pendingMessages[k]);
        });
        merged.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

        if (!merged.length) {
            container.innerHTML = `<div class="empty-state">No messages found in ${toHashtag(currentSelectedSubCategory || '')}.<br>Be the first to post! 👋</div>`;
            hasMoreOlderMessages = false;
            return;
        }

        const total = merged.length;
        const displayPosts = merged.slice(Math.max(0, total - roomVisibleCount));
        hasMoreOlderMessages = displayPosts.length < total;

        const prevHeight = scroller ? scroller.scrollHeight : 0;
        const prevTop = scroller ? scroller.scrollTop : 0;
        const currentUid = auth.currentUser ? auth.currentUser.uid : null;

        container.innerHTML = '';
        if (hasMoreOlderMessages) container.appendChild(createLoadMoreRow());

        renderPostsWithDateFilter(container, displayPosts, currentUid, false);

        if (options.keepScroll && scroller) {
            requestAnimationFrame(() => {
                scroller.scrollTop = prevTop + (scroller.scrollHeight - prevHeight);
                handleChatScroll();
            });
        } else if (options.jumpDate) {
            setTimeout(() => jumpToDate(options.jumpDate), 120);
        } else if (options.scrollToBottom !== false) {
            // Requirement 8: latest message is always the default position
            scrollChatToBottom(false);
        }
    }

    // Requirement 3: skeletons are shown ONLY for the newly requested batch
    function loadOlderRoomMessages() {
        if (!hasMoreOlderMessages || isLoadingOlder) return;
        isLoadingOlder = true;

        const container = document.getElementById('roomFeedContainer');
        const scroller = document.getElementById('viewRoomChat');
        const prevHeight = scroller ? scroller.scrollHeight : 0;
        const prevTop = scroller ? scroller.scrollTop : 0;

        prependPagingSkeletons(container, Math.min(ROOM_PAGE_SIZE, 4));
        if (scroller) {
            requestAnimationFrame(() => {
                scroller.scrollTop = prevTop + (scroller.scrollHeight - prevHeight);
            });
        }

        setTimeout(() => {
            clearPagingSkeletons(container);
            roomVisibleCount += ROOM_PAGE_SIZE;
            renderRoomMessages({ keepScroll: true });
            isLoadingOlder = false;
        }, 550);
    }


    function listenToRoomChat(catName, subCatName) {
        const container = document.getElementById('roomFeedContainer');
        renderSkeletonUploadLoaders(container);

        const cleanCat = sanitizePath(catName);
        const cleanSub = sanitizePath(subCatName);

        // Telegram behaviour: keep the chat loaded, dates are used for jumping only
        const path = `community/${cleanCat}/${cleanSub}`;
        const ref = db.ref(path).limitToLast(120);
        ref.off();
        ref.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                currentRoomPosts = [];
                container.innerHTML = `<div class="empty-state">No messages found in ${toHashtag(subCatName)}.<br>Be the first to post! 👋</div>`;
                return;
            }

            let posts = [];
            Object.keys(data).forEach(dateKey => {
                const timeNodes = data[dateKey] || {};
                Object.keys(timeNodes).forEach(timeUserKey => {
                    const p = timeNodes[timeUserKey];
                    if (!p || typeof p !== 'object') return;
                    p.postKey = timeUserKey;
                    p.dateKey = dateKey;
                    p.catClean = cleanCat;
                    p.subClean = cleanSub;
                    posts.push(p);
                });
            });

            // Requirement 6: strict ascending order, newest messages at the bottom
            posts.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            currentRoomPosts = posts;

            // Drop optimistic copies that are now confirmed in the database
            Object.keys(pendingMessages).forEach(k => {
                if (posts.some(p => p.postKey === k)) {
                    delete pendingMessages[k];
                    messageStatus[k] = 'delivered';
                }
            });

            const stickToBottom = roomFirstRender || isChatNearBottom();
            const visible = posts.slice(Math.max(0, posts.length - roomVisibleCount));

            preloadAvatars(visible).then(() => {
                if (pendingJumpDate) {
                    const jump = pendingJumpDate;
                    pendingJumpDate = null;
                    renderRoomMessages({ jumpDate: jump });
                } else {
                    renderRoomMessages({ scrollToBottom: roomFirstRender ? true : stickToBottom });
                }
                if (roomFirstRender) { scrollChatToBottom(false); setTimeout(() => scrollChatToBottom(false), 400); }
                roomFirstRender = false;
            });
        });
    }

    function loadAllCommunityFeed(options) {
        options = options || {};
        const container = document.getElementById('allFeedContainer');
        // Requirement 3: when paging, keep the loaded messages and only skeleton
        // the incoming batch at the top of the list.
        if (options.paging) {
            clearPagingSkeletons(container);
            prependPagingSkeletons(container, Math.min(ROOM_PAGE_SIZE, 4));
        } else {
            renderSkeletonUploadLoaders(container);
        }

        const allRef = db.ref('community');
        allRef.off();
        allRef.on('value', (snapshot) => {
            const allCatData = snapshot.val();
            buildLatestIndex(allCatData || {});
            if (!allCatData) {
                container.innerHTML = `<div class="empty-state">No community discussions found. Join a room to get started!</div>`;
                return;
            }

            // The "All" screen shows EVERY message from EVERY hashtag room,
            // in strict chronological order (WhatsApp style: newest at bottom).
            // Fallback ordering (dateKey + time key) keeps it correct even when a
            // record has no numeric timestamp.
            const sortKeyOf = (p) => {
                if (p && p.timestamp) return Number(p.timestamp);
                const parsed = Date.parse(((p && p.dateKey) || '').replace(/_/g, ' '));
                if (!isNaN(parsed)) return parsed;
                return 0;
            };
            let allPosts = [];
            Object.keys(allCatData).forEach(cat => {
                const subData = allCatData[cat] || {};
                Object.keys(subData).forEach(sub => {
                    const dateData = subData[sub] || {};
                    Object.keys(dateData).forEach(dateKey => {
                        const timeData = dateData[dateKey] || {};
                        Object.keys(timeData).forEach(timeUserKey => {
                            const p = timeData[timeUserKey];
                            if (!p || typeof p !== 'object') return;
                            p.postKey = timeUserKey;
                            p.dateKey = dateKey;
                            p.catClean = cat;
                            p.subClean = sub;
                            p.rawCategory = cat;
                            p.rawSubCategory = sub;
                            allPosts.push(p);
                        });
                    });
                });
            });

            // Ascending chronological order -> the newest message sits at the bottom
            allPosts.sort((a, b) => (sortKeyOf(a) - sortKeyOf(b)) || String(a.postKey || '').localeCompare(String(b.postKey || '')));

            const hasMoreAll = allPosts.length > allVisibleCount;
            const displayPosts = allPosts.slice(-allVisibleCount);
            const currentUid = auth.currentUser ? auth.currentUser.uid : null;

            if (displayPosts.length === 0) {
                container.innerHTML = `<div class="empty-state">No messages available.</div>`;
                return;
            }

            const paint = () => {
                const se = document.scrollingElement || document.documentElement;
                const prevHeight = se.scrollHeight;
                const prevTop = se.scrollTop;

                clearPagingSkeletons(container);
                container.innerHTML = '';
                if (hasMoreAll) {
                    const row = document.createElement('div');
                    row.className = 'load-more-row all-load-more';
                    row.id = 'allLoadMoreRow';
                    // hidden until the user scrolls up away from the newest message
                    row.classList.add('is-hidden');
                    row.innerHTML = `<button class="load-more-btn" type="button"><i class="fas fa-arrow-up"></i> Load 20 older messages</button>`;
                    row.querySelector('button').onclick = () => {
                        playTouchSound();
                        allVisibleCount += ROOM_PAGE_SIZE;
                        loadAllCommunityFeed({ paging: true });
                    };
                    container.appendChild(row);
                }

                // Requirement 2: identical shared date filter logic as the chat screen
                renderPostsWithDateFilter(container, displayPosts, currentUid, true);

                if (options.paging) {
                    // keep the user's reading position when 20 older messages are added
                    const restore = () => { se.scrollTop = prevTop + (se.scrollHeight - prevHeight); };
                    restore();
                    requestAnimationFrame(restore);
                    setTimeout(restore, 80);
                    setTimeout(updateAllLoadMoreVisibility, 200);
                } else {
                    // The feed must always START pinned at the very bottom (newest message)
                    scrollFeedToLatest();
                    setTimeout(updateAllLoadMoreVisibility, 200);
                }
            };

            preloadAvatars(displayPosts).then(() => {
                if (options.paging) setTimeout(paint, 450);
                else paint();
            });

        });
    }


    // ------------------------------------------------------------------------
    // Date helpers, clickable dividers & Telegram-style date jumping
    // ------------------------------------------------------------------------
    function toDayKey(timestamp) {
        const d = new Date(timestamp);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function createDateDivider(label, timestamp) {
        const dateDivider = document.createElement('div');
        dateDivider.className = 'tg-date-divider';
        const dayKey = timestamp ? toDayKey(timestamp) : '';
        dateDivider.setAttribute('data-day-key', dayKey);
        dateDivider.setAttribute('data-day-label', label);
        dateDivider.innerHTML = `<span><i class="far fa-calendar-alt"></i><b>${label}</b></span>`;
        // Requirement: tapping a date divider opens the custom calendar
        dateDivider.onclick = () => {
            if (dayKey) {
                const parts = dayKey.split('-');
                selectedCalDate = new Date(+parts[0], +parts[1] - 1, +parts[2]);
                calDate = new Date(selectedCalDate);
            }
            playTouchSound();
            openCalendarModal();
        };
        return dateDivider;
    }

    // Smooth, eased shifting animation towards the picked date
    function smoothScrollWindowTo(targetY, duration = 700) {
        const startY = window.pageYOffset;
        const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        const endY = Math.min(Math.max(0, targetY), maxY);
        const delta = endY - startY;
        if (Math.abs(delta) < 2) return;
        const startTime = performance.now();
        const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
        const step = now => {
            const p = Math.min(1, (now - startTime) / duration);
            window.scrollTo(0, startY + delta * ease(p));
            if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    // Requirement 5: jump to the FIRST (top) message of the picked date, never the last one
    function jumpToDate(dayKey) {
        const scroller = document.getElementById('viewRoomChat');
        const inChat = isChatViewOpen();

        // Make sure the picked day is actually rendered (paging may hide older days)
        if (inChat && currentRoomPosts.length) {
            let idx = currentRoomPosts.findIndex(p => toDayKey(p.timestamp) >= dayKey);
            if (idx === -1) idx = currentRoomPosts.length - 1;
            const needed = currentRoomPosts.length - idx + 1;
            if (needed > roomVisibleCount) {
                roomVisibleCount = needed;
                renderRoomMessages({ scrollToBottom: false });
            }
        }

        let target = document.querySelector(`.tg-date-divider[data-day-key="${dayKey}"]`);
        if (!target) {
            const dividers = Array.from(document.querySelectorAll('.tg-date-divider[data-day-key]'));
            if (!dividers.length) { showCustomToast("No messages to jump to."); return; }
            const after = dividers.find(d => d.getAttribute('data-day-key') >= dayKey);
            target = after || dividers[dividers.length - 1];
            showCustomToast("No messages on that date • jumped to nearest");
        }

        const resolvedKey = target.getAttribute('data-day-key');
        const firstCard = document.querySelector(`.card[data-day-key="${resolvedKey}"]`);

        const doScroll = () => {
            if (inChat) {
                const sRect = scroller.getBoundingClientRect();
                const tRect = target.getBoundingClientRect();
                const top = scroller.scrollTop + (tRect.top - sRect.top) - 84;
                scroller.scrollTo({ top: top < 0 ? 0 : top, behavior: 'smooth' });
            } else {
                smoothScrollWindowTo(
                    window.pageYOffset + target.getBoundingClientRect().top - 84
                );
            }
            const flashEl = firstCard || target;
            flashEl.classList.add('highlight-flash');
            setTimeout(() => flashEl.classList.remove('highlight-flash'), 1500);
            setTimeout(() => { updateStickyDateHeader(); updateDateDividerCollision(); }, 400);
        };

        requestAnimationFrame(doScroll);
    }

    // ------------------------------------------------------------------------
    // Create Scoop Style Message Card HTML
    // ------------------------------------------------------------------------
    function createScoopStyleMessageHTML(post, currentUid, showCategoryTag = false, isGrouped = false) {
        const isOutgoing = currentUid && (post.uid === currentUid);
        const card = document.createElement('div');
        card.className = `card ${isOutgoing ? 'outgoing' : 'incoming'} ${isGrouped ? 'grouped' : ''}`;
        card.setAttribute('data-post-key', post.postKey || '');

        const defaultAvatar = 'https://i.ibb.co/bgWVZn48/LearnEra-Logo.webp';
        const rawAvatar = post.userAvatar || defaultAvatar;
        const name = post.userName || 'Learner';
        // Age is intentionally NOT rendered on the message card; it is only
        // shown inside the user profile popup.
        const timeStr = post.timestamp ? new Date(post.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const dateStr = post.timestamp ? new Date(post.timestamp).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';

        // Requirement 3 & 5: Hashtag ONLY Gradient Pink (NO Neumorphism Pill!)
        const catTagHTML = (showCategoryTag && post.rawCategory && post.rawSubCategory) 
            ? `<span class="post-category-tag" onclick="enterRoomChat('${post.rawCategory}', '${post.rawSubCategory}')">${toHashtag(post.rawSubCategory)}</span>` 
            : `<span class="post-category-tag">${toHashtag(post.subClean || 'general')}</span>`;

        // Telegram Style Reply Quote Box
        let replyQuoteHTML = '';
        if (post.replyTo) {
            replyQuoteHTML = `
                <div class="reply-quote-box" onclick="scrollToMessage('${post.replyTo.postKey}')">
                    <span class="reply-quote-user">${post.replyTo.userName || 'User'}</span>
                    <span class="reply-quote-text">${post.replyTo.text || ''}</span>
                </div>
            `;
        }

        // Requirement 3: single tick while sending, double tick once delivered
        const msgStatus = messageStatus[post.postKey] || (post.pending ? 'sent' : 'delivered');
        let tickHTML = isOutgoing ? buildTickIcon(msgStatus) : '';
        if (post.pending) card.classList.add('pending-message');

        card.setAttribute('data-date-str', dateStr);
        card.setAttribute('data-day-key', post.timestamp ? toDayKey(post.timestamp) : '');
        card.setAttribute('data-day-label', formatTelegramDate(post.timestamp));

        // Requirement 4: Full Profile Pic display inside 60px cutout without clipping
        const circleHTML = !isGrouped ? `
            <div class="circle">
                <img src="${defaultAvatar}" alt="Avatar" class="scoop-avatar-img">
            </div>
        ` : '';

        // Requirement 5: Username Gradient Style
        const headerHTML = !isGrouped ? `
            <h1>
                <span class="user-name-text">${name}</span>
                ${catTagHTML}
            </h1>
        ` : '';

        card.innerHTML = `
            ${circleHTML}
            <div class="box">
                <div class="content">
                    ${headerHTML}
                    ${replyQuoteHTML}
                    <p class="message">${post.text || ''}</p>
                    <div class="tg-time-row">
                        <span>${timeStr}</span>
                        ${tickHTML}
                    </div>
                </div>
            </div>
        `;

        if (!isGrouped) {
            const imgEl = card.querySelector('.scoop-avatar-img');
            if (imgEl) {
                compressAvatarImage(rawAvatar, (compressedSrc) => {
                    imgEl.src = compressedSrc;
                });
            }
            const circleEl = card.querySelector('.circle');
            if (circleEl) {
                circleEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playTouchSound();
                    openUserProfilePopup(post);
                });
            }
        }

        // Requirement 5: Disable swipe-left-to-right on 'All' screen (ONLY enabled in room chats)
        if (!showCategoryTag) {
            let startX = 0;
            let currentX = 0;
            let isSwiping = false;

            card.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    startX = e.touches[0].clientX;
                    isSwiping = true;
                }
            });

            card.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                currentX = e.touches[0].clientX;
                const diffX = currentX - startX;

                // Swipe Left to Right
                if (diffX > 0 && diffX < 90) {
                    card.style.transform = `translateX(${diffX}px)`;
                }
            });

            card.addEventListener('touchend', () => {
                if (!isSwiping) return;
                const diffX = currentX - startX;
                if (diffX > 50) {
                    initiateReply(post);
                }
                card.style.transform = '';
                isSwiping = false;
                startX = 0;
                currentX = 0;
            });
        }

        // Context Menu Action Triggers
        let pressTimer = null;
        const boxEl = card.querySelector('.box');

        const triggerContextMenu = (e) => {
            e.preventDefault();
            activeSelectedPostData = post;
            openContextMenu(isOutgoing);
        };

        boxEl.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => triggerContextMenu(e), 500);
        });
        boxEl.addEventListener('touchend', () => clearTimeout(pressTimer));
        boxEl.addEventListener('touchmove', () => clearTimeout(pressTimer));
        boxEl.addEventListener('contextmenu', triggerContextMenu);

        return card;
    }

    function updateStickyDateHeader() {
        const pill = document.getElementById('floatingDateIndicator');
        if (!pill) return;
        const inChat = isChatViewOpen();
        const cards = document.querySelectorAll('#roomFeedContainer .card[data-day-label]');
        if (!inChat || !cards.length) { pill.style.display = 'none'; return; }

        const LINE = 115;
        let visibleDate = '';
        for (let i = 0; i < cards.length; i++) {
            const rect = cards[i].getBoundingClientRect();
            if (rect.top <= LINE) {
                visibleDate = cards[i].getAttribute('data-day-label') || visibleDate;
            } else if (!visibleDate) {
                visibleDate = cards[i].getAttribute('data-day-label') || '';
                break;
            } else {
                break;
            }
        }
        if (!visibleDate) visibleDate = cards[0].getAttribute('data-day-label') || '';

        if (pill.dataset.label !== visibleDate) {
            pill.dataset.label = visibleDate;
            pill.innerHTML = `<b>${visibleDate}</b>`;
        }
        pill.style.display = 'inline-flex';
    }

    function showFloatingDatePill() { updateStickyDateHeader(); }

    // Requirement 1: keep the sticky date pills exactly 4px under the header/tabs
    function getStickyDateTop() {
        const chat = document.getElementById('viewRoomChat');
        const inChat = isChatViewOpen();
        let headerH = 65;
        if (inChat) {
            const bar = chat.querySelector('.top-floating-bar');
            if (bar) headerH = bar.getBoundingClientRect().height;
        } else {
            const tabs = document.getElementById('topTabsContainer');
            if (tabs) headerH = tabs.getBoundingClientRect().height;
        }
        return Math.round(headerH) + 4;
    }

    // Requirement 2: Telegram-style date divider collision.
    // The pinned date pill is pushed up and out by the next incoming date pill,
    // so dividers never merge, overlap or collapse into each other.
    function updateDateDividerCollision() {
        const inChat = isChatViewOpen();
        const container = inChat
            ? document.getElementById('roomFeedContainer')
            : document.getElementById('allFeedContainer');
        if (!container) return;

        const STICK_TOP = getStickyDateTop();
        document.documentElement.style.setProperty('--sticky-date-top', STICK_TOP + 'px');

        const dividers = Array.from(container.querySelectorAll('.tg-date-divider'));
        if (!dividers.length) return;

        dividers.forEach(d => { d.style.transform = ''; d.style.opacity = ''; d.style.visibility = ''; });

        // Natural (un-stuck) viewport position of each divider, computed from
        // layout offsets so sticky positioning cannot fool the comparison.
        const marginTop = parseFloat(getComputedStyle(dividers[0]).marginTop) || 0;
        const STUCK_AT = STICK_TOP + marginTop;
        // sticky offsets pollute offsetTop, so measure the un-stuck layout position
        dividers.forEach(d => { d.style.position = 'static'; });
        const naturalTops = dividers.map(d => d.getBoundingClientRect().top);
        dividers.forEach(d => { d.style.position = ''; });

        let pinnedIdx = -1;
        for (let i = 0; i < dividers.length; i++) {
            if (naturalTops[i] <= STUCK_AT + 1) pinnedIdx = i;
        }
        if (pinnedIdx === -1) return;

        // Only the newest stuck pill may sit under the header - older stuck pills
        // are fully hidden so two dates can never merge into each other.
        for (let i = 0; i < pinnedIdx; i++) {
            dividers[i].style.visibility = 'hidden';
        }

        const pinned = dividers[pinnedIdx];
        const next = dividers[pinnedIdx + 1];
        if (!next) return;

        const pinnedH = pinned.getBoundingClientRect().height;
        // Smaller gap = the two date cards travel closer before the pinned one
        // is pushed out (tighter, WhatsApp/Telegram-like collision).
        const GAP = 8;
        const overlap = (STUCK_AT + pinnedH + GAP) - naturalTops[pinnedIdx + 1];
        if (overlap > 0) {
            const push = Math.min(overlap, pinnedH + GAP);
            pinned.style.transform = `translateY(${-push}px)`;
            pinned.style.opacity = String(Math.max(0, 1 - push / (pinnedH + GAP)));
        }
    }

        const se = document.scrollingElement || document.documentElement;

        row.classList.toggle('is-hidden', distanceFromBottom < 120);

    // Calendar

    let selectedCalDate = new Date();

    const CAL_MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function openCalendarModal() {

    // Requirement 7: custom Year / Month popup boxes inside the date selector card
    function closeCalPopups() {
        document.getElementById('calYearPopup').classList.remove('show');
        document.getElementById('calMonthPopup').classList.remove('show');
    }

    function toggleCalYearPopup() {
        const pop = document.getElementById('calYearPopup');
        const open = pop.classList.contains('show');
        closeCalPopups();
        if (open) return;

        const current = calDate.getFullYear();
        const thisYear = new Date().getFullYear();
        pop.innerHTML = '';
        for (let y = thisYear - 10; y <= thisYear + 1; y++) {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'cal-popup-item' + (y === current ? ' selected' : '');
            item.textContent = y;
            item.onclick = () => {
                calDate.setFullYear(y);
                closeCalPopups();
                renderCalendar();
            };
            pop.appendChild(item);
        }
        pop.classList.add('show');
    }

    function toggleCalMonthPopup() {
        const pop = document.getElementById('calMonthPopup');
        const open = pop.classList.contains('show');
        closeCalPopups();
        if (open) return;

        const current = calDate.getMonth();
        pop.innerHTML = '';
        CAL_MONTH_NAMES.forEach((name, idx) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'cal-popup-item' + (idx === current ? ' selected' : '');
            item.textContent = name.slice(0, 3);
            item.onclick = () => {
                calDate.setDate(1);
                calDate.setMonth(idx);
                closeCalPopups();
                renderCalendar();
            };
            pop.appendChild(item);
        });
        pop.classList.add('show');
    }

    function renderCalendar() {
        const year = calDate.getFullYear();
        const month = calDate.getMonth();

        const monthNames = CAL_MONTH_NAMES;
        document.getElementById('calendarMonthYear').textContent = `${monthNames[month]} ${year}`;
        document.getElementById('calendarYearBtn').textContent = year;
        document.getElementById('calendarMonthBtn').textContent = monthNames[month];

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        const prevLastDate = new Date(year, month, 0).getDate();

        const grid = document.getElementById('calendarDaysGrid');
        grid.innerHTML = '';

        for (let i = firstDay; i > 0; i--) {
            const d = document.createElement('div');
            d.textContent = prevLastDate - i + 1;
            d.style.opacity = '0.3';
            grid.appendChild(d);
        }

        for (let i = 1; i <= lastDate; i++) {
            const d = document.createElement('div');
            d.textContent = i;
            d.className = 'sharp-inner-item';
            d.style.padding = '8px';
            d.style.margin = '0';
            d.style.justifyContent = 'center';
            d.style.borderRadius = '50%';

            if (i === selectedCalDate.getDate() && month === selectedCalDate.getMonth() && year === selectedCalDate.getFullYear()) {
                d.style.background = 'var(--text-color)';
                // Requirement 5: selected date text is grey, not white
                d.classList.add('cal-day-selected');
                d.style.color = '#b9bcc7';
            }

            d.onclick = () => {
                selectedCalDate = new Date(year, month, i);
                closeCalPopups();
                renderCalendar();
            };
            grid.appendChild(d);
        }
    }

    // Bubble-style curvy delivery ticks (replaces the flat FontAwesome double tick)
    function buildTickIcon(status) {
        if (status === 'failed') {
            return '<span class="msg-tick failed" title="Not sent">' +
                   '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                   '<path d="M12 3.6c4.6 0 8.4 3.2 8.4 7.3 0 4-3.8 7.2-8.4 7.2-.9 0-1.8-.1-2.6-.35-1.3.9-2.7 1.5-4.2 1.8.7-1 1.2-1.9 1.4-2.9C4.7 15.3 3.6 13.3 3.6 11c0-4.1 3.8-7.4 8.4-7.4Z"/>' +
                   '<path d="M12 7.8v3.4M12 14.1h.01"/>' +
                   '</svg></span>';
        }
        var delivered = status === 'delivered';
        return '<span class="msg-tick' + (delivered ? '' : ' pending') + '">' +
               '<svg viewBox="0 0 24 24" aria-hidden="true">' +
               '<path d="M1.8 13.1c1.5 1 2.6 2.1 3.6 3.7C7.7 12.3 10.6 8.6 14.4 5.7"/>' +
               (delivered ? '<path d="M9.2 16.6c.5.4 1 1 1.4 1.7C12.9 13.9 16 10.3 19.8 7.4"/>' : '') +
               '</svg></span>';
    }
    window.buildTickIcon = buildTickIcon;

    function updateTickInDOM(postKey) {
        const status = messageStatus[postKey] || 'sent';
        document.querySelectorAll(`[data-post-key="${postKey}"] .msg-tick`).forEach(el => {
            el.outerHTML = buildTickIcon(status);
        });
    }

    function markMessageDelivered(postKey) {
        messageStatus[postKey] = 'delivered';
        if (pendingMessages[postKey]) pendingMessages[postKey].pending = false;
        document.querySelectorAll(`[data-post-key="${postKey}"]`).forEach(c => c.classList.remove('pending-message'));
        updateTickInDOM(postKey);
    }

    // Send Message
    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendCommunityMessage();
        }
    }

    function sendCommunityMessage() {
        const input = document.getElementById('postMsgInput');
        const text = (input.value || '').trim();
        if (!text) return;

        const user = auth.currentUser;
        if (!user) {
            alert("Please log in to post messages!");
            return;
        }

        if (!isUserAvatarLoaded || !currentUserProfile) {
            showCustomToast("Loading profile data, please wait...");
            return;
        }

        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeMs = now.getTime();
        const uid = user.uid;

        const nodeKey = `${timeMs}_${uid}`;
        const catClean = sanitizePath(currentSelectedCategory.name || currentSelectedCategory);
        const subClean = sanitizePath(currentSelectedSubCategory);

        const age = currentUserProfile ? calculateAge(currentUserProfile.dob) : null;
        const fullName = currentUserProfile ? `${currentUserProfile.firstName || ''} ${currentUserProfile.lastName || ''}`.trim() : 'Learner';

        const payload = {
            uid: uid,
            userName: fullName || user.email || 'Learner',
            userAvatar: currentUserProfile.profilePicURL || '',
            userAge: age,
            userCountry: currentUserProfile.country || currentUserProfile.userCountry || '',
            userDob: currentUserProfile.dob || '',
            text: text,
            timestamp: timeMs
        };

        // Attach Telegram Style Reply Object if active
        if (selectedReplyPost) {
            payload.replyTo = {
                postKey: selectedReplyPost.postKey || '',
                userName: selectedReplyPost.userName || 'User',
                text: selectedReplyPost.text || '',
                uid: selectedReplyPost.uid || ''
            };
        }

        const targetRef = db.ref(`community/${catClean}/${subClean}/${dateStr}/${nodeKey}`);

        // Requirement 3: show the message instantly with a single tick,
        // then switch to a double tick once it is fully delivered (WhatsApp style).
        const optimistic = Object.assign({}, payload, {
            postKey: nodeKey,
            dateKey: dateStr,
            catClean: catClean,
            subClean: subClean,
            pending: true
        });
        pendingMessages[nodeKey] = optimistic;
        messageStatus[nodeKey] = 'sent';

        input.value = '';
        cancelReply();
        handleComposeInput();
        playTouchSound();

        // Always keep the freshly sent message inside the visible window,
        // even when it is a long, multi-line message.
        renderRoomMessages({ scrollToBottom: true });
        scrollChatToBottom(false);

        targetRef.set(payload).then(() => {
            markMessageDelivered(nodeKey);
        }).catch(err => {
            console.error("Post error:", err);
            messageStatus[nodeKey] = 'failed';
            updateTickInDOM(nodeKey);
            showCustomToast("Message not sent • check your connection");
        });
    }

        switchMainTab('all');
        positionTabSlider();
        document.documentElement.style.setProperty('--sticky-date-top', getStickyDateTop() + 'px');
        setTimeout(updateDateDividerCollision, 400);
    });
    window.addEventListener('resize', () => positionTabSlider(true));
  </script>
</body>
</html>
