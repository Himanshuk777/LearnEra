<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>LearnEra Calculator Hub — Tools & Utilities</title>
<meta name="description" content="LearnEra neumorphic hub with hundreds of financial, health, math, conversion and everyday calculators plus utilities, in a single file."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ============================================================
     Early theme bootstrap — identical logic to LearnEra / News.
     Reads appThemeMode (light | dark | system) and darkTextStyle
     (colorful | deep-dark) BEFORE first paint so there is no flash.
     ============================================================ -->
<script>
(function () {
  try {
    var savedTheme = localStorage.getItem('appThemeMode') || 'system';
    var isDark = savedTheme === 'dark' ||
      (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) {
      var darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-dark-text', darkStyle);
    } else {
      document.documentElement.setAttribute('data-theme', 'default');
      document.documentElement.removeAttribute('data-dark-text');
    }
    var topSp = localStorage.getItem('appTopSpace') || '2';
    document.documentElement.style.setProperty('--top-space', topSp + 'vh');
  } catch (e) {
    document.documentElement.style.setProperty('--top-space', '2vh');
  }
})();
</script>

<style>
/* ============================================================
   1. DESIGN TOKENS — copied 1:1 from LearnEra main file so the
      neumorphic sharp-shadow effect matches exactly.
   ============================================================ */
:root{
  --body-bg:#e6edf7;
  --neu-shadow-light:#ffffff;
  --neu-shadow-dark:#c8d3e4;

  --text-color:#2d3748;
  --sub-text-color:#718096;
  --head-color:#8A2BE2;
  --blue:#1E90FF;
  --accent2:#12b6a4;
  --danger:#f2647a;
  --divider-color:rgba(138,43,226,.15);

  /* Sharp neumorphic shadow set (LearnEra) */
  --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
  --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
  --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
  --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -6px -6px 12px var(--neu-shadow-light);
  --settings-shadow-sharp: 4px 4px 6px var(--neu-shadow-dark), -4px -4px 6px var(--neu-shadow-light);
  --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);

  --top-space:2vh;
  --transition-theme: background-color .8s ease, color .8s ease, box-shadow .8s ease, border-color .8s ease;

  /* LearnEra unified header tokens (News.html) */
  --learnera-purple:#7c3aed;
  --learnera-pink:#ec4899;
  --themed-blue:var(--blue);
  --header-outline-start:var(--learnera-purple);
  --header-outline-end:var(--learnera-pink);
  --icon-gradient-start:var(--learnera-purple);
  --icon-gradient-end:var(--learnera-pink);
  --search-bar-bg:var(--body-bg);
  --search-input-color:var(--learnera-purple);
  --search-input-placeholder-color:#a3b1c6;
}

/* ---- Dark (Colorful) Mode ---- */
html[data-theme="dark"]{
  --body-bg:#1e1e24;
  --neu-shadow-dark:#101014;
  --neu-shadow-light:rgba(255,255,255,.05);

  --text-color:rgba(255,255,255,.7);
  --sub-text-color:#a3b1c6;
  --head-color:rgba(233,30,99,.85);
  --divider-color:rgba(255,255,255,.06);

  --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255,255,255,.02);
  --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255,255,255,.02);
  --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255,255,255,.02);
  --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255,255,255,.02);
  --settings-shadow-sharp: 4px 4px 6px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255,255,255,.02);
  --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -2px -2px 4px rgba(255,255,255,.02);
}

/* ---- Deep Dark Mode ---- */
html[data-dark-text="deep-dark"]{
  --body-bg:#0c0c0f;
  --neu-shadow-dark:#050506;
  --divider-color:rgba(255,255,255,.04);

  --text-color:rgba(255,255,255,.35);
  --sub-text-color:rgba(255,255,255,.3);
  --head-color:rgba(255,255,255,.35);
  --blue:#ffffff;
  --themed-blue:#ffffff;
  --accent2:rgba(255,255,255,.35);

  --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255,255,255,.01);
  --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255,255,255,.01);
  --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255,255,255,.01);
  --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255,255,255,.01);

  --search-input-color:#ffffff;
  --search-input-placeholder-color:#9b9b9f;
  --header-outline-start:#080808;
  --header-outline-end:#ffffff;
  --icon-gradient-start:#080808;
  --icon-gradient-end:#ffffff;
}
html[data-dark-text="deep-dark"] *,
html[data-dark-text="deep-dark"] h1,
html[data-dark-text="deep-dark"] h2,
html[data-dark-text="deep-dark"] h3,
html[data-dark-text="deep-dark"] p,
html[data-dark-text="deep-dark"] span,
html[data-dark-text="deep-dark"] button,
html[data-dark-text="deep-dark"] input,
html[data-dark-text="deep-dark"] select{
  color:#7a8b9e !important;
}
html[data-dark-text="deep-dark"] img{
  filter:grayscale(100%) brightness(.75) opacity(.8) !important;
}

/* ============================================================
   2. BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{margin:0;padding:0}
body{
  background:var(--body-bg);
  color:var(--text-color);
  font-family:'Poppins',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:var(--transition-theme);
  min-height:100vh;
}
a{color:inherit}

.app-container{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:0 15px 90px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* ============================================================
   3. HEADER — identical to News.html unified LearnEra header
      (branding + theme button intentionally removed).
   ============================================================ */
.header-card{
  flex-shrink:0;
  position:sticky;
  top:0;
  width:calc(100% + 30px);
  margin:0 -15px;
  border-top-left-radius:0 !important;
  border-top-right-radius:0 !important;
  border-bottom-left-radius:20px !important;
  border-bottom-right-radius:20px !important;
  padding:20px;
  box-shadow:none !important;
  border:1.5px solid transparent !important;
  background:
    linear-gradient(var(--body-bg),var(--body-bg)) padding-box,
    linear-gradient(110deg,var(--header-outline-start),var(--header-outline-end)) border-box !important;
  outline:none !important;
  border-top:none !important;
  display:flex;
  flex-direction:column;
  gap:12px;
  transition:var(--transition-theme), transform .4s cubic-bezier(.25,1,.5,1), opacity .4s ease, visibility .4s ease;
  z-index:1000;
}
.header-card.hidden{transform:translateY(-130%);opacity:0;visibility:hidden;pointer-events:none}
@media (max-width:768px){
  .header-card{width:calc(100% + 30px) !important;margin:0 -15px !important;padding:18px 15px !important}
}

.search-row{display:flex;align-items:center;gap:10px;width:100%;transition:gap .4s cubic-bezier(.25,1,.5,1)}
.search-bar-container{
  flex:1;min-width:0;background:var(--search-bar-bg);border-radius:25px;padding:10px 18px;
  display:flex;align-items:center;border:1px solid rgba(255,255,255,.4);
  box-shadow:var(--card-shadow-micro);
  transition:box-shadow .3s ease, flex .4s cubic-bezier(.25,1,.5,1), opacity .3s ease;
}
.search-bar-container:focus-within{
  border-color:transparent;
  box-shadow:var(--card-shadow-inset);
  background:
    linear-gradient(var(--search-bar-bg),var(--search-bar-bg)) padding-box,
    linear-gradient(110deg,var(--header-outline-start),var(--header-outline-end)) border-box;
}
.search-icon-mask{
  width:20px;height:20px;
  background:linear-gradient(110deg,var(--icon-gradient-start),var(--icon-gradient-end));
  -webkit-mask:url('https://ik.imagekit.io/lssafvcmr/magnifying-glass%20(1).png') no-repeat center / contain;
  mask:url('https://ik.imagekit.io/lssafvcmr/magnifying-glass%20(1).png') no-repeat center / contain;
  opacity:.9;margin-right:10px;flex-shrink:0;transition:background-color .3s ease;
}
.search-bar-container input{
  flex-grow:1;background:transparent;border:none;outline:none;color:transparent;
  background-image:linear-gradient(110deg,var(--icon-gradient-start),var(--icon-gradient-end));
  background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  caret-color:var(--learnera-pink);
  font-size:.95em;font-weight:600;font-family:'Poppins',sans-serif !important;
}
.search-bar-container input::placeholder{
  color:var(--search-input-placeholder-color);
  -webkit-text-fill-color:var(--search-input-placeholder-color);
  font-weight:500;
}

.filter-toggle-btn{
  width:42px;height:42px;flex-shrink:0;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);cursor:pointer;background:var(--body-bg);color:var(--blue);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--card-shadow-micro);
  transition:width .4s cubic-bezier(.25,1,.5,1), opacity .4s cubic-bezier(.25,1,.5,1),
             margin .4s cubic-bezier(.25,1,.5,1), box-shadow .3s ease, transform .2s ease, border-color .3s ease;
}
.filter-toggle-btn svg{width:20px;height:20px;stroke:url(#learneraIconGradient) !important;color:var(--themed-blue) !important}
.filter-toggle-btn:active{transform:scale(.92);box-shadow:var(--card-shadow-inset)}
.filter-toggle-btn.active{
  box-shadow:var(--card-shadow-inset) !important;color:var(--blue);
  border:1px solid transparent !important;
  background:
    linear-gradient(var(--body-bg),var(--body-bg)) padding-box,
    linear-gradient(110deg,var(--icon-gradient-start),var(--icon-gradient-end)) border-box !important;
}
.search-row.search-active .filter-toggle-btn{width:0 !important;opacity:0 !important;margin:0 !important;padding:0 !important;pointer-events:none !important}
.search-row.search-active{gap:0 !important}

/* Header controls disabled (Utilities section active) */
.search-row.controls-disabled{opacity:.45;pointer-events:none;filter:saturate(.4)}
.header-card.controls-off .categories-filter-wrapper{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin:0;pointer-events:none;overflow:hidden}

.categories-filter-wrapper{
  display:flex;overflow-x:auto;width:100%;padding:6px 2px 4px;gap:10px;
  max-height:100px;opacity:1;margin:0;scrollbar-width:none;
  transition:max-height .35s ease, opacity .3s ease, padding .35s ease, margin .35s ease;
}
.categories-filter-wrapper.collapsed,
.search-row.search-active ~ .categories-filter-wrapper{
  max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin:0;pointer-events:none;overflow:hidden;
}
.categories-filter-wrapper::-webkit-scrollbar{display:none}

.category-pill{
  flex-shrink:0;background:var(--body-bg);border:1px solid rgba(255,255,255,.3);border-radius:16px;
  padding:6px 16px;margin:2px 0;color:var(--text-color);font-size:.85em;font-weight:600;cursor:pointer;
  box-shadow:var(--card-shadow-micro);transition:all .3s;display:inline-flex;align-items:center;justify-content:center;
}
.category-pill.active{
  box-shadow:var(--card-shadow-inset);border:1px solid transparent !important;
  background:
    linear-gradient(var(--body-bg),var(--body-bg)) padding-box,
    linear-gradient(110deg,var(--icon-gradient-start),var(--icon-gradient-end)) border-box !important;
  font-weight:700;
}
.category-pill.active span{
  background-image:linear-gradient(110deg,var(--icon-gradient-start),var(--icon-gradient-end));
  background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

/* ============================================================
   4. SECTION SWITCHER — Tools & Utilities
   ============================================================ */
.section-switch{
  display:flex;gap:10px;padding:6px;border-radius:22px;background:var(--body-bg);
  box-shadow:var(--card-shadow-inset);margin-top:6px;
}
.section-switch button{
  flex:1;border:0;cursor:pointer;background:var(--body-bg);color:var(--sub-text-color);
  font:700 .9em 'Poppins',sans-serif;padding:12px 10px;border-radius:16px;
  box-shadow:var(--card-shadow-micro);transition:all .3s ease;
}
.section-switch button.active{
  box-shadow:var(--settings-shadow-inset-sharp);
  background-image:linear-gradient(110deg,var(--icon-gradient-start),var(--icon-gradient-end));
  background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:800;
}
.section-switch button:active{transform:scale(.97)}

.sec-title{
  margin:14px 0 0;font-size:.8em;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--head-color);font-weight:800;
}
.count{font-size:.78em;color:var(--sub-text-color);font-weight:600}

/* ============================================================
   5. CARDS + GRID (neumorphic sharp shadows)
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:6px}
@media (min-width:1024px){.grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}}

.card{
  border-radius:20px;box-shadow:var(--card-shadow);padding:18px;cursor:pointer;
  border:0;background:var(--body-bg);text-align:left;font-family:inherit;color:var(--text-color);
  transition:box-shadow .25s ease, transform .25s cubic-bezier(.25,1,.5,1), opacity .5s ease;
  opacity:0;transform:translateY(18px);
}
.card.in-view{opacity:1;transform:translateY(0)}
.card:hover{transform:translateY(-3px)}
.card:active{box-shadow:var(--card-shadow-inset);transform:scale(.98)}
.card .cat{font:800 .62em 'Poppins';letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2)}
.card h3{margin:8px 0 6px;font-size:.98em;color:var(--head-color);font-weight:800}
.card p{margin:0;font-size:.78em;color:var(--sub-text-color);line-height:1.55}

/* Utilities cards with parallax image window */
.util-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:6px}
.utility-card{
  border-radius:22px;background:var(--body-bg);box-shadow:var(--card-shadow);
  overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;font-family:inherit;
  transition:box-shadow .25s ease, transform .25s cubic-bezier(.25,1,.5,1);
}
.utility-card:active{box-shadow:var(--card-shadow-inset);transform:scale(.98)}
.utility-media{position:relative;height:150px;overflow:hidden;border-radius:22px 22px 0 0}
.utility-media img{
  position:absolute;left:0;top:-18%;width:100%;height:136%;object-fit:cover;
  will-change:transform;transition:transform .1s linear;
}
.utility-body{padding:16px 18px 20px}
.utility-body h3{margin:0 0 6px;font-size:.98em;font-weight:800;color:var(--head-color)}
.utility-body p{margin:0;font-size:.78em;color:var(--sub-text-color);line-height:1.55}

.empty-state{
  border-radius:22px;box-shadow:var(--settings-shadow-inset-sharp);padding:44px 22px;text-align:center;
  color:var(--sub-text-color);font-size:.85em;font-weight:600;
}

/* ============================================================
   6. SKELETON LOADING (LearnEra + News shimmer)
   ============================================================ */
.skeleton-loading{
  background:var(--body-bg) !important;border-color:transparent !important;
  box-shadow:var(--settings-shadow-inset-sharp) !important;color:transparent !important;
  pointer-events:none !important;position:relative !important;overflow:hidden !important;
  height:140px !important;border-radius:20px;opacity:.75;
}
.skeleton-loading *{visibility:hidden !important}
.skeleton-loading::after{
  content:"";position:absolute;top:0;left:-150%;width:150%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:skeleton-shimmer-animation 2.5s linear infinite;
}
html[data-theme="dark"] .skeleton-loading::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
@keyframes skeleton-shimmer-animation{0%{left:-150%}100%{left:150%}}
.skeleton-pill{height:32px !important;border-radius:16px;width:110px;flex-shrink:0}

/* ============================================================
   7. MODAL SHEET
   ============================================================ */
.modal{
  position:fixed;inset:0;z-index:2000;display:none;
  background:color-mix(in srgb,var(--body-bg) 78%,transparent);
  backdrop-filter:blur(6px);overflow:auto;padding:22px 14px 60px;
}
.modal.on{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}
.sheet{
  max-width:640px;margin:0 auto;border-radius:26px;box-shadow:var(--card-shadow);
  padding:22px;background:var(--body-bg);animation:sheetIn .35s cubic-bezier(.25,1,.5,1);
}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{margin:2px 0 4px;font-size:1.2em;color:var(--head-color);font-weight:800}
.sheet .sub{font-size:.8em;color:var(--sub-text-color);margin:0 0 18px;line-height:1.55}
.iconbtn{
  border:0;background:var(--body-bg);color:var(--blue);width:42px;height:42px;border-radius:50%;
  box-shadow:var(--card-shadow-micro);cursor:pointer;font-size:1em;
}
.iconbtn:active{box-shadow:var(--card-shadow-inset);transform:scale(.92)}
.closex{float:right}
.field{margin-bottom:14px}
.field label{display:block;font:700 .75em 'Poppins';color:var(--sub-text-color);margin-bottom:7px}
.field input,.field select{
  width:100%;border:0;outline:0;background:var(--body-bg);box-shadow:var(--settings-shadow-inset-sharp);
  border-radius:14px;padding:13px 15px;font:600 .95em 'Poppins';color:var(--text-color);appearance:none;
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:12px;margin-top:6px}
.btn{
  flex:1;border:0;cursor:pointer;background:var(--body-bg);color:var(--blue);
  font:800 .88em 'Poppins';padding:15px;border-radius:16px;box-shadow:var(--card-shadow-sm);
  transition:transform .2s ease, box-shadow .25s ease;
}
.btn:active{box-shadow:var(--card-shadow-inset);transform:scale(.97)}
.btn.ghost{color:var(--sub-text-color)}
.result{margin-top:20px;border-radius:18px;box-shadow:var(--card-shadow-inset);padding:18px}
.result .rrow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:.85em;border-bottom:1px dashed var(--divider-color)}
.result .rrow:last-child{border:0}
.result .rrow span:first-child{color:var(--sub-text-color);font-weight:600}
.result .rrow span:last-child{color:var(--text-color);font-weight:800;text-align:right}
.result .rrow.hero span:last-child{color:var(--blue);font-size:1.2em}
.err{color:var(--danger);font-weight:700;font-size:.8em}

/* ============================================================
   8. SCIENTIFIC CALCULATOR — neumorphic build in the spirit of
      https://codepen.io/jh3y/pen/QWYPaax (soft squircle keys,
      deep inset display, pressed-in feedback on every tap).
   ============================================================ */
.sci-shell{
  border-radius:28px;background:var(--body-bg);box-shadow:var(--card-shadow);
  padding:20px;margin-top:14px;
}
.sci-disp{
  border-radius:20px;box-shadow:var(--card-shadow-inset);padding:18px 20px;text-align:right;
  background:var(--body-bg);margin-bottom:18px;
}
.sci-disp .expr{
  font:600 .8em 'Poppins';color:var(--sub-text-color);min-height:1.2em;
  overflow-x:auto;white-space:nowrap;scrollbar-width:none;
}
.sci-disp .expr::-webkit-scrollbar{display:none}
.sci-disp .out{
  font:800 1.75em 'Poppins';color:var(--head-color);overflow-x:auto;white-space:nowrap;scrollbar-width:none;
}
.sci-disp .out::-webkit-scrollbar{display:none}
.sci-modes{display:flex;gap:8px;margin-bottom:14px}
.sci-modes button{
  flex:1;border:0;cursor:pointer;background:var(--body-bg);color:var(--sub-text-color);
  font:700 .72em 'Poppins';padding:9px 4px;border-radius:14px;box-shadow:var(--card-shadow-micro);
  transition:all .25s ease;
}
.sci-modes button.on{box-shadow:var(--settings-shadow-inset-sharp);color:var(--blue)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.keys button{
  border:0;cursor:pointer;background:var(--body-bg);color:var(--text-color);
  font:700 .92em 'Poppins';aspect-ratio:1/1;border-radius:18px;
  box-shadow:var(--card-shadow-sm);
  display:flex;align-items:center;justify-content:center;
  transition:box-shadow .12s ease, transform .12s ease, color .3s ease;
}
.keys button:active,.keys button.pressed{box-shadow:var(--card-shadow-inset);transform:scale(.95)}
.keys button.fn{color:var(--accent2);font-size:.78em}
.keys button.op{color:var(--blue)}
.keys button.eq{
  grid-column:span 1;color:var(--learnera-pink);
  background:linear-gradient(var(--body-bg),var(--body-bg)) padding-box,
             linear-gradient(110deg,var(--icon-gradient-start),var(--icon-gradient-end)) border-box;
  border:1.5px solid transparent;
}
@media (max-width:420px){.keys{gap:9px}.keys button{border-radius:15px;font-size:.85em}}

footer{margin-top:34px;text-align:center;font-size:.72em;color:var(--sub-text-color)}
@media(max-width:520px){.row2{grid-template-columns:1fr}.sheet{padding:18px}}
@media(min-width:1024px){.app-container{padding:0 24px 90px}}
</style>
</head>
<body>

<div class="app-container">

  <!-- ===== LearnEra unified header (News.html style, no branding / theme button) ===== -->
  <div class="header-card" id="headerCard">
    <div class="search-row" id="searchRow">
      <div class="search-bar-container" id="searchWrap">
        <div class="search-icon-mask"></div>
        <input id="q" type="text" autocomplete="off" placeholder="Search calculators… (mortgage, BMI, percent, area)"/>
      </div>
      <button class="filter-toggle-btn" id="filterBtn" aria-label="Toggle filters" title="Toggle filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="learneraIconGradient" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--icon-gradient-start)"/>
              <stop offset="1" stop-color="var(--icon-gradient-end)"/>
            </linearGradient>
          </defs>
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="7" y1="12" x2="17" y2="12"></line>
          <line x1="10" y1="18" x2="14" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="categories-filter-wrapper collapsed" id="chips"></div>
  </div>

  <!-- ===== Tools & Utilities section switcher ===== -->
  <div class="section-switch" id="sectionSwitch">
    <button data-section="tools" class="active">Tools</button>
    <button data-section="utilities">Utilities</button>
  </div>

  <!-- ===== Tools section ===== -->
  <div id="toolsSection">
    <div class="sec-title">All Tools</div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ===== Utilities section (parallax cards) ===== -->
  <div id="utilitiesSection" style="display:none">
    <div class="sec-title">Utilities</div>
    <div class="count" id="utilCount"></div>
    <div class="util-grid" id="utilGrid"></div>
  </div>

  <footer>Built for LearnEra · all math runs locally in your browser</footer>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const F=n=>isFinite(n)?Number(n).toLocaleString(undefined,{maximumFractionDigits:2}):'—';
const M=n=>isFinite(n)?Number(n).toLocaleString(undefined,{maximumFractionDigits:6}):'—';
const C=n=>isFinite(n)?Number(n).toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:2}):'—';
const P=n=>isFinite(n)?Number(n).toFixed(2)+'%':'—';
const pmt=(p,r,n)=>r===0?p/n:p*r/(1-Math.pow(1+r,-n));
const CALCS=[];
const add=(c,n,d,f,fn)=>CALCS.push({c,n,d,f,fn});
const num=(k,l,v,step)=>({k,l,v,step});
const sel=(k,l,o,v)=>({k,l,o,v});
</script>
<script>
/* ---------------- FINANCIAL ---------------- */
add('Financial','Loan Calculator','Monthly payment, total interest and cost for any amortizing loan.',
 [num('p','Loan amount',25000),num('r','Annual interest rate (%)',7.5),num('y','Term (years)',5)],
 i=>{const n=i.y*12,m=pmt(i.p,i.r/1200,n);return[['Monthly payment',C(m),1],['Total paid',C(m*n)],['Total interest',C(m*n-i.p)],['Payments',F(n)]];});
add('Financial','Mortgage Calculator','Home loan payment including taxes, insurance and PMI.',
 [num('p','Home price',350000),num('d','Down payment',70000),num('r','Rate (%)',6.5),num('y','Term (years)',30),num('t','Annual property tax',3600),num('ins','Annual insurance',1500)],
 i=>{const L=i.p-i.d,n=i.y*12,m=pmt(L,i.r/1200,n),extra=(i.t+i.ins)/12;return[['Monthly payment (PITI)',C(m+extra),1],['Principal & interest',C(m)],['Taxes + insurance',C(extra)],['Loan amount',C(L)],['Total interest',C(m*n-L)]];});
add('Financial','Auto Loan Calculator','Car finance payment with trade-in, tax and fees.',
 [num('p','Vehicle price',32000),num('d','Down payment',5000),num('tr','Trade-in value',3000),num('tax','Sales tax (%)',7),num('r','Rate (%)',6.9),num('y','Term (years)',5)],
 i=>{const L=(i.p-i.tr)*(1+i.tax/100)-i.d,n=i.y*12,m=pmt(L,i.r/1200,n);return[['Monthly payment',C(m),1],['Amount financed',C(L)],['Total interest',C(m*n-L)],['Total cost',C(m*n+i.d)]];});
add('Financial','Interest Calculator','Growth of a deposit with optional contributions.',
 [num('p','Principal',10000),num('r','Annual rate (%)',5),num('y','Years',10),num('c','Monthly contribution',100)],
 i=>{const r=i.r/1200,n=i.y*12,fv=i.p*Math.pow(1+r,n)+(r?i.c*((Math.pow(1+r,n)-1)/r):i.c*n);return[['Future value',C(fv),1],['Total contributed',C(i.p+i.c*n)],['Interest earned',C(fv-i.p-i.c*n)]];});
add('Financial','Compound Interest Calculator','Compare compounding frequencies over time.',
 [num('p','Principal',5000),num('r','Rate (%)',6),num('y','Years',10),sel('m','Compounds per year',[['12','Monthly'],['1','Annually'],['4','Quarterly'],['365','Daily']],'12')],
 i=>{const m=+i.m,fv=i.p*Math.pow(1+i.r/100/m,m*i.y);return[['Future value',C(fv),1],['Interest',C(fv-i.p)],['Effective annual rate',P((Math.pow(1+i.r/100/m,m)-1)*100)]];});
add('Financial','Simple Interest Calculator','Interest without compounding.',
 [num('p','Principal',5000),num('r','Rate (%)',6),num('y','Years',3)],
 i=>{const x=i.p*i.r/100*i.y;return[['Interest',C(x),1],['Total',C(i.p+x)]];});
add('Financial','Savings Calculator','How much a monthly saving habit becomes.',
 [num('p','Starting balance',1000),num('c','Monthly deposit',300),num('r','APY (%)',4),num('y','Years',8)],
 i=>{const r=i.r/1200,n=i.y*12,fv=i.p*Math.pow(1+r,n)+i.c*((Math.pow(1+r,n)-1)/r);return[['Balance',C(fv),1],['Deposited',C(i.p+i.c*n)],['Interest',C(fv-i.p-i.c*n)]];});
add('Financial','Investment Return Calculator','CAGR and profit for an investment.',
 [num('p','Initial value',10000),num('f','Final value',26000),num('y','Years',7)],
 i=>[['CAGR',P((Math.pow(i.f/i.p,1/i.y)-1)*100),1],['Total return',P((i.f/i.p-1)*100)],['Profit',C(i.f-i.p)]]);
add('Financial','Retirement Calculator','Projected nest egg and sustainable income.',
 [num('a','Current age',32),num('ra','Retirement age',65),num('b','Current savings',45000),num('c','Monthly savings',700),num('r','Return (%)',7),num('w','Withdrawal rate (%)',4)],
 i=>{const n=(i.ra-i.a)*12,r=i.r/1200,fv=i.b*Math.pow(1+r,n)+i.c*((Math.pow(1+r,n)-1)/r);return[['Nest egg at retirement',C(fv),1],['Annual income',C(fv*i.w/100)],['Monthly income',C(fv*i.w/1200)],['Years saving',F(i.ra-i.a)]];});
add('Financial','401(k) Calculator','Balance with employer match.',
 [num('s','Annual salary',85000),num('c','Your contribution (%)',8),num('m','Employer match (%)',4),num('r','Return (%)',7),num('y','Years',25)],
 i=>{const mo=(i.s*(i.c+i.m)/100)/12,r=i.r/1200,n=i.y*12,fv=mo*((Math.pow(1+r,n)-1)/r);return[['Projected balance',C(fv),1],['Monthly contribution',C(mo)],['Total contributed',C(mo*n)]];});
add('Financial','Annuity Payout Calculator','Income a lump sum can pay out.',
 [num('p','Balance',500000),num('r','Return (%)',5),num('y','Years of payout',25)],
 i=>{const m=pmt(i.p,i.r/1200,i.y*12);return[['Monthly payout',C(m),1],['Annual payout',C(m*12)],['Total paid',C(m*i.y*12)]];});
add('Financial','Amortization Calculator','Balance after a chosen number of payments.',
 [num('p','Loan amount',200000),num('r','Rate (%)',6),num('y','Years',30),num('k','Payments made',60)],
 i=>{const r=i.r/1200,n=i.y*12,m=pmt(i.p,r,n),bal=i.p*Math.pow(1+r,i.k)-m*((Math.pow(1+r,i.k)-1)/r);return[['Remaining balance',C(bal),1],['Monthly payment',C(m)],['Principal paid',C(i.p-bal)],['Interest paid',C(m*i.k-(i.p-bal))]];});
add('Financial','Refinance Calculator','Savings from refinancing a loan.',
 [num('b','Current balance',240000),num('r1','Current rate (%)',7.2),num('r2','New rate (%)',5.8),num('y','New term (years)',25),num('cost','Closing costs',4000)],
 i=>{const n=i.y*12,a=pmt(i.b,i.r1/1200,n),b=pmt(i.b,i.r2/1200,n),s=a-b;return[['New payment',C(b),1],['Monthly savings',C(s)],['Break-even',F(i.cost/s)+' months'],['5-year net savings',C(s*60-i.cost)]];});
add('Financial','Debt Payoff Calculator','Months to clear a balance.',
 [num('b','Balance',12000),num('r','APR (%)',19.99),num('p','Monthly payment',400)],
 i=>{const r=i.r/1200;if(i.p<=i.b*r)return[['Result','Payment too low to ever clear',1]];const n=-Math.log(1-i.b*r/i.p)/Math.log(1+r);return[['Months to payoff',F(Math.ceil(n)),1],['Years',F(n/12)],['Total interest',C(i.p*n-i.b)]];});
add('Financial','Credit Card Payoff Calculator','Minimum vs fixed payment comparison.',
 [num('b','Balance',6000),num('r','APR (%)',22),num('p','Monthly payment',250)],
 i=>{const r=i.r/1200,n=-Math.log(1-i.b*r/i.p)/Math.log(1+r);return[['Payoff time',F(n)+' months',1],['Interest paid',C(i.p*n-i.b)],['Total paid',C(i.p*n)]];});
add('Financial','Down Payment Calculator','How much cash you need up front.',
 [num('p','Home price',400000),num('d','Down payment (%)',20)],
 i=>[['Down payment',C(i.p*i.d/100),1],['Loan amount',C(i.p*(1-i.d/100))],['PMI likely?',i.d<20?'Yes':'No']]);
add('Financial','House Affordability Calculator','Price range based on income and debts.',
 [num('s','Annual income',95000),num('d','Monthly debts',600),num('r','Rate (%)',6.5),num('dp','Down payment',60000),num('y','Term (years)',30)],
 i=>{const cap=i.s/12*0.36-i.d,r=i.r/1200,n=i.y*12,L=cap*(1-Math.pow(1+r,-n))/r;return[['Affordable price',C(L+i.dp),1],['Max loan',C(L)],['Max monthly payment',C(cap)]];});
add('Financial','Rent vs Buy Calculator','Rough monthly cost comparison.',
 [num('rent','Monthly rent',2200),num('p','Home price',420000),num('dp','Down payment',84000),num('r','Rate (%)',6.4),num('own','Monthly taxes+upkeep',900)],
 i=>{const m=pmt(i.p-i.dp,i.r/1200,360)+i.own;return[['Owning per month',C(m),1],['Renting per month',C(i.rent)],['Difference',C(m-i.rent)],['Cheaper option',m<i.rent?'Buying':'Renting']];});
add('Financial','Rental Property Calculator','Cash flow and cap rate.',
 [num('p','Purchase price',300000),num('rent','Monthly rent',2600),num('ex','Monthly expenses',700),num('m','Monthly mortgage',1500)],
 i=>{const cf=i.rent-i.ex-i.m,noi=(i.rent-i.ex)*12;return[['Monthly cash flow',C(cf),1],['Annual cash flow',C(cf*12)],['NOI',C(noi)],['Cap rate',P(noi/i.p*100)]];});
add('Financial','ROI Calculator','Return on investment percentage.',
 [num('c','Cost',5000),num('g','Gain / final value',7200)],
 i=>[['ROI',P((i.g-i.c)/i.c*100),1],['Net profit',C(i.g-i.c)]]);
add('Financial','Break-Even Calculator','Units needed to cover fixed costs.',
 [num('f','Fixed costs',20000),num('p','Price per unit',49),num('v','Variable cost per unit',18)],
 i=>[['Break-even units',F(Math.ceil(i.f/(i.p-i.v))),1],['Break-even revenue',C(Math.ceil(i.f/(i.p-i.v))*i.p)],['Contribution margin',C(i.p-i.v)]]);
add('Financial','Business Loan Calculator','Payment for a commercial loan with fee.',
 [num('p','Loan amount',150000),num('r','Rate (%)',9),num('y','Term (years)',7),num('fee','Origination fee (%)',2)],
 i=>{const n=i.y*12,m=pmt(i.p,i.r/1200,n);return[['Monthly payment',C(m),1],['Fee',C(i.p*i.fee/100)],['Total interest',C(m*n-i.p)]];});
add('Financial','Lease Calculator','Monthly vehicle lease estimate.',
 [num('p','Vehicle price',38000),num('res','Residual value',22000),num('y','Lease years',3),num('mf','Money factor',0.0022)],
 i=>{const n=i.y*12,dep=(i.p-i.res)/n,fin=(i.p+i.res)*i.mf;return[['Monthly lease',C(dep+fin),1],['Depreciation part',C(dep)],['Finance part',C(fin)]];});
add('Financial','Payback Period Calculator','Years to recover an investment.',
 [num('c','Initial cost',60000),num('cf','Annual cash flow',14000)],
 i=>[['Payback period',F(i.c/i.cf)+' years',1],['Months',F(i.c/i.cf*12)]]);
add('Financial','NPV Calculator','Net present value of a level cash flow.',
 [num('c','Initial investment',100000),num('cf','Annual cash flow',25000),num('y','Years',6),num('r','Discount rate (%)',8)],
 i=>{const r=i.r/100,pv=i.cf*(1-Math.pow(1+r,-i.y))/r;return[['NPV',C(pv-i.c),1],['PV of inflows',C(pv)],['Profitability index',M(pv/i.c)]];});
add('Financial','Present Value Calculator','Today\u2019s value of a future sum.',
 [num('f','Future value',50000),num('r','Rate (%)',6),num('y','Years',10)],
 i=>[['Present value',C(i.f/Math.pow(1+i.r/100,i.y)),1],['Discount',C(i.f-i.f/Math.pow(1+i.r/100,i.y))]]);
add('Financial','Future Value Calculator','Value of money later on.',
 [num('p','Present value',20000),num('r','Rate (%)',6),num('y','Years',10)],
 i=>[['Future value',C(i.p*Math.pow(1+i.r/100,i.y)),1],['Growth',C(i.p*Math.pow(1+i.r/100,i.y)-i.p)]]);
add('Financial','Inflation Calculator','Purchasing power over time.',
 [num('a','Amount today',1000),num('r','Inflation (%)',3.2),num('y','Years',20)],
 i=>[['Equivalent future cost',C(i.a*Math.pow(1+i.r/100,i.y)),1],['Value of today\u2019s money then',C(i.a/Math.pow(1+i.r/100,i.y))]]);
add('Financial','Salary Calculator','Convert pay between periods.',
 [num('a','Amount',30),sel('per','Per',[['hour','Hour'],['day','Day'],['week','Week'],['month','Month'],['year','Year']],'hour'),num('h','Hours per week',40)],
 i=>{const wk={hour:i.a*i.h,day:i.a*5,week:i.a,month:i.a*12/52,year:i.a/52}[i.per];return[['Yearly',C(wk*52),1],['Monthly',C(wk*52/12)],['Weekly',C(wk)],['Hourly',C(wk/i.h)]];});
add('Financial','Take-Home Pay Calculator','Estimated net pay after tax rate.',
 [num('s','Gross annual salary',80000),num('t','Effective tax rate (%)',24),num('d','Annual deductions',6000)],
 i=>{const net=(i.s-i.d)*(1-i.t/100);return[['Net annual',C(net),1],['Net monthly',C(net/12)],['Tax paid',C((i.s-i.d)*i.t/100)]];});
add('Financial','Income Tax Estimator','Progressive-bracket style estimate.',
 [num('s','Taxable income',75000),num('b1','Bracket 1 up to',11000),num('r1','Rate 1 (%)',10),num('b2','Bracket 2 up to',44725),num('r2','Rate 2 (%)',12),num('r3','Rate above (%)',22)],
 i=>{let t=0;t+=Math.min(i.s,i.b1)*i.r1/100;if(i.s>i.b1)t+=(Math.min(i.s,i.b2)-i.b1)*i.r2/100;if(i.s>i.b2)t+=(i.s-i.b2)*i.r3/100;return[['Estimated tax',C(t),1],['Effective rate',P(t/i.s*100)],['After tax',C(i.s-t)]];});
add('Financial','Sales Tax Calculator','Add or remove sales tax.',
 [num('a','Amount',129.99),num('r','Tax rate (%)',8.25)],
 i=>[['Tax',C(i.a*i.r/100),1],['Total',C(i.a*(1+i.r/100))],['Pre-tax if amount includes tax',C(i.a/(1+i.r/100))]]);
add('Financial','VAT Calculator','Value added tax both directions.',
 [num('a','Amount',250),num('r','VAT rate (%)',20)],
 i=>[['VAT',C(i.a*i.r/100),1],['Gross',C(i.a*(1+i.r/100))],['Net from gross',C(i.a/(1+i.r/100))]]);
add('Financial','Tip Calculator','Tip and split per person.',
 [num('b','Bill',86.4),num('t','Tip (%)',18),num('n','People',3)],
 i=>[['Tip',C(i.b*i.t/100),1],['Total',C(i.b*(1+i.t/100))],['Per person',C(i.b*(1+i.t/100)/i.n)]]);
add('Financial','Discount Calculator','Sale price and savings.',
 [num('p','Original price',249),num('d','Discount (%)',35),num('d2','Extra discount (%)',0)],
 i=>{const f=i.p*(1-i.d/100)*(1-i.d2/100);return[['Final price',C(f),1],['You save',C(i.p-f)],['Total discount',P((1-f/i.p)*100)]];});
add('Financial','Margin Calculator','Profit margin and markup.',
 [num('c','Cost',40),num('p','Selling price',65)],
 i=>[['Gross margin',P((i.p-i.c)/i.p*100),1],['Markup',P((i.p-i.c)/i.c*100)],['Profit',C(i.p-i.c)]]);
add('Financial','Markup Calculator','Price from cost and markup.',
 [num('c','Cost',40),num('m','Markup (%)',60)],
 i=>[['Selling price',C(i.c*(1+i.m/100)),1],['Profit',C(i.c*i.m/100)],['Margin',P(i.m/(100+i.m)*100)]]);
add('Financial','Commission Calculator','Sales commission earned.',
 [num('s','Sale amount',45000),num('r','Commission (%)',3.5),num('sp','Split with (%)',0)],
 i=>{const g=i.s*i.r/100;return[['Your commission',C(g*(1-i.sp/100)),1],['Gross commission',C(g)]];});
add('Financial','Currency Margin Calculator','Convert with an exchange rate and fee.',
 [num('a','Amount',1000),num('r','Exchange rate',83.2),num('f','Fee (%)',1.5)],
 i=>[['Converted',F(i.a*i.r*(1-i.f/100)),1],['Fee cost',F(i.a*i.r*i.f/100)],['Mid-market value',F(i.a*i.r)]]);
add('Financial','CD Calculator','Certificate of deposit maturity value.',
 [num('p','Deposit',10000),num('r','APY (%)',4.75),num('y','Years',3)],
 i=>[['Maturity value',C(i.p*Math.pow(1+i.r/100,i.y)),1],['Interest earned',C(i.p*Math.pow(1+i.r/100,i.y)-i.p)]]);
add('Financial','Bond Yield Calculator','Current yield and simple YTM.',
 [num('f','Face value',1000),num('c','Coupon rate (%)',5),num('p','Price',940),num('y','Years to maturity',8)],
 i=>{const cpn=i.f*i.c/100;return[['Current yield',P(cpn/i.p*100),1],['Approx YTM',P((cpn+(i.f-i.p)/i.y)/((i.f+i.p)/2)*100)],['Annual coupon',C(cpn)]];});
add('Financial','Stock Profit Calculator','Trade P&L after commissions.',
 [num('b','Buy price',120),num('s','Sell price',158),num('q','Shares',50),num('f','Total fees',10)],
 i=>{const p=(i.s-i.b)*i.q-i.f;return[['Net profit',C(p),1],['Return',P(p/(i.b*i.q)*100)],['Proceeds',C(i.s*i.q-i.f)]];});
add('Financial','Dividend Yield Calculator','Yield and annual income.',
 [num('d','Annual dividend per share',3.2),num('p','Share price',78),num('q','Shares',200)],
 i=>[['Dividend yield',P(i.d/i.p*100),1],['Annual income',C(i.d*i.q)],['Monthly income',C(i.d*i.q/12)]]);
add('Financial','Depreciation Calculator','Straight-line depreciation.',
 [num('c','Asset cost',50000),num('s','Salvage value',5000),num('y','Useful life (years)',8)],
 i=>[['Annual depreciation',C((i.c-i.s)/i.y),1],['Monthly',C((i.c-i.s)/i.y/12)],['Total depreciable',C(i.c-i.s)]]);
add('Financial','Net Worth Calculator','Assets minus liabilities.',
 [num('a','Total assets',420000),num('l','Total liabilities',185000)],
 i=>[['Net worth',C(i.a-i.l),1],['Debt ratio',P(i.l/i.a*100)]]);
add('Financial','Budget Calculator','50/30/20 split of income.',
 [num('s','Monthly income after tax',5200)],
 i=>[['Needs (50%)',C(i.s*.5),1],['Wants (30%)',C(i.s*.3)],['Savings (20%)',C(i.s*.2)]]);
add('Financial','Emergency Fund Calculator','Target cushion and time to build it.',
 [num('e','Monthly expenses',3200),num('m','Months of cover',6),num('s','Monthly saving',500),num('h','Already saved',2000)],
 i=>{const t=i.e*i.m;return[['Target fund',C(t),1],['Still needed',C(Math.max(0,t-i.h))],['Months to reach',F(Math.max(0,t-i.h)/i.s)]];});
add('Financial','Student Loan Calculator','Repayment on education debt.',
 [num('p','Loan balance',35000),num('r','Rate (%)',5.5),num('y','Term (years)',10)],
 i=>{const n=i.y*12,m=pmt(i.p,i.r/1200,n);return[['Monthly payment',C(m),1],['Total interest',C(m*n-i.p)],['Total paid',C(m*n)]];});
add('Financial','College Savings Calculator','Saving for future tuition.',
 [num('cost','Annual cost today',28000),num('y','Years until college',12),num('inf','Cost inflation (%)',5),num('r','Return (%)',6)],
 i=>{const need=i.cost*Math.pow(1+i.inf/100,i.y)*4,r=i.r/1200,n=i.y*12;return[['Total needed',C(need),1],['Monthly saving required',C(need*r/(Math.pow(1+r,n)-1))]];});
add('Financial','Payroll Overtime Calculator','Weekly pay with overtime.',
 [num('h','Hours worked',48),num('r','Hourly rate',24),num('ot','Overtime multiplier',1.5)],
 i=>{const reg=Math.min(i.h,40),o=Math.max(0,i.h-40);return[['Weekly gross',C(reg*i.r+o*i.r*i.ot),1],['Regular pay',C(reg*i.r)],['Overtime pay',C(o*i.r*i.ot)]];});

 [num('r','Hourly rate',28),num('h','Hours/week',40),num('w','Weeks/year',50)],

<script>
/* ============================================================
   THEME FETCHING — exact LearnEra Light / Colorful / Deep logic
   ============================================================ */
(function initThemeFetching(){
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
  function readMode(){ try { return localStorage.getItem('appThemeMode') || 'system'; } catch(e){ return 'system'; } }
  function readStyle(){ try { return localStorage.getItem('darkTextStyle') || 'colorful'; } catch(e){ return 'colorful'; } }

  function applyTheme(){
    const mode = readMode();
    const style = readStyle();
    let isDark = false;
    if (mode === 'dark') isDark = true;
    else if (mode === 'light') isDark = false;
    else isDark = prefersDark.matches;

    const root = document.documentElement, body = document.body;
    if (isDark) {
      root.setAttribute('data-theme','dark');
      root.setAttribute('data-dark-text', style);
      body.setAttribute('data-theme','dark');
      body.setAttribute('data-dark-text', style);
    } else {
      root.setAttribute('data-theme','default');
      root.removeAttribute('data-dark-text');
      body.setAttribute('data-theme','default');
      body.removeAttribute('data-dark-text');
    }
    try {
      const topSp = localStorage.getItem('appTopSpace');
      if (topSp) root.style.setProperty('--top-space', topSp + 'vh');
    } catch(e){}
  }

  applyTheme();
  // Follow the device when LearnEra is on "system".
  prefersDark.addEventListener('change', () => { if (readMode() === 'system') applyTheme(); });
  // Follow LearnEra settings changed in another tab / the parent app.
  window.addEventListener('storage', (e) => {
    if (!e.key || e.key === 'appThemeMode' || e.key === 'darkTextStyle' || e.key === 'appTopSpace') applyTheme();
  });
  // Re-sync whenever this screen becomes visible again (returning from Settings).
  document.addEventListener('visibilitychange', () => { if (!document.hidden) applyTheme(); });
  window.addEventListener('focus', applyTheme);
  window.applyLearnEraTheme = applyTheme;
})();

/* ============================================================
   SFX — touch sounds fetched from LearnEra.
   Respects the LearnEra master switch (touchSoundsEnabled) and
   the per-group switches (touchSoundsGroupState). If the user
   has sounds OFF, nothing plays.
   ============================================================ */
(function initTouchSounds(){
  const LS_MASTER = 'touchSoundsEnabled';
  const LS_GROUPS = 'touchSoundsGroupState';

  /* Same 14 LearnEra click slots. Replace a filename with a real
     URL and it plays that file instead of the synth fallback. */
  const CLICK_SOUND_URLS = [
    "Click1.ogg","Click2.ogg","Click3.ogg","Click4.ogg","Click5.ogg","Click6.ogg","Click7.ogg",
    "Click8.ogg","Click9.ogg","Click10.ogg","Click11.ogg","Click12.ogg","Click13.ogg","Click14.ogg"
  ];
  const GROUP_TO_CLICKS = {
    'buttons'   : [1, 2, 3, 7, 8, 9, 14],
    'navigation': [5],
    'inputs'    : [4, 6],
    'reserved'  : [10, 11, 12, 13]
  };
  const CLICK_TO_GROUP = {};
  Object.keys(GROUP_TO_CLICKS).forEach(g => GROUP_TO_CLICKS[g].forEach(n => { CLICK_TO_GROUP[n] = g; }));

  function masterOn(){ try { return localStorage.getItem(LS_MASTER) === '1'; } catch(e){ return false; } }
  function groupEnabled(id){
    try { const s = JSON.parse(localStorage.getItem(LS_GROUPS) || '{}'); return s[id] === true; }
    catch(e){ return false; }
  }

  const audioCache = {};
  let _ac = null, _navBuffer = null;
  function getAC(){
    if (_ac) return _ac;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        _ac = new Ctx();
        const comp = _ac.createDynamicsCompressor();
        comp.threshold.value = -10; comp.knee.value = 6; comp.ratio.value = 12;
        comp.attack.value = 0.001; comp.release.value = 0.05;
        const g = _ac.createGain(); g.gain.value = 1.0;
        comp.connect(g).connect(_ac.destination);
        _ac._busIn = comp;
      }
    } catch(e){}
    return _ac;
  }
  function ensureNavBuffer(){
    const ac = getAC(); if (!ac || _navBuffer) return _navBuffer;
    const sr = ac.sampleRate, dur = 0.09, len = Math.floor(sr * dur);
    const buf = ac.createBuffer(1, len, sr), data = buf.getChannelData(0);
    const f0 = 520, f1 = 300;
    for (let i = 0; i < len; i++) {
      const t = i / sr, k = i / len, f = f0 + (f1 - f0) * k;
      const env = Math.min(1, i / (sr * 0.004)) * Math.pow(1 - k, 2.2);
      data[i] = Math.sin(2 * Math.PI * f * t) * env * 0.95;
    }
    _navBuffer = buf; return buf;
  }
  function primeAudio(){
    if (!masterOn()) return;
    const ac = getAC();
    if (ac && ac.state === 'suspended') ac.resume().catch(()=>{});
    ensureNavBuffer();
  }
  ['pointerdown','touchstart','keydown','click'].forEach(ev => {
    document.addEventListener(ev, primeAudio, { capture: true, passive: true });
  });

  function isRealUrl(u){
    if (!u || typeof u !== 'string') return false;
    return /^(https?:|data:|blob:|\/|\.\/|\.\.\/)/i.test(u) || /\//.test(u);
  }

  const SYNTH = {
    1:{f:880,d:.05,w:'triangle',g:.18}, 2:{f:520,d:.07,w:'sine',g:.22}, 3:{f:660,d:.08,w:'square',g:.16},
    4:{f:1200,d:.03,w:'sine',g:.12}, 5:{f:740,d:.05,w:'triangle',g:.18}, 6:{f:1000,d:.025,w:'sine',g:.10},
    7:{f:600,d:.05,w:'square',g:.16}, 8:{f:820,d:.05,w:'triangle',g:.18}, 9:{f:420,d:.06,w:'sine',g:.18},
    10:{f:480,d:.05,w:'triangle',g:.16}, 11:{f:560,d:.05,w:'triangle',g:.16},
    12:{f:640,d:.05,w:'triangle',g:.16}, 13:{f:720,d:.05,w:'triangle',g:.16}, 14:{f:440,d:.08,w:'sine',g:.60}
  };
  function synthClick(n){
    const ac = getAC(); if (!ac) return;
    if (ac.state === 'suspended') ac.resume().catch(()=>{});
    const r = SYNTH[n] || SYNTH[7], t0 = ac.currentTime;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = r.w;
    osc.frequency.setValueAtTime(r.f, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(80, r.f * 0.6), t0 + r.d);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(r.g, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + r.d);
    osc.connect(gain).connect(ac._busIn || ac.destination);
    osc.start(t0); osc.stop(t0 + r.d + 0.02);
  }
  function playNavClick(){
    const ac = getAC(); if (!ac) { synthClick(14); return; }
    if (ac.state === 'suspended') ac.resume().catch(()=>{});
    const buf = ensureNavBuffer(); if (!buf) { synthClick(14); return; }
    const src = ac.createBufferSource(); src.buffer = buf;
    const g = ac.createGain(); g.gain.value = 2.0;
    src.connect(g).connect(ac._busIn || ac.destination);
    src.start();
  }

  function playClick(n, opts){
    opts = opts || {};
    if (!opts.force) {
      if (!masterOn()) return;                       // LearnEra sound option OFF
      const groupId = CLICK_TO_GROUP[n];
      if (!groupId || !groupEnabled(groupId)) return; // category OFF
    }
    const url = CLICK_SOUND_URLS[n - 1];
    if (isRealUrl(url)) {
      try {
        if (n === 14) { const a = new Audio(url); a.volume = 1.0; a.play().catch(() => playNavClick()); return; }
        if (!audioCache[n]) { const a = new Audio(url); a.volume = 0.5; a.preload = 'auto'; audioCache[n] = a; }
        const a = audioCache[n]; a.currentTime = 0;
        const p = a.play(); if (p && p.catch) p.catch(() => synthClick(n));
        return;
      } catch(e){}
    }
    if (n === 14) playNavClick(); else synthClick(n);
  }
  window.playTouchSound = playClick;

  /* Global wiring for this screen. */
  document.addEventListener('click', (e) => {
    if (e.target.closest('.section-switch button')) { playClick(14); return; }
    if (e.target.closest('.category-pill, .card, .utility-card')) { playClick(5); return; }
    if (e.target.closest('.filter-toggle-btn, .btn, .iconbtn, .keys button, .sci-modes button')) playClick(1);
  }, true);
  document.addEventListener('focusin', (e) => {
    const el = e.target; if (!el) return;
    const tag = (el.tagName || '').toLowerCase();
    if (tag === 'textarea') { playClick(4); return; }
    if (tag === 'input') {
      const type = (el.type || 'text').toLowerCase();
      if (['text','search','email','password','number','tel','url'].indexOf(type) !== -1) playClick(4);
    }
  }, true);
})();
const triggerSound = (n) => { if (window.playTouchSound) window.playTouchSound(n); };
</script>

<script>
/* ---------------- ENGINE ---------------- */
const grid=document.getElementById('grid'),chips=document.getElementById('chips'),modal=document.getElementById('modal'),
      sheet=document.getElementById('sheet'),q=document.getElementById('q'),countEl=document.getElementById('count'),
      headerCard=document.getElementById('headerCard'),searchRow=document.getElementById('searchRow'),
      filterBtn=document.getElementById('filterBtn'),sectionSwitch=document.getElementById('sectionSwitch'),
      toolsSection=document.getElementById('toolsSection'),utilitiesSection=document.getElementById('utilitiesSection'),
      utilGrid=document.getElementById('utilGrid'),utilCount=document.getElementById('utilCount');

CALCS.unshift({c:'Math',n:'Scientific Calculator',d:'Full neumorphic keypad with trig, logs, powers, memory and DEG/RAD.',f:[],fn:null,special:'sci'});

/* ============================================================
   UTILITIES — add entries here. Each item supports a parallax
   image: { n: name, d: description, img: url, open: fn }
   ============================================================ */
const UTILITIES = [];

const cats=['All',...new Set(CALCS.map(c=>c.c))];
let active='All';
let currentSection='tools';
let filterCollapsed=true;
let loading=true;

/* ---- Filter pills (News.html logic) ---- */
function buildChips(){
  chips.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('div');
    b.className='category-pill'+(c===active?' active':'');
    b.innerHTML='<span></span>';
    b.querySelector('span').textContent=(c==='All'?'All ('+CALCS.length+')':c);
    b.onclick=()=>{
      if(currentSection!=='tools')return;
      active=c;q.value='';
      [...chips.children].forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      startSkeleton(600);
    };
    chips.appendChild(b);
  });
}

filterBtn.onclick=()=>{
  if(currentSection!=='tools')return;
  filterCollapsed=!filterCollapsed;
  chips.classList.toggle('collapsed',filterCollapsed);
  filterBtn.classList.toggle('active',!filterCollapsed);
};
q.addEventListener('focus',()=>{
  if(currentSection!=='tools')return;
  searchRow.classList.add('search-active');
  filterCollapsed=true;chips.classList.add('collapsed');filterBtn.classList.remove('active');
});
q.addEventListener('blur',()=>{setTimeout(()=>searchRow.classList.remove('search-active'),150)});

/* ---- Header hide on scroll down (News.html float behaviour) ---- */
let lastY=0;
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  headerCard.classList.toggle('hidden', y>140 && y>lastY);
  lastY=y;
  parallaxTick();
},{passive:true});

/* ---- Skeleton loading ---- */
function skeletons(n,host,h){
  host.innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='skeleton-loading';
    if(h)d.style.height=h;
    host.appendChild(d);
  }
}
function startSkeleton(delay){
  loading=true;
  skeletons(12,grid);
  countEl.textContent='Loading…';
  clearTimeout(window.__loadT);
  window.__loadT=setTimeout(()=>{loading=false;render();},delay||1200);
}

/* ---- Reveal animation ---- */
let io=null;
function observeCards(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting)e.target.classList.add('in-view');
  }),{threshold:.08});
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
}

function render(){
  if(loading)return;
  const term=q.value.trim().toLowerCase();
  const list=CALCS.filter(c=>(active==='All'||c.c===active)&&(!term||(c.n+' '+c.d+' '+c.c).toLowerCase().includes(term)));
  grid.innerHTML='';
  list.forEach(c=>{
    const b=document.createElement('button');b.className='card';
    b.innerHTML='<div class="cat"></div><h3></h3><p></p>';
    b.querySelector('.cat').textContent=c.c;
    b.querySelector('h3').textContent=c.n;
    b.querySelector('p').textContent=c.d;
    b.onclick=()=>openCalc(c);
    grid.appendChild(b);
  });
  if(!list.length){
    const e=document.createElement('div');e.className='empty-state';
    e.textContent='No tools found matching your search.';
    grid.appendChild(e);
  }
  countEl.textContent=list.length+' calculator'+(list.length===1?'':'s')+' shown · '+CALCS.length+' total';
  observeCards();
  requestAnimationFrame(()=>document.querySelectorAll('.card').forEach((c,i)=>{
    setTimeout(()=>c.classList.add('in-view'),Math.min(i*18,400));
  }));
}

q.oninput=()=>{ if(currentSection!=='tools')return; active='All';
  [...chips.children].forEach((x,i)=>x.classList.toggle('active',i===0));
  startSkeleton(700);
};

/* ============================================================
   UTILITIES SECTION + PARALLAX
   ============================================================ */
function renderUtilities(){
  utilGrid.innerHTML='';
  if(!UTILITIES.length){
    const e=document.createElement('div');e.className='empty-state';
    e.style.gridColumn='1/-1';
    e.textContent='Utilities are coming soon.';
    utilGrid.appendChild(e);
    utilCount.textContent='0 utilities';
    return;
  }
  UTILITIES.forEach(u=>{
    const b=document.createElement('button');b.className='utility-card';
    b.innerHTML='<div class="utility-media"><img alt="" loading="lazy"/></div>'+
                '<div class="utility-body"><h3></h3><p></p></div>';
    const img=b.querySelector('img');
    img.src=u.img||'';img.alt=u.n||'';
    b.querySelector('h3').textContent=u.n||'';
    b.querySelector('p').textContent=u.d||'';
    if(typeof u.open==='function')b.onclick=u.open;
    utilGrid.appendChild(b);
  });
  utilCount.textContent=UTILITIES.length+' utilit'+(UTILITIES.length===1?'y':'ies');
  parallaxTick();
}

/* Each utility card image drifts against the scroll = parallax. */
function parallaxTick(){
  if(currentSection!=='utilities')return;
  const vh=window.innerHeight;
  document.querySelectorAll('.utility-media').forEach(m=>{
    const r=m.getBoundingClientRect();
    if(r.bottom<-200||r.top>vh+200)return;
    const progress=(r.top+r.height/2-vh/2)/vh;   // -1 .. 1
    const img=m.querySelector('img');
    if(img)img.style.transform='translate3d(0,'+(progress*26).toFixed(2)+'px,0) scale(1.06)';
  });
}
window.addEventListener('resize',parallaxTick,{passive:true});

/* ============================================================
   SECTION SWITCHING — Utilities disables search + filters (13)
   ============================================================ */
function setSection(name){
  currentSection=name;
  [...sectionSwitch.children].forEach(b=>b.classList.toggle('active',b.dataset.section===name));
  const utilities = name==='utilities';
  toolsSection.style.display = utilities?'none':'';
  utilitiesSection.style.display = utilities?'':'none';

  // Disable / re-enable the search bar and filter buttons.
  searchRow.classList.toggle('controls-disabled', utilities);
  headerCard.classList.toggle('controls-off', utilities);
  q.disabled = utilities;
  filterBtn.disabled = utilities;
  if(utilities){
    q.blur();
    filterCollapsed=true;
    chips.classList.add('collapsed');
    filterBtn.classList.remove('active');
    skeletons(6,utilGrid,'220px');
    setTimeout(()=>{renderUtilities();},900);
  }else{
    startSkeleton(700);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
sectionSwitch.addEventListener('click',e=>{
  const b=e.target.closest('button[data-section]');
  if(b)setSection(b.dataset.section);
});

/* ============================================================
   CALCULATOR MODAL
   ============================================================ */
function openCalc(c){
  if(c.special==='sci')return openSci();
  sheet.innerHTML='';
  const bar=document.createElement('div');
  bar.innerHTML='<button class="iconbtn closex" id="cx">✕</button><div class="cat" style="font:800 .62em Poppins;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2)"></div>';
  bar.querySelector('.cat').textContent=c.c;
  sheet.appendChild(bar);
  const h=document.createElement('h2');h.textContent=c.n;sheet.appendChild(h);
  const p=document.createElement('p');p.className='sub';p.textContent=c.d;sheet.appendChild(p);
  const form=document.createElement('div');sheet.appendChild(form);
  c.f.forEach(f=>{
    const d=document.createElement('div');d.className='field';
    const l=document.createElement('label');l.textContent=f.l;d.appendChild(l);
    let el;
    if(f.o){el=document.createElement('select');f.o.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;el.appendChild(o)});}
    else{el=document.createElement('input');el.type=f.date?'date':f.text?'text':'number';el.step=f.step||'any';}
    el.value=f.v;el.dataset.k=f.k;el.dataset.t=(f.text||f.date||f.o)?'s':'n';
    el.addEventListener('input',calc);el.addEventListener('change',calc);
    d.appendChild(el);form.appendChild(d);
  });
  const res=document.createElement('div');res.className='result';sheet.appendChild(res);
  const btns=document.createElement('div');btns.className='btns';
  btns.innerHTML='<button class="btn" id="go">Calculate</button><button class="btn ghost" id="cl">Close</button>';
  sheet.appendChild(btns);
  function calc(){
    const i={};form.querySelectorAll('input,select').forEach(e=>{i[e.dataset.k]=e.dataset.t==='n'?parseFloat(e.value):e.value;});
    let rows;try{rows=c.fn(i)}catch(e){rows=[['Error','Check your inputs',1]]}
    res.innerHTML=rows.map(r=>'<div class="rrow'+(r[2]?' hero':'')+'"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');
  }
  calc();
  sheet.querySelector('#go').onclick=calc;
  sheet.querySelector('#cl').onclick=close_;
  bar.querySelector('#cx').onclick=close_;
  modal.classList.add('on');document.body.style.overflow='hidden';window.scrollTo(0,0);
}
function close_(){modal.classList.remove('on');document.body.style.overflow='';}
modal.onclick=e=>{if(e.target===modal)close_()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close_()});

/* ============================================================
   NEUMORPHIC SCIENTIFIC CALCULATOR
   (soft squircle keys + deep inset display, jh3y QWYPaax feel)
   ============================================================ */
function openSci(){
  sheet.innerHTML=
    '<button class="iconbtn closex" id="cx">✕</button>'+
    '<h2>Scientific Calculator</h2>'+
    '<p class="sub">Type or tap. Trig, logs, roots, powers, factorial, memory and DEG/RAD.</p>'+
    '<div class="sci-shell">'+
      '<div class="sci-disp"><div class="expr" id="expr">&nbsp;</div><div class="out" id="out">0</div></div>'+
      '<div class="sci-modes">'+
        '<button id="mDeg" class="on">DEG</button><button id="mRad">RAD</button>'+
        '<button id="mInv">INV</button><button id="mMR">MR</button>'+
        '<button id="mMPlus">M+</button><button id="mMC">MC</button>'+
      '</div>'+
      '<div class="keys" id="keys"></div>'+
    '</div>';

  const expr=sheet.querySelector('#expr'),out=sheet.querySelector('#out'),keys=sheet.querySelector('#keys');
  let s='',deg=true,inv=false,mem=0;

  const K=[
    ['sin','fn'],['cos','fn'],['tan','fn'],['(', 'op'],[')','op'],
    ['ln','fn'],['log','fn'],['√','fn'],['x²','fn'],['^','op'],
    ['7'],['8'],['9'],['÷','op'],['C','op'],
    ['4'],['5'],['6'],['×','op'],['⌫','op'],
    ['1'],['2'],['3'],['−','op'],['n!','fn'],
    ['0'],['.'],['π','fn'],['+','op'],['=','eq']
  ];
  K.forEach(([t,cl])=>{
    const b=document.createElement('button');
    b.textContent=t;
    if(cl)b.className=cl;
    b.onclick=()=>{press(t);b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),120);};
    keys.appendChild(b);
  });

  const mDeg=sheet.querySelector('#mDeg'),mRad=sheet.querySelector('#mRad'),mInv=sheet.querySelector('#mInv');
  mDeg.onclick=()=>{deg=true;mDeg.classList.add('on');mRad.classList.remove('on');};
  mRad.onclick=()=>{deg=false;mRad.classList.add('on');mDeg.classList.remove('on');};
  mInv.onclick=()=>{inv=!inv;mInv.classList.toggle('on',inv);};
  sheet.querySelector('#mMR').onclick=()=>{s+=String(mem);paint();};
  sheet.querySelector('#mMPlus').onclick=()=>{const v=safeEval(s);if(isFinite(v))mem+=v;};
  sheet.querySelector('#mMC').onclick=()=>{mem=0;};

  function press(t){
    if(t==='C'){s='';}
    else if(t==='⌫'){s=s.slice(0,-1);}
    else if(t==='='){const v=safeEval(s);expr.textContent=s||' ';s=isFinite(v)?String(v):'';out.textContent=isFinite(v)?String(v):'Error';return;}
    else if(t==='x²'){s+='^2';}
    else if(t==='n!'){s+='!';}
    else if(['sin','cos','tan','ln','log','√'].includes(t)){
      s+= (inv && ['sin','cos','tan'].includes(t) ? 'a'+t : t) + '(';
    }
    else s+=t;
    paint();
  }
  function paint(){
    out.textContent=s||'0';
    const v=safeEval(s);
    expr.textContent=(s && isFinite(v) && String(v)!==s)?('= '+v):'\u00a0';
  }
  function fact(n){ if(n<0||n!==Math.floor(n)||n>170)return NaN; let r=1; for(let i=2;i<=n;i++)r*=i; return r; }
  function safeEval(src){
    if(!src)return NaN;
    try{
      let js=src
        .replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')
        .replace(/π/g,'Math.PI')
        .replace(/(\d+(?:\.\d+)?)!/g,'__f($1)')
        .replace(/asin\(/g,'__as(').replace(/acos\(/g,'__ac(').replace(/atan\(/g,'__at(')
        .replace(/sin\(/g,'__s(').replace(/cos\(/g,'__c(').replace(/tan\(/g,'__t(')
        .replace(/√\(/g,'Math.sqrt(').replace(/ln\(/g,'Math.log(').replace(/log\(/g,'Math.log10(')
        .replace(/\^/g,'**');
      if(/[^0-9+\-*/().,\s^_A-Za-z]/.test(js))return NaN;
      const D=deg?Math.PI/180:1, R=deg?180/Math.PI:1;
      const fn=Function('__s','__c','__t','__as','__ac','__at','__f','"use strict";return ('+js+')');
      const v=fn(
        x=>Math.sin(x*D), x=>Math.cos(x*D), x=>Math.tan(x*D),
        x=>Math.asin(x)*R, x=>Math.acos(x)*R, x=>Math.atan(x)*R, fact
      );
      if(typeof v!=='number'||!isFinite(v))return NaN;
      return Math.round(v*1e10)/1e10;
    }catch(e){return NaN;}
  }

  document.addEventListener('keydown',keyHandler);
  function keyHandler(e){
    if(!modal.classList.contains('on'))return;
    const k=e.key;
    if(/^[0-9.]$/.test(k))press(k);
    else if(k==='+')press('+');
    else if(k==='-')press('−');
    else if(k==='*')press('×');
    else if(k==='/')press('÷');
    else if(k==='(' || k===')')press(k);
    else if(k==='^')press('^');
    else if(k==='Enter'||k==='=')press('=');
    else if(k==='Backspace')press('⌫');
  }

  sheet.querySelector('#cx').onclick=()=>{document.removeEventListener('keydown',keyHandler);close_();};
  modal.classList.add('on');document.body.style.overflow='hidden';window.scrollTo(0,0);
}

/* ============================================================
   BOOT — skeleton loading effect at start
   ============================================================ */
(function boot(){
  chips.innerHTML='';
  for(let i=0;i<6;i++){const d=document.createElement('div');d.className='skeleton-loading skeleton-pill';chips.appendChild(d);}
  skeletons(12,grid);
  countEl.textContent='Loading…';
  setTimeout(()=>{
    buildChips();
    loading=false;
    render();
  },1400);
})();
</script>
</body></html>
