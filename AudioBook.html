<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnEra - Audiobooks</title>
    
    <!-- External Font Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- React & Babel CDN Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <!-- Early theme bootstrap -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('appThemeMode') || 'system';
                const isDark = savedTheme === 'dark' ||
                    (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.setAttribute('data-dark-text', darkStyle);
                } else {
                    document.documentElement.removeAttribute('data-dark-text');
                }
                const topSp = localStorage.getItem('appTopSpace') || '5';
                document.documentElement.style.setProperty('--top-space', topSp + 'vh');
            } catch (e) {
                document.documentElement.style.setProperty('--top-space', '5vh');
            }
            const savedLang = localStorage.getItem('appLanguageSelection') || 'en';
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>

    <style>
        /* CSS Reset Elements */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* Color Tokens & Global Variables */
        :root {
            --body-bg: #e6edf7; 
            --neu-shadow-light: #ffffff;
            --neu-shadow-dark: #c8d3e4;
            
            --text-color: #2d3748; 
            --sub-text-color: #718096; 
            --blue: #1E90FF;
            --select-active-color: #1E90FF;
            --divider-color: rgba(138, 43, 226, 0.15);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), -2px -2px 5px var(--neu-shadow-light);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
            
            --top-space: 5vh;
            --transition-theme: background-color 0.8s ease, color 0.8s ease, box-shadow 0.8s ease, border-color 0.8s ease;

            /* LearnEra Header Gradient Outline Tokens */
            --header-gradient: linear-gradient(135deg, #8A2BE2, #a158e6, #DA70D6);
        }

        /* Standard Dark Mode Modifiers */
        html[data-theme="dark"] {
            --body-bg: #1e1e24; 
            --neu-shadow-dark: #101014;
            --neu-shadow-light: rgba(255, 255, 255, 0.05);
            
            --text-color: #d1d9e6; 
            --sub-text-color: #a3b1c6; 
            --divider-color: rgba(255, 255, 255, 0.08);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.02);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.02);
            --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.02);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 5px rgba(255, 255, 255, 0.03);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
        }

        /* Deep-Dark Mode Specific Styles (Monochromatic grey theme) */
        html[data-dark-text="deep-dark"] {
            --body-bg: #0c0c0f; 
            --neu-shadow-dark: #050506;
            --divider-color: rgba(255, 255, 255, 0.04);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.01);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.01);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.01);
            --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.01);
            
            --blue: #8e8e93;
            --select-active-color: #8e8e93;
            --text-color: #8e8e93;
            --sub-text-color: #636366;
            --header-gradient: linear-gradient(135deg, #8e8e93, #636366);
        }

        html[data-dark-text="deep-dark"] *,
        html[data-dark-text="deep-dark"] i,
        html[data-dark-text="deep-dark"] h1,
        html[data-dark-text="deep-dark"] h2,
        html[data-dark-text="deep-dark"] h3,
        html[data-dark-text="deep-dark"] h4,
        html[data-dark-text="deep-dark"] p,
        html[data-dark-text="deep-dark"] span,
        html[data-dark-text="deep-dark"] li,
        html[data-dark-text="deep-dark"] button,
        html[data-dark-text="deep-dark"] input,
        html[data-dark-text="deep-dark"] textarea,
        html[data-dark-text="deep-dark"] div {
            color: #8e8e93 !important;
        }

        html[data-dark-text="deep-dark"] img,
        html[data-dark-text="deep-dark"] .audiobook-card-cover,
        html[data-dark-text="deep-dark"] .player-cover-image {
            filter: grayscale(100%) brightness(0.75) opacity(0.8) !important;
        }

        html[data-dark-text="deep-dark"] svg,
        html[data-dark-text="deep-dark"] svg * {
            stroke: #8e8e93 !important;
            fill: #8e8e93 !important;
        }

        /* Natural Scrolling Heights */
        html, body {
            width: 100%;
            min-height: 100%; 
            background-color: var(--body-bg);
            color: var(--text-color);
            overscroll-behavior: none;
            font-family: 'Poppins', sans-serif !important;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            font-size: 13px; 
            transition: var(--transition-theme);
            padding-top: var(--top-space);
        }

        /* Layout Framework Container */
        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px 15px 15px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: flex-start;
            height: auto;
            min-height: 100%;
        }

        /* Main Container Card: Gradient Outline Style */
        .app-card {
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            border-radius: 20px;
            padding: 20px;
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            display: flex;
            flex-direction: column;
            transition: var(--transition-theme);
            height: auto;
            width: 100%; 
            z-index: 1;
        }

        /* Sticky Float Header Card (search & category buttons container): Gradient Outline Style */
        .floating-controls-panel {
            position: sticky;
            top: 15px; 
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            padding: 16px;
            border-radius: 20px;
            box-shadow: none !important; 
            border: 1.5px solid transparent !important; 
            z-index: 1000 !important;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%; 
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, visibility 0.4s ease;
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .floating-controls-panel.hidden {
            transform: translateY(-130%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        html[data-dark-text="deep-dark"] .app-card,
        html[data-dark-text="deep-dark"] .floating-controls-panel {
            border: 1.5px solid rgba(180, 180, 180, 0.22) !important;
            background: #0c0c0f !important;
        }

        @media (max-width: 768px) {
            .floating-controls-panel {
                margin-bottom: 12px !important;
            }
        }
        @media (min-width: 769px) {
            .floating-controls-panel {
                margin-bottom: 0px !important;
            }
        }

        /* Search Input Wrapper: Neumorphic Inset default, Gradient Outline when Active */
        .search-wrapper {
            position: relative;
            width: 100%;
            border-radius: 14px;
            transition: all 0.3s ease;
            background: var(--body-bg);
            border: 1.5px solid transparent;
        }

        .search-wrapper:focus-within {
            border: 1.5px solid transparent;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            box-shadow: none !important;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: none;
            border-radius: 12px;
            background: var(--body-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif !important;
            font-size: 0.95em;
            font-weight: 500;
            box-shadow: var(--card-shadow-inset);
            outline: none;
            transition: box-shadow 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-wrapper:focus-within .search-input {
            box-shadow: none;
            background: transparent;
        }

        /* Search Icon: Standard grey idle, Gradient Color when Search Bar Active */
        .search-wrapper-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--sub-text-color);
            font-size: 1.05em;
            pointer-events: none;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .search-wrapper:focus-within .search-wrapper-icon {
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        html[data-dark-text="deep-dark"] .search-wrapper:focus-within .search-wrapper-icon {
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: initial !important;
            color: #8e8e93 !important;
        }

        /* Skeleton loading mode on Search Wrapper */
        .search-wrapper.skeleton-loading {
            border-color: transparent !important;
            aspect-ratio: auto !important;
            height: 44px;
            border-radius: 14px;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
            overflow: hidden !important;
        }

        /* Categories Scroller */
        .categories-filter-wrapper {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            width: 100%;
            padding: 4px 2px 6px 2px;
        }

        /* Category pills: Grey outline style when inactive, Gradient Outline when ACTIVE */
        .category-pill {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            background: transparent !important;
            color: var(--sub-text-color);
            box-shadow: none !important;
            border: 1.5px solid rgba(150, 150, 150, 0.35) !important;
            transition: all 0.2s ease;
        }

        html[data-theme="dark"] .category-pill {
            border: 1.5px solid rgba(180, 180, 180, 0.30) !important;
        }

        .category-pill:active {
            transform: scale(0.95);
        }

        /* Category pill Active State: Gradient Outline */
        .category-pill.active {
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            color: #8A2BE2 !important;
            font-weight: 700;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border: 1.5px solid rgba(142, 142, 147, 0.25) !important;
            color: #8e8e93 !important;
        }

        html[data-dark-text="deep-dark"] .category-pill.active {
            border: 1.5px solid #8e8e93 !important;
            background: #0c0c0f !important;
            color: #8e8e93 !important;
        }

        /* Audiobooks grid layout */
        .audiobooks-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            overflow: visible;
        }

        /* Audiobook Card: Neumorphism Micro Shadow + ListScrollingEffect.html scroll animation */
        .audiobook-card {
            background: var(--body-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--card-shadow-micro);
            border: 1px solid rgba(255,255,255,0.25);
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.15s ease;
            will-change: transform, opacity;
        }

        .audiobook-card.in-view {
            opacity: 1;
            transform: scale(1);
        }

        html[data-theme="dark"] .audiobook-card {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .audiobook-card-cover {
            width: 100%;
            aspect-ratio: 1 / 1 !important; 
            object-fit: cover !important;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .audiobook-card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .audiobook-title {
            font-size: 0.9em;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audiobook-author {
            font-size: 0.72em;
            color: var(--sub-text-color);
            font-weight: 600;
        }

        /* ============================================================ */
        /* AUDIOBOOK INSPECTION SCREEN (EXACTLY UNCHANGED FROM ORIGINAL) */
        /* ============================================================ */
        .full-screen-arrangement { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            width: 100vw; 
            height: 100vh;
            height: 100dvh;
            display: none; 
            z-index: 2000; 
            overflow: hidden;
            background: var(--body-bg); 
            flex-direction: column !important;
            overscroll-behavior: contain;
        }

        .full-screen-arrangement.show {
            display: flex !important;
        }

        .back-btn-float-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2500;
        }

        .back-pill-button {
            position: relative; 
            background: var(--body-bg); 
            color: var(--text-color); 
            border: 2px solid var(--body-bg); 
            border-radius: 16px; 
            padding: 10px 14px; 
            cursor: pointer; 
            box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.7); 
            z-index: 70; 
            transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s ease; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            outline: none;
            font-weight: 700;
        }

        .back-pill-button:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 4px var(--neu-shadow-dark) !important;
        }

        .player-scroll-area {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 80px 18px 40px; 
        }

        .player-cover-wrapper {
            width: 280px !important;
            height: 280px !important;
            background: var(--body-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: 2px solid var(--body-bg);
            position: relative;
            flex-shrink: 0; 
        }

        .player-cover-image {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important; 
            display: block;
        }

        .audio-player-panel {
            width: 100%;
            max-width: 440px;
            background: var(--body-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--settings-shadow-inset-sharp);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .simple-progress-slider {
            -webkit-appearance: none;
            width: 100% !important; 
            height: 6px;
            background: rgba(30, 144, 255, 0.15);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        
        .simple-progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--body-bg);
            border: 2.5px solid var(--blue);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--card-shadow-micro);
            transition: transform 0.1s ease;
        }

        .simple-progress-slider::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        .player-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
        }

        .settings-group { 
            background: var(--body-bg); 
            border-radius: 20px; 
            padding: 20px 15px; 
            width: 100%; 
            max-width: 440px;
            box-shadow: var(--settings-shadow-inset-sharp); 
            border: 1px solid rgba(255,255,255,0.3); 
            transition: background-color 0.8s ease; 
        }

        body[data-theme="dark"] .settings-group {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-group-title { 
            color: var(--text-color); 
            font-size: 1.1em; 
            font-weight: 700; 
            margin-bottom: 15px; 
            padding-left: 5px; 
            opacity: 0.85;
            text-align: left;
        }
        
        .settings-item { 
            background: var(--body-bg); 
            border-radius: 15px; 
            padding: 14px 18px; 
            margin-bottom: 12px; 
            color: var(--text-color); 
            font-size: 0.95em; 
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s; 
            box-shadow: var(--card-shadow-micro); 
            border: 1px solid rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0.9;
        }

        body[data-theme="dark"] .settings-item {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-item:last-child { margin-bottom: 0; }

        .episode-title-text {
            font-weight: 700;
            font-size: 0.85em !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            max-width: 260px !important;
            display: inline-block;
        }

        .episode-duration-text {
            font-size: 0.78em !important;
            color: var(--sub-text-color);
            white-space: nowrap;
        }

        .episode-bubble-num {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--body-bg);
            box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: var(--text-color);
            flex-shrink: 0;
            margin-right: 18px !important;
        }

        body[data-theme="dark"] .episode-bubble-num {
            box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.05);
            text-shadow: none;
        }

        .active-play-icon {
            color: var(--blue) !important;
        }

        html[data-dark-text="deep-dark"] .active-play-icon {
            color: #ffffff !important;
        }

        .playing-chapter .episode-bubble-num {
            background: var(--blue) !important;
            color: #ffffff !important;
            box-shadow: var(--card-shadow-micro) !important;
            text-shadow: none !important;
        }
        html[data-dark-text="deep-dark"] .playing-chapter .episode-bubble-num {
            background: #ffffff !important;
            color: #000000 !important;
        }

        @keyframes progressSkeletonShine {
            0%   { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .simple-progress-slider.loading-bar {
            background-color: rgba(0, 0, 0, 0.08) !important;
            background-image: linear-gradient(
                120deg,
                transparent 35%,
                rgba(30, 144, 255, 0.55) 50%,
                transparent 65%
            ) !important;
            background-size: 200% 100% !important;
            background-repeat: no-repeat !important;
            animation: progressSkeletonShine 3.5s linear infinite !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
        }

        html[data-theme="dark"] .simple-progress-slider.loading-bar {
            background-color: rgba(255, 255, 255, 0.06) !important;
            background-image: linear-gradient(
                120deg,
                transparent 35%,
                rgba(30, 144, 255, 0.55) 50%,
                transparent 65%
            ) !important;
            background-size: 200% 100% !important;
            background-repeat: no-repeat !important;
        }

        html[data-dark-text="deep-dark"] .simple-progress-slider.loading-bar {
            background-color: rgba(255, 255, 255, 0.04) !important;
            background-image: linear-gradient(
                120deg,
                transparent 35%,
                rgba(142, 142, 147, 0.35) 50%,
                transparent 65%
            ) !important;
            background-size: 200% 100% !important;
            background-repeat: no-repeat !important;
        }

        .player-details-card {

            { id: "ab_16", category: "History", title: "The History of Herodotus", author: "Herodotus", narrator: "David Case", duration: "9h 50m", coverUrl: "https://images.unsplash.com/photo-1447069387593-a5de0862481e?q=80&w=400&auto=format&fit=crop", description: "Western literature on Greco-Persian conflicts.", chapters: [{ title: "Chapter 1: Persia Rising", duration: "24:35", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }] },
            { id: "ab_17", category: "Science", title: "A Brief History of Time", author: "Stephen Hawking", narrator: "Michael Jackson", duration: "5h 30m", coverUrl: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400&auto=format&fit=crop", description: "Cosmology and quantum mechanics overview.", chapters: [{ title: "Chapter 1: The Universe", duration: "15:45", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }] },
            { id: "ab_18", category: "Business", title: "The Intelligent Investor", author: "Benjamin Graham", narrator: "Luke Daniels", duration: "8h 40m", coverUrl: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=400&auto=format&fit=crop", description: "Philosophical models of value investing.", chapters: [{ title: "Chapter 1: Speculation Risks", duration: "20:50", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }] },
            { id: "ab_19", category: "Biography", title: "Twelve Years a Slave", author: "Solomon Northup", narrator: "Louis Gossett Jr.", duration: "4h 20m", coverUrl: "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=400&auto=format&fit=crop", description: "Narratives of Solomon Northup's life.", chapters: [{ title: "Chapter 1: Kidnapped", duration: "16:45", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" }] },
            { id: "ab_20", category: "Fiction", title: "The Odyssey", author: "Homer", narrator: "Ian McKellen", duration: "7h 10m", coverUrl: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=400&auto=format&fit=crop", description: "Ten-year strategic wanderings of Odysseus.", chapters: [{ title: "Chapter 1: Return to Ithaca", duration: "18:20", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" }] },
            { id: "ab_21", category: "Philosophy", title: "The Critique of Pure Reason", author: "Immanuel Kant", narrator: "John Castle", duration: "11 Hours", coverUrl: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=400&auto=format&fit=crop", description: "Kant's major philosophical work examining human understanding.", chapters: [{ title: "Chapter 1: Transcendental Aesthetic", duration: "25:40", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" }] },
            { id: "ab_22", category: "Fiction", title: "Metamorphoses", author: "Ovid", narrator: "David Horovitch", duration: "8 Hours", coverUrl: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=400&auto=format&fit=crop", description: "Classical mythological transformations poem.", chapters: [{ title: "Chapter 1: Creation of Cosmos", duration: "21:15", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" }] },
            { id: "ab_23", category: "Science", title: "Cosmos", author: "Carl Sagan", narrator: "LeVar Burton", duration: "6 Hours", coverUrl: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400&auto=format&fit=crop", description: "Explore the vast universe and space science breakthroughs.", chapters: [{ title: "Chapter 1: Cosmic Ocean", duration: "18:45", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" }] },
            { id: "ab_24", category: "Biography", title: "The Life of Charlotte Bronte", author: "Elizabeth Gaskell", narrator: "Juliet Stevenson", duration: "5 Hours", coverUrl: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=400&auto=format&fit=crop", description: "The definitive biography of Jane Eyre's famous author.", chapters: [{ title: "Chapter 1: Childhood in Yorkshire", duration: "19:10", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" }] },
            { id: "ab_25", category: "History", title: "The History of Rome", author: "Theodor Mommsen", narrator: "Michael York", duration: "12 Hours", coverUrl: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=400&auto=format&fit=crop", description: "A detailed account of Rome's growth into a global empire.", chapters: [{ title: "Chapter 1: Origin of Rome", duration: "26:30", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3" }] }
        ];

        // Central React View Component
        function App() {
            const [loading, setLoading] = React.useState(true);
            const [moreLoading, setMoreLoading] = React.useState(false);
            const [books, setBooks] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState("");
            const [activeCategory, setActiveCategory] = React.useState("All");
            
            // Limit displayed audiobooks on screen initially to 20
            const [displayLimit, setDisplayLimit] = React.useState(20);

            // Audio Playback states
            const [selectedBook, setSelectedBook] = React.useState(null);
            const [currentChapterIdx, setCurrentChapterIdx] = React.useState(0);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [currentTime, setCurrentTime] = React.useState(0);
            const [duration, setDuration] = React.useState(0);

            // Track loading progress state of active audio stream
            const [audioLoading, setAudioLoading] = React.useState(false);

            // Controls Scroll-Hiding States
            const [controlsHidden, setControlsHidden] = React.useState(false);

            // Controls for search & filter UI toggles (same logic as Laws.html)
            const [filterCollapsed, setFilterCollapsed] = React.useState(true);
            const [isSearchActive, setIsSearchActive] = React.useState(false);

            const toggleFilter = () => {
                if (window.playTouchSound) window.playTouchSound(4);
                setFilterCollapsed(!filterCollapsed);
            };


            const lastScrollYRef = React.useRef(0);
            const audioRef = React.useRef(null);

            // Dynamic Firebase sync listener equipped with a 3-second safety timeout limit
            React.useEffect(() => {
                const ref = database.ref('admin/AudioBooks');
                
                const backupTimer = setTimeout(() => {
                    if (loading) {
                        setBooks(fallbackAudioBooks);
                        setLoading(false);
                    }
                }, 3000);

                ref.once('value').then((snapshot) => {
                    clearTimeout(backupTimer);
                    const data = snapshot.val();
                    if (data) {
                        const parsedList = Array.isArray(data) ? data : Object.values(data);
                        const cleanList = parsedList.filter(item => item !== null);
                        if (cleanList.length > 0) {
                            setBooks(cleanList);
                            setLoading(false);
                            return;
                        }
                    }
                    setBooks(fallbackAudioBooks);
                    setLoading(false);
                }).catch((err) => {
                    clearTimeout(backupTimer);
                    console.error("Firebase AudioBooks fetch error: ", err);
                    setBooks(fallbackAudioBooks);
                    setLoading(false);
                });

                return () => clearTimeout(backupTimer);
            }, []);

            // Scroll position tracking for hiding controls panel
            React.useEffect(() => {
                const handleScroll = () => {
                    const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
                    const delta = currentScrollY - lastScrollYRef.current;
                    
                    if (Math.abs(delta) < 10) return; 

                    if (delta > 0 && currentScrollY > 100) {
                        setControlsHidden(true);
                    } else if (delta < 0) {
                        setControlsHidden(false);
                    }
                    lastScrollYRef.current = currentScrollY;
                };

                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // IntersectionObserver setup from ListScrollingEffect.html for scroll-in-view scale animation
            React.useEffect(() => {
                if (loading) return;

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('in-view');
                        } else {
                            entry.target.classList.remove('in-view');
                        }
                    });
                }, {
                    root: null,
                    threshold: 0.15
                });

                const cards = document.querySelectorAll('.audiobook-card');
                cards.forEach(card => observer.observe(card));

                return () => {
                    cards.forEach(card => observer.unobserve(card));
                    observer.disconnect();
                };
            }, [books, searchQuery, activeCategory, displayLimit, loading, moreLoading, selectedBook]);

            // Playback timing and loading observers
            React.useEffect(() => {
                if (!audioRef.current) return;
                
                const audio = audioRef.current;
                
                const handleTimeUpdate = () => {
                    setCurrentTime(audio.currentTime);
                };
                const handleLoadedMetadata = () => {
                    setDuration(audio.duration || 0);
                    setAudioLoading(false); 
                };
                const handleAudioEnded = () => {
                    if (selectedBook && selectedBook.chapters && currentChapterIdx < selectedBook.chapters.length - 1) {
                        handleChangeChapter(currentChapterIdx + 1);
                    } else {
                        setIsPlaying(false);
                    }
                };
                const handleLoadStart = () => {
                    setAudioLoading(true);
                };
                const handleWaiting = () => {
                    setAudioLoading(true);
                };
                const handleCanPlay = () => {
                    setAudioLoading(false);
                };
                const handlePlaying = () => {
                    setAudioLoading(false);
                };

                audio.addEventListener('timeupdate', handleTimeUpdate);
                audio.addEventListener('loadedmetadata', handleLoadedMetadata);
                audio.addEventListener('ended', handleAudioEnded);
                audio.addEventListener('loadstart', handleLoadStart);
                audio.addEventListener('waiting', handleWaiting);
                audio.addEventListener('canplay', handleCanPlay);
                audio.addEventListener('playing', handlePlaying);

                return () => {
                    audio.removeEventListener('timeupdate', handleTimeUpdate);
                    audio.removeEventListener('loadedmetadata', handleLoadedMetadata);
                    audio.removeEventListener('ended', handleAudioEnded);
                    audio.removeEventListener('loadstart', handleLoadStart);
                    audio.removeEventListener('waiting', handleWaiting);
                    audio.removeEventListener('canplay', handleCanPlay);
                    audio.removeEventListener('playing', handlePlaying);
                };
            }, [selectedBook, currentChapterIdx]);

            // Play sound FX helper
            const triggerSound = (id) => {
                if (window.playTouchSound) {
                    window.playTouchSound(id);
                }
            };

            // Switch Category filter
            const handleCategoryChange = (cat) => {
                triggerSound(4);
                setActiveCategory(cat);
                setDisplayLimit(20); 
            };

            // Play / Pause toggle
            const handleTogglePlay = () => {
                if (!audioRef.current) return;
                triggerSound(1);
                
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play().catch(e => console.warn("Audio context suspended: ", e));
                    setIsPlaying(true);
                }
            };

            // Format timestamp helper
            const formatTime = (seconds) => {
                if (isNaN(seconds) || seconds === null || !isFinite(seconds)) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            // Skip to Previous Chapter
            const handlePrevChapter = () => {
                if (currentChapterIdx > 0) {
                    triggerSound(4);
                    handleChangeChapter(currentChapterIdx - 1);
                } else {
                    triggerSound(9);
                }
            };

            // Skip to Next Chapter
            const handleNextChapter = () => {
                if (selectedBook && selectedBook.chapters && currentChapterIdx < selectedBook.chapters.length - 1) {
                    triggerSound(4);
                    handleChangeChapter(currentChapterIdx + 1);
                } else {
                    triggerSound(9);
                }
            };

            // Slider progress scrub
            const handleProgressChange = (e) => {
                if (!audioRef.current || !duration) return;
                const pct = parseFloat(e.target.value);
                const newTime = (pct / 100) * duration;
                audioRef.current.currentTime = newTime;
                setCurrentTime(newTime);
            };

            // Directly play audio stream when selecting another chapter
            const handleChangeChapter = (idx) => {
                if (!selectedBook || !selectedBook.chapters || !selectedBook.chapters[idx]) return;
                setCurrentChapterIdx(idx);
                setCurrentTime(0);
                setDuration(0);
                setAudioLoading(true);

                if (audioRef.current) {
                    audioRef.current.src = selectedBook.chapters[idx].audioUrl;
                    audioRef.current.load();
                    audioRef.current.play()
                        .then(() => {
                            setIsPlaying(true);
                        })
                        .catch((e) => {
                            console.warn("Autoplay bypassed:", e);
                            setIsPlaying(false);
                        });
                }
            };

            // Open Audiobook player
            const handleOpenPlayer = (book) => {
                triggerSound(1);
                setSelectedBook(book);
                setCurrentChapterIdx(0);
                setCurrentTime(0);
                setDuration(0);
                setIsPlaying(false);
                setAudioLoading(true);

                // Set initial source on mount
                const initialSrc = book.chapters && book.chapters[0] ? book.chapters[0].audioUrl : "";
                setTimeout(() => {
                    if (audioRef.current && initialSrc) {
                        audioRef.current.src = initialSrc;
                        audioRef.current.load();
                    }
                }, 150);
            };

            // Close Audiobook player
            const handleClosePlayer = () => {
                triggerSound(2);
                if (audioRef.current) {
                    audioRef.current.pause();
                }
                setIsPlaying(false);
                setSelectedBook(null);
            };

            // Chapter selection cards
            const handleChapterCardClick = (idx) => {
                triggerSound(1);
                handleChangeChapter(idx);
            };

            // Load More click simulation handler
            const handleLoadMoreClick = () => {
                triggerSound(1);
                setMoreLoading(true);
                setTimeout(() => {
                    setDisplayLimit((prev) => prev + 20);
                    setMoreLoading(false);
                }, 1200); 
            };

            // Filters logic for search bar
            const filteredBooks = books.filter(book => {
                const matchesCategory = activeCategory === "All" || book.category === activeCategory;
                const matchesSearch = 
                    (book.title && book.title.toLowerCase().includes(searchQuery.toLowerCase())) ||
                    (book.author && book.author.toLowerCase().includes(searchQuery.toLowerCase())) ||
                    (book.description && book.description.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchesCategory && matchesSearch;
            });

            // Splice data based on display limit
            const displayedBooks = filteredBooks.slice(0, displayLimit);
            const hasMoreToLoad = filteredBooks.length > displayLimit;

            const currentChapter = selectedBook && selectedBook.chapters && selectedBook.chapters[currentChapterIdx] 
                ? selectedBook.chapters[currentChapterIdx] 
                : { title: "Chapter 1", duration: "—" };

            const progressPct = duration ? (currentTime / duration) * 100 : 0;

            return (
                <div className="app-container">
                    
                    {/* Header Card Area with Outline & Rounded Bottom Left/Right Corners */}
                    <div className={`header-card ${controlsHidden ? 'hidden' : ''}`} style={{ display: selectedBook ? "none" : "flex" }}>

                        {/* Search Row & Filter Toggle matching Laws.html design */}
                        <div className={`search-row ${isSearchActive ? "search-active" : ""}`}>
                            <div className="search-bar-container">
                                <div className="search-icon-mask"></div>
                                <input
                                    type="text"
                                    placeholder="Search audiobooks..."
                                    autoComplete="off"
                                    value={searchQuery}
                                    onChange={(e) => { setSearchQuery(e.target.value); setDisplayLimit(20); }}
                                    onFocus={() => {
                                        setIsSearchActive(true);
                                        setFilterCollapsed(true);
                                    }}
                                    onBlur={() => {
                                        setTimeout(() => setIsSearchActive(false), 150);
                                    }}
                                />
                            </div>
                            <button
                                className={`filter-toggle-btn ${!filterCollapsed ? "active" : ""}`}
                                onClick={toggleFilter}
                                aria-label="Toggle filters"
                                title="Toggle filters"
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                                    <defs>
                                        <linearGradient id="learneraIconGradient" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                                            <stop stopColor="var(--icon-gradient-start)" />
                                            <stop offset="1" stopColor="var(--icon-gradient-end)" />
                                        </linearGradient>
                                    </defs>
                                    <line x1="4" y1="6" x2="20" y2="6"></line>
                                    <line x1="7" y1="12" x2="17" y2="12"></line>
                                    <line x1="10" y1="18" x2="14" y2="18"></line>
                                </svg>
                            </button>
                        </div>

                        {/* Collapsible Category Filter Pills Row */}
                        <div className={`categories-filter-wrapper ${filterCollapsed ? "collapsed" : ""}`}>
                            {categoriesList.map((cat) => (
                                <div
                                    key={cat}
                                    className={`category-pill ${activeCategory === cat ? "active" : ""}`}
                                    onClick={() => {
                                        if (window.playTouchSound) window.playTouchSound(4);
                                        handleCategoryChange(cat);
                                    }}
                                >
                                    <span>{cat}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* App Card containing Audiobooks grid (gradient outline box) */}
                    <div className="app-card" style={{ display: selectedBook ? "none" : "flex" }}>
                        <div className="audiobooks-grid">
                            {loading ? (
                                // Shimmer placeholders
                                Array(20).fill(0).map((_, idx) => (
                                    <div key={idx} className="skeleton-loading"></div>
                                ))
                            ) : displayedBooks.length > 0 ? (
                                <React.Fragment>
                                    {displayedBooks.map((book, idx) => (
                                        <div 
                                            key={`${activeCategory}|${searchQuery}|${book.id || idx}`} 
                                            className="audiobook-card"
                                            onClick={() => handleOpenPlayer(book)}
                                        >
                                            <img 
                                                className="audiobook-card-cover" 
                                                src={book.coverUrl || "https://placehold.co/400x400/333333/FFFFFF?text=No+Cover"} 
                                                alt={book.title}
                                                onError={(e) => {
                                                    e.target.src = "https://placehold.co/400x400/333333/FFFFFF?text=No+Cover";
                                                }}
                                            />
                                            <div className="audiobook-card-content">
                                                <h3 className="audiobook-title">{book.title}</h3>
                                                <span className="audiobook-author">{book.author}</span>
                                            </div>
                                        </div>
                                    ))}

                                    {/* Load More shimmer cards */}
                                    {moreLoading && (
                                        Array(10).fill(0).map((_, idx) => (
                                            <div key={`more-skel-${idx}`} className="skeleton-loading"></div>
                                        ))
                                    )}
                                </React.Fragment>
                            ) : (
                                <div style={{ textAlign: "center", gridColumn: "span 2", padding: "30px 10px", color: "var(--sub-text-color)" }}>
                                    No audiobooks found matching your request.
                                </div>
                            )}
                        </div>

                        {/* Load More pagination controls */}
                        {!loading && !moreLoading && hasMoreToLoad && (
                            <button 
                                className="back-pill-button" 
                                onClick={handleLoadMoreClick}
                                style={{ width: "100%", marginTop: "20px", height: "46px" }}
                            >
                                Load More Audiobooks
                            </button>
                        )}
                    </div>

                    {/* Full-screen Audiobook Player Screen (EXACTLY UNCHANGED) */}
                    {selectedBook && (
                        <div className="full-screen-arrangement show">
                            
                            {/* Floating Back Button */}
                            <div className="back-btn-float-container">
                                <button 
                                    className="back-pill-button" 
                                    onClick={handleClosePlayer}
                                    title="Close Player"
                                >
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <line x1="19" y1="12" x2="5" y2="12"></line>
                                        <polyline points="12 19 5 12 12 5"></polyline>
                                    </svg>
                                </button>
                            </div>

                            {/* Player screen scrollable viewport */}
                            <div className="player-scroll-area">
                                
                                {/* Cover art card */}
                                <div className="player-cover-wrapper">
                                    <img 
                                        className="player-cover-image" 
                                        src={selectedBook.coverUrl || "https://placehold.co/400x400/333333/FFFFFF?text=No+Cover"} 
                                        alt={selectedBook.title}
                                    />
                                </div>

                                <div style={{ textAlign: "center", width: "100%", maxWidth: "440px" }}>
                                    <h2 style={{ fontSize: "1.25em", fontWeight: "800", color: "var(--text-color)" }}>{selectedBook.title}</h2>
                                    <span style={{ fontSize: "0.82em", fontWeight: "600", color: "var(--sub-text-color)" }}>By {selectedBook.author}</span>
                                </div>

                                {/* Custom Audio Player Panel */}
                                <div className="audio-player-panel">
                                    
                                    {/* Timeline progress range bar */}
                                    <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                                        <input 
                                            type="range" 
                                            className={`simple-progress-slider ${audioLoading ? "loading-bar" : ""}`}
                                            min="0"
                                            max="100"
                                            step="0.1"
                                            value={progressPct}
                                            onChange={handleProgressChange}
                                        />
                                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.76em", color: "var(--sub-text-color)", fontWeight: "600" }}>
                                            <span>{formatTime(currentTime)}</span>
                                            <span>{formatTime(duration)}</span>
                                        </div>
                                    </div>

                                    {/* Control triggers row */}
                                    <div className="player-controls-row">
                                        <button className="back-pill-button" onClick={handlePrevChapter} style={{ width: "42px", height: "42px", borderRadius: "50%" }}>
                                            <i className="fa-solid fa-backward" style={{ fontSize: "0.9em" }}></i>
                                        </button>
                                        <button 
                                            className="back-pill-button" 
                                            onClick={handleTogglePlay}
                                            style={{ width: "54px", height: "54px", borderRadius: "50%", color: "var(--blue)" }}
                                        >
                                            <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}`} style={{ fontSize: "1.1em" }}></i>
                                        </button>
                                        <button className="back-pill-button" onClick={handleNextChapter} style={{ width: "42px", height: "42px", borderRadius: "50%" }}>
                                            <i className="fa-solid fa-forward" style={{ fontSize: "0.9em" }}></i>
                                        </button>
                                    </div>

                                </div>

                                {/* Chapters list section */}
                                <div className="settings-group">
                                    <div className="settings-group-title">Chapters</div>
                                    <div style={{ display: "flex", flexDirection: "column", width: "100%" }}>
                                        {selectedBook.chapters && selectedBook.chapters.map((ch, idx) => {
                                            const isCurrent = currentChapterIdx === idx;
                                            const showPauseIcon = isCurrent && isPlaying;
                                            return (
                                                <div 
                                                    key={idx}
                                                    className={`settings-item ${isCurrent ? 'playing-chapter' : ''}`}
                                                    style={{ cursor: "pointer", display: "flex", alignItems: "center", width: "100%" }}
                                                    onClick={() => handleChapterCardClick(idx)}
                                                >
                                                    <div className="episode-bubble-num">{idx + 1}</div>
                                                    
                                                    <div style={{ display: "flex", flexDirection: "column", textAlign: "left", flex: 1, padding: "0 10px", minWidth: 0 }}>
                                                        <span className="episode-title-text" style={{ fontSize: "0.85em", fontWeight: "700" }}>{ch.title}</span>
                                                        <span className="episode-duration-text" style={{ fontSize: "0.75em", opacity: 0.8, marginTop: "2px" }}>Duration: {ch.duration}</span>
                                                    </div>
                                                    
                                                    <div style={{ fontSize: "1.1em", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                                        <i 
                                                            className={`fa-solid ${showPauseIcon ? 'fa-pause' : 'fa-play'} ${isCurrent ? 'active-play-icon' : ''}`} 
                                                            style={isCurrent ? {} : { color: "var(--sub-text-color)" }}
                                                        ></i>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Audiobook Narrative Description details card */}
                                <div className="player-details-card">
                                    <span style={{ fontSize: "1.05em", fontWeight: "800", color: "var(--blue)", textTransform: "uppercase" }}>
                                        {selectedBook.category}
                                    </span>
                                    <div style={{ fontSize: "0.85em", fontWeight: "700", color: "var(--text-color)" }}>Narrator: {selectedBook.narrator}</div>
                                    <hr style={{ border: "0", borderTop: "1px solid rgba(255,255,255,0.15)", margin: "3px 0" }} />
                                    <div style={{ fontSize: "0.82em", fontWeight: "700", color: "var(--text-color)" }}>Synopsis:</div>
                                    <p style={{ fontSize: "0.8em", color: "var(--sub-text-color)", lineHeight: "1.55" }}>
                                        {selectedBook.description}
                                    </p>
                                </div>

                            </div>

                            {/* Hidden HTML5 Audio Tag */}
                            <audio ref={audioRef} />

                        </div>
                    )}

                </div>
            );
        }

        // Render application instance
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
