name: Android Engine
on:
  workflow_dispatch:
    inputs:
      app_name: { required: true }
      target_url: { required: true }
      package_name: { required: true }
      edge_to_edge: { required: true }
      hide_status_bar: { required: true }
      immersive: { required: true }
      orientation: { required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
      - name: Configure Template
        run: |
          mkdir -p app/src/main/assets
          cat <<EOF > app/src/main/assets/app_config.json
          {"url":"${{ github.event.inputs.target_url }}","isLocal":false}
          EOF
          cat <<EOF > app/src/main/assets/ui_config.json
          {"edgeToEdge":${{ github.event.inputs.edge_to_edge }},"hideStatusBar":${{ github.event.inputs.hide_status_bar }},"immersiveFullscreen":${{ github.event.inputs.immersive }},"javascript":true,"fileUpload":true,"downloads":true}
          EOF
          cat <<EOF > app/src/main/assets/offline.html
          <!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#0c0f17;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;}button{background:#3b82f6;border:0;color:#fff;padding:10px 20px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:15px;}</style></head><body><h2>Connection Lost</h2><p>Unable to connect to the server.</p><button onclick="AndroidBridge.retryConnection()">Retry</button></body></html>
          EOF

          APP="${{ github.event.inputs.app_name }}"
          PKG="${{ github.event.inputs.package_name }}"
          ORI="${{ github.event.inputs.orientation }}"

          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP</string>|g" app/src/main/res/values/strings.xml
          sed -i "s|android:screenOrientation=\".*\"|android:screenOrientation=\"$ORI\"|g" app/src/main/AndroidManifest.xml
          sed -i "s|namespace = \".*\"|namespace = \"$PKG\"|g" app/build.gradle.kts
          sed -i "s|applicationId = \".*\"|applicationId = \"$PKG\"|g" app/build.gradle.kts

          TARGET_DIR="app/src/main/java/$(echo $PKG | tr '.' '/')"
          mkdir -p "$TARGET_DIR"
          for f in app/src/main/java/com/web2apk/template/*.kt; do
            sed -i "s|package com.web2apk.template|package $PKG|g" "$f"
            mv "$f" "$TARGET_DIR/"
          done
          rm -rf app/src/main/java/com/web2apk
          sed -i "s|com.web2apk.template.MainActivity|$PKG.MainActivity|g" app/src/main/AndroidManifest.xml
          chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
