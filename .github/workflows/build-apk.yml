name: Dynamic Android APK Builder
on:
  workflow_dispatch:
    inputs:
      app_name: { required: false, default: "LearnEra" }
      target_url: { required: false, default: "https://himanshuk777.github.io/LearnEra/" }
      package_name: { required: false, default: "com.learnera.app" }
      version_name: { required: false, default: "1.0.0" }
      version_code: { required: false, default: "1" }
      edge_to_edge: { required: false, default: "true" }
      hide_status_bar: { required: false, default: "false" }
      immersive: { required: false, default: "false" }
      javascript: { required: false, default: "true" }
      file_upload: { required: false, default: "true" }
      camera: { required: false, default: "false" }
      microphone: { required: false, default: "false" }
      location: { required: false, default: "false" }
      downloads: { required: false, default: "true" }
      orientation: { required: false, default: "portrait" }
      is_local: { required: false, default: "false" }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3

      - name: Configure Android Project & Features
        run: |
          mkdir -p app/src/main/assets/www
          
          APP="${{ github.event.inputs.app_name || 'LearnEra' }}"
          URL="${{ github.event.inputs.target_url || 'https://himanshuk777.github.io/LearnEra/' }}"
          PKG="${{ github.event.inputs.package_name || 'com.learnera.app' }}"
          VNAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          VCODE="${{ github.event.inputs.version_code || '1' }}"
          IS_LOCAL="${{ github.event.inputs.is_local || 'false' }}"

          # Handle Direct HTML packaging mode
          if [ "$IS_LOCAL" = "true" ] && [ -f "app/src/main/assets/www/index.html" ]; then
            FINAL_URL="https://appassets.androidplatform.net/assets/www/index.html"
          else
            FINAL_URL="$URL"
          fi

          cat <<EOF > app/src/main/assets/app_config.json
          {"url":"$FINAL_URL","isLocal":$IS_LOCAL}
          EOF

          cat <<EOF > app/src/main/assets/ui_config.json
          {
            "edgeToEdge": ${{ github.event.inputs.edge_to_edge || 'true' }},
            "hideStatusBar": ${{ github.event.inputs.hide_status_bar || 'false' }},
            "immersive": ${{ github.event.inputs.immersive || 'false' }},
            "javascript": ${{ github.event.inputs.javascript || 'true' }},
            "fileUpload": ${{ github.event.inputs.file_upload || 'true' }},
            "downloads": ${{ github.event.inputs.downloads || 'true' }}
          }
          EOF

          # Ensure default offline page exists
          if [ ! -f "app/src/main/assets/offline.html" ]; then
            cat <<EOF > app/src/main/assets/offline.html
            <!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#0c0f17;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;}button{background:#2563eb;border:0;color:#fff;padding:12px 24px;border-radius:24px;font-weight:bold;cursor:pointer;margin-top:16px;}</style></head><body><h2>No Connection</h2><p>Could not connect to server.</p><button onclick="location.reload()">Retry</button></body></html>
          EOF
          fi

          # Replicate uploaded icon across mipmaps
          if [ -f "app/src/main/res/drawable/ic_launcher.png" ]; then
            for dir in app/src/main/res/mipmap-*; do
              cp app/src/main/res/drawable/ic_launcher.png "$dir/ic_launcher.png" || true
            done
          fi

          # Replace string & version resources
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP</string>|g" app/src/main/res/values/strings.xml || true
          sed -i "s|namespace = \".*\"|namespace = \"$PKG\"|g" app/build.gradle.kts || true
          sed -i "s|applicationId = \".*\"|applicationId = \"$PKG\"|g" app/build.gradle.kts || true
          sed -i "s/versionCode = .*/versionCode = $VCODE/g" app/build.gradle.kts || true
          sed -i "s/versionName = .*/versionName = \"$VNAME\"/g" app/build.gradle.kts || true

          # Inject permissions dynamically
          PERMS=""
          if [ "${{ github.event.inputs.camera }}" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.CAMERA\"/>"
          fi
          if [ "${{ github.event.inputs.microphone }}" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>"
          fi
          if [ "${{ github.event.inputs.location }}" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"
          fi

          # Manifest settings
          sed -i 's/<application/<application android:hardwareAccelerated="true"/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/<activity/<activity android:hardwareAccelerated="true" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"/g' app/src/main/AndroidManifest.xml || true
          sed -i "s|android:screenOrientation=\".*\"|android:screenOrientation=\"${{ github.event.inputs.orientation || 'portrait' }}\"|g" app/src/main/AndroidManifest.xml || true
          sed -i "s|com.web2apk.template.MainActivity|$PKG.MainActivity|g" app/src/main/AndroidManifest.xml || true
          if [ -n "$PERMS" ]; then
            sed -i "/<manifest/a $PERMS" app/src/main/AndroidManifest.xml || true
          fi

          TARGET_DIR="app/src/main/java/$(echo $PKG | tr '.' '/')"
          mkdir -p "$TARGET_DIR"

          # Native MainActivity with Fullscreen Video & Chooser
          cat << 'EOF' > "$TARGET_DIR/MainActivity.kt"
          package PKG_REPLACE

          import android.annotation.SuppressLint
          import android.app.DownloadManager
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.*
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.webkit.WebViewAssetLoader
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var customView: View? = null
              private var customViewCallback: WebChromeClient.CustomViewCallback? = null
              private lateinit var fullscreenContainer: FrameLayout
              private lateinit var assetLoader: WebViewAssetLoader
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val uris: Array<Uri>? = if (result.resultCode == RESULT_OK) {
                      WebChromeClient.FileChooserParams.parseResult(result.resultCode, result.data)
                  } else {
                      null
                  }
                  fileUploadCallback?.onReceiveValue(uris)
                  fileUploadCallback = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val uiConfig = loadUiConfig()
                  applyDisplayConfigurations(uiConfig)

                  assetLoader = WebViewAssetLoader.Builder()
                      .setDomain("appassets.androidplatform.net")
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  val root = FrameLayout(this)
                  webView = WebView(this)
                  fullscreenContainer = FrameLayout(this).apply {
                      visibility = View.GONE
                      setBackgroundColor(Color.BLACK)
                  }

                  root.addView(webView, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  root.addView(fullscreenContainer, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  setContentView(root)

                  webView.isVerticalScrollBarEnabled = false
                  webView.isHorizontalScrollBarEnabled = false
                  webView.overScrollMode = View.OVER_SCROLL_NEVER

                  webView.settings.apply {
                      javaScriptEnabled = uiConfig.optBoolean("javascript", true)
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      allowFileAccess = true
                      setGeolocationEnabled(true)
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowCustomView(view: View?, callback: CustomViewCallback?) {
                          if (customView != null) {
                              onHideCustomView()
                              return
                          }
                          customView = view
                          customViewCallback = callback
                          webView.visibility = View.GONE
                          fullscreenContainer.visibility = View.VISIBLE
                          fullscreenContainer.addView(view, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                          val controller = WindowCompat.getInsetsController(window, window.decorView)
                          controller.hide(WindowInsetsCompat.Type.systemBars())
                          controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      }

                      override fun onHideCustomView() {
                          if (customView == null) return
                          fullscreenContainer.removeView(customView)
                          fullscreenContainer.visibility = View.GONE
                          webView.visibility = View.VISIBLE
                          customView = null
                          customViewCallback?.onCustomViewHidden()
                          customViewCallback = null

                          val controller = WindowCompat.getInsetsController(window, window.decorView)
                          controller.show(WindowInsetsCompat.Type.systemBars())
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      }

                      override fun onShowFileChooser(v: WebView?, callback: ValueCallback<Array<Uri>>?, p: FileChooserParams?): Boolean {
                          if (!uiConfig.optBoolean("fileUpload", true)) return false
                          fileUploadCallback?.onReceiveValue(null)
                          fileUploadCallback = callback
                          val intent = p?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply { 
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*" 
                          }
                          return try {
                              fileChooserLauncher.launch(intent)
                              true
                          } catch (e: Exception) {
                              fileUploadCallback?.onReceiveValue(null)
                              fileUploadCallback = null
                              false
                          }
                      }

                      override fun onGeolocationPermissionsShowPrompt(origin: String?, callback: GeolocationPermissions.Callback?) {
                          callback?.invoke(origin, true, false)
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, req: WebResourceRequest): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(req.url)
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          view?.evaluateJavascript("var s = document.createElement('style'); s.innerHTML = '::-webkit-scrollbar { display: none !important; } * { scrollbar-width: none !important; }'; document.head.appendChild(s);", null)
                      }

                      override fun onReceivedError(view: WebView, req: WebResourceRequest, err: WebResourceError) {
                          if (req.isForMainFrame) {
                              webView.loadUrl("https://appassets.androidplatform.net/assets/offline.html")
                          }
                      }
                  }

                  if (uiConfig.optBoolean("downloads", true)) {
                      webView.setDownloadListener { url, userAgent, contentDisposition, mimetype, _ ->
                          try {
                              val request = DownloadManager.Request(Uri.parse(url)).apply {
                                  setMimeType(mimetype)
                                  addRequestHeader("User-Agent", userAgent)
                                  setDescription("Downloading file...")
                                  setTitle(URLUtil.guessFileName(url, contentDisposition, mimetype))
                                  setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                  setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, contentDisposition, mimetype))
                              }
                              val dm = getSystemService(DOWNLOAD_SERVICE) as DownloadManager
                              dm.enqueue(request)
                              Toast.makeText(this, "Downloading file...", Toast.LENGTH_SHORT).show()
                          } catch (e: Exception) {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                          }
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (customView != null) {
                              webView.webChromeClient?.onHideCustomView()
                          } else if (webView.canGoBack()) {
                              webView.goBack()
                          } else {
                              finish()
                          }
                      }
                  })

                  try {
                      val cfg = JSONObject(assets.open("app_config.json").bufferedReader().use { it.readText() })
                      webView.loadUrl(cfg.getString("url"))
                  } catch (e: Exception) {
                      webView.loadUrl("https://himanshuk777.github.io/LearnEra/")
                  }
              }

              private fun loadUiConfig(): JSONObject {
                  return try {
                      val txt = assets.open("ui_config.json").bufferedReader().use { it.readText() }
                      JSONObject(txt)
                  } catch (_: Exception) { JSONObject() }
              }

              private fun applyDisplayConfigurations(uiConfig: JSONObject) {
                  val edgeToEdge = uiConfig.optBoolean("edgeToEdge", true)
                  val hideStatusBar = uiConfig.optBoolean("hideStatusBar", false)
                  val immersive = uiConfig.optBoolean("immersive", false)

                  WindowCompat.setDecorFitsSystemWindows(window, !edgeToEdge)
                  val controller = WindowCompat.getInsetsController(window, window.decorView)

                  if (hideStatusBar) controller.hide(WindowInsetsCompat.Type.statusBars())
                  if (immersive) {
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }
          }
          EOF

          sed -i "s|package PKG_REPLACE|package $PKG|g" "$TARGET_DIR/MainActivity.kt"
          chmod +x gradlew

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
