<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnEra - Science Hub</title>
    
    <!-- External Font Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- React & Babel CDN Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Early theme bootstrap -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('appThemeMode') || 'system';
                const isDark = savedTheme === 'dark' ||
                    (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.setAttribute('data-dark-text', darkStyle);
                } else {
                    document.documentElement.removeAttribute('data-dark-text');
                }
                const topSp = localStorage.getItem('appTopSpace') || '5';
                document.documentElement.style.setProperty('--top-space', topSp + 'vh');
            } catch (e) {
                document.documentElement.style.setProperty('--top-space', '5vh');
            }
            const savedLang = localStorage.getItem('appLanguageSelection') || 'en';
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>

    <style>
        /* CSS Reset Elements */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* Color Tokens & Global Variables */
        :root {
            --body-bg: #e6edf7; 
            --neu-shadow-light: #ffffff;
            --neu-shadow-dark: #c8d3e4;
            
            --text-color: #2d3748; 
            --sub-text-color: #718096; 
            --blue: #1E90FF;
            --select-active-color: #1E90FF;
            --divider-color: rgba(138, 43, 226, 0.15);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
            
            --top-space: 5vh;
            --transition-theme: background-color 0.8s ease, color 0.8s ease, box-shadow 0.8s ease, border-color 0.8s ease;

            /* LearnEra Header Gradient Outline Tokens */
            --header-gradient: linear-gradient(135deg, #8A2BE2, #a158e6, #DA70D6);
        }

        /* Standard Dark Mode Modifiers */
        html[data-theme="dark"] {
            --body-bg: #1e1e24; 
            --neu-shadow-dark: #101014;
            --neu-shadow-light: rgba(255, 255, 255, 0.05);
            
            --text-color: #d1d9e6; 
            --sub-text-color: #a3b1c6; 
            --divider-color: rgba(255, 255, 255, 0.08);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.02);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.02);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.02);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 5px rgba(255, 255, 255, 0.03);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px rgba(255, 255, 255, 0.02);
        }

        /* Deep-Dark Mode Specific Styles */
        html[data-dark-text="deep-dark"] {
            --body-bg: #0c0c0f; 
            --neu-shadow-dark: #050506;
            --divider-color: rgba(255, 255, 255, 0.04);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.01);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.01);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.01);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.01);
            
            --blue: #7a8b9e;
            --select-active-color: #7a8b9e;
            --header-gradient: linear-gradient(135deg, #7a8b9e, #55555d);
        }

        html[data-dark-text="deep-dark"] *,
        html[data-dark-text="deep-dark"] i,
        html[data-dark-text="deep-dark"] h3,
        html[data-dark-text="deep-dark"] h4,
        html[data-dark-text="deep-dark"] p,
        html[data-dark-text="deep-dark"] span,
        html[data-dark-text="deep-dark"] li,
        html[data-dark-text="deep-dark"] button,
        html[data-dark-text="deep-dark"] input {
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border-color: #55555d !important;
        }

        /* Custom Scrollbar Visual Hidden Settings */
        ::-webkit-scrollbar {
            display: none !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--body-bg);
            color: var(--text-color);
            overflow-y: auto; 
            overscroll-behavior: none;
            font-family: 'Poppins', sans-serif !important;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            font-size: 13px; 
            transition: var(--transition-theme);
            padding-top: var(--top-space);
        }

        /* Layout Framework Container */
        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px 15px 15px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-start;
            height: auto;
            min-height: 100%;
        }

        /* Neumorphic Responsive Card Style */
        .app-card {
            background: var(--body-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow), inset 1px 1px 2px rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.35);
            display: flex;
            flex-direction: column;
            transition: var(--transition-theme);
            height: auto;
        }

        /* Horizontal Scroller Section Buttons */
        .categories-filter-wrapper {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        /* Inactive category pills: Grey outline style */
        .category-pill {
            flex: 1;
            text-align: center;
            flex-shrink: 0;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            background: transparent !important;
            color: var(--sub-text-color);
            box-shadow: none !important;
            border: 1.5px solid rgba(150, 150, 150, 0.35) !important;
            transition: all 0.25s ease;
        }

        html[data-theme="dark"] .category-pill {
            border: 1.5px solid rgba(180, 180, 180, 0.30) !important;
        }

        .category-pill:active {
            transform: scale(0.97);
        }

        /* Active Section Button: Gradient Outline Style */
        .category-pill.active {
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            color: #8A2BE2 !important;
            font-weight: 700;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border: 1.5px solid rgba(122, 139, 158, 0.3) !important;
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] .category-pill.active {
            border: 1.5px solid #7a8b9e !important;
            background: #0c0c0f !important;
            color: #7a8b9e !important;
        }

        /* Section Switching Smooth Entrance Animation */
        .section-switch-anim {
            animation: sectionFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes sectionFadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* General layout blocks for categories and topics */
        .category-group-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            text-align: left;
        }

        .group-heading {
            font-size: 1.05em;
            font-weight: 800;
            color: var(--text-color);
            margin: 10px 0 5px 0;
            letter-spacing: 0.3px;
        }

        /* Smooth FAQ-style sliding accordions */
        .faq-item {
            background: var(--body-bg);
            border-radius: 16px;
            border: none;
            box-shadow: var(--card-shadow-micro) !important; 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.4s ease;
            overflow: hidden;
            width: 100%;
        }

        html[data-theme="dark"] .faq-item, html[data-dark-text="deep-dark"] .faq-item {
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 700;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .faq-question .icon {
            font-size: 0.9em;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.8;
        }

        /* Buttery Smooth Height-calculated transitions matching FAQs (3).html */
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out; 
        }

        /* Inner Content with outline divider line */
        .faq-answer-content {
            margin: 0 18px; 
            padding: 12px 0 18px 0;
            border-top: 1px solid var(--divider-color); 
            color: var(--sub-text-color);
            font-size: 0.82em;
            line-height: 1.6;
            text-align: left;
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Active Expanded State */
        .faq-item.active {
            box-shadow: var(--card-shadow-inset) !important;
            transform: scale(0.99);
        }

        .faq-item.active .faq-question {
            color: var(--text-color);
        }

        .faq-item.active .faq-question .icon {
            transform: rotate(180deg);
        }

        .faq-item.active .faq-answer-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom Popup Box Overlay */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.45) !important;
            backdrop-filter: blur(16px) !important; 
            -webkit-backdrop-filter: blur(16px) !important;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }

        .custom-modal {
            background: var(--body-bg);
            border-radius: 24px;
            padding: 24px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: none !important;
        }

        /* Shimmer Loading Skeletons rules */
        .skeleton-loading {
            background: var(--body-bg) !important;
            border-color: transparent !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
            color: transparent !important;
            pointer-events: none !important;
            position: relative !important;
            overflow: hidden !important;
            min-height: 50px;
            border-radius: 14px;
        }

        .skeleton-loading * {
            visibility: hidden !important;
        }

        .skeleton-loading::after {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: skeleton-shimmer-animation 1.5s infinite;
        }
        body[data-theme="dark"] .skeleton-loading::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }
        @keyframes skeleton-shimmer-animation {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        html[data-dark-text="deep-dark"] .skeleton-loading {
            background: #08080a !important;
        }

        @media (min-width: 768px) {
            body {
                justify-content: center;
                align-items: center;
                padding-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Target Root Mounting Division for React App -->
    <div id="root" style="width: 100%;"></div>

    <!-- Live Execution Module Scripts -->
    <script type="text/babel">
        // Sound FX System matching exact Tools.html implementation
        (function initDashboardSoundFX(){
            const LS_MASTER = 'touchSoundsEnabled';
            const LS_GROUPS = 'touchSoundsGroupState';

            const CLICK_SOUND_URLS = [
                "Click1.ogg", "Click2.ogg", "Click3.ogg", "Click4.ogg", "Click5.ogg",
                "Click6.ogg", "Click7.ogg", "Click8.ogg", "Click9.ogg", "Click10.ogg",
                "Click11.ogg", "Click12.ogg", "Click13.ogg", "Click14.ogg"
            ];

            const GROUP_TO_CLICKS = {
                'buttons'   : [1, 2, 3, 7, 8, 9, 14],
                'navigation': [5],
                'inputs'    : [4, 6],
                'reserved'  : [10, 11, 12, 13]
            };

            const CLICK_TO_GROUP = {};
            Object.keys(GROUP_TO_CLICKS).forEach(g => {
                GROUP_TO_CLICKS[g].forEach(n => { CLICK_TO_GROUP[n] = g; });
            });

            const audioCache = {};
            let _ac = null;
            let _masterGain = null;

            function getAC(){
                if (_ac) return _ac;
                try {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) {
                        _ac = new Ctx();
                        const comp = _ac.createDynamicsCompressor();
                        comp.threshold.value = -10;
                        comp.knee.value = 6;
                        comp.ratio.value = 12;
                        comp.attack.value = 0.001;
                        comp.release.value = 0.05;
                        _masterGain = _ac.createGain();
                        _masterGain.gain.value = 1.0;
                        comp.connect(_masterGain).connect(_ac.destination);
                        _ac._busIn = comp;
                    }
                } catch(e){}
                return _ac;
            }

            function synthClick(n){
                const ac = getAC();
                if (!ac) return;
                if (ac.state === 'suspended') { ac.resume().catch(()=>{}); }
                const SYNTH = {
                    1:  { f: 880,  d: 0.05, w: 'triangle', g: 0.18 },
                    2:  { f: 520,  d: 0.07, w: 'sine',     g: 0.22 },
                    3:  { f: 660,  d: 0.08, w: 'square',   g: 0.16 },
                    4:  { f: 1200, d: 0.03, w: 'sine',     g: 0.12 },
                    5:  { f: 740,  d: 0.05, w: 'triangle', g: 0.18 },
                    6:  { f: 1000, d: 0.025,w: 'sine',     g: 0.10 },
                    7:  { f: 600,  d: 0.05, w: 'square',   g: 0.16 },
                    8:  { f: 820,  d: 0.05, w: 'triangle', g: 0.18 },
                    9:  { f: 420,  d: 0.06, w: 'sine',     g: 0.18 },
                    10: { f: 480,  d: 0.05, w: 'triangle', g: 0.16 },
                    11: { f: 560,  d: 0.05, w: 'triangle', g: 0.16 },
                    12: { f: 640,  d: 0.05, w: 'triangle', g: 0.16 },
                    13: { f: 720,  d: 0.05, w: 'triangle', g: 0.16 },
                    14: { f: 440,  d: 0.08, w: 'sine',     g: 0.60 }
                };
                const r = SYNTH[n] || SYNTH[7];
                const t0 = ac.currentTime;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = r.w;
                osc.frequency.setValueAtTime(r.f, t0);
                osc.frequency.exponentialRampToValueAtTime(Math.max(80, r.f * 0.6), t0 + r.d);
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(r.g, t0 + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + r.d);
                osc.connect(gain).connect(ac._busIn || ac.destination);
                osc.start(t0);
                osc.stop(t0 + r.d + 0.02);
            }

            function playClick(n, opts){
                opts = opts || {};
                const isMasterOn = localStorage.getItem(LS_MASTER) === '1' || localStorage.getItem(LS_MASTER) === null;
                if (!opts.force && !isMasterOn) return;

                let groupState = {};
                try { groupState = JSON.parse(LS_GROUPS) || {}; } catch(e){}
                const groupId = CLICK_TO_GROUP[n];
                if (!opts.force && groupId && groupState[groupId] === false) return;

                const url = CLICK_SOUND_URLS[n - 1];
                try {
                    if (n === 14) {
                        const a = new Audio(url);
                        a.volume = 1.0;
                        a.play().catch(() => synthClick(14));
                        return;
                    }
                    if (!audioCache[n]) {
                        const a = new Audio(url);
                        a.volume = 0.5;
                        a.preload = 'auto';
                        audioCache[n] = a;
                    }
                    const a = audioCache[n];
                    a.currentTime = 0;
                    const p = a.play();
                    if (p && p.catch) p.catch(() => synthClick(n));
                    return;
                } catch(e) {
                    synthClick(n);
                }
            }

            window.playTouchSound = playClick;

            ['pointerdown','touchstart','keydown','click'].forEach(ev => {
                document.addEventListener(ev, () => {
                    const ac = getAC();
                    if (ac && ac.state === 'suspended') { ac.resume().catch(()=>{}); }
                }, { capture: true, passive: true });
            });
        })();

        // Hardcoded, detailed science syllabus structured under three categories
        const hardcodedScienceTopics = {
            physics: [
                {
                    group: "Mechanics & Kinetics",
                    topics: [
                        {
                            title: "1. Newton's Laws of Motion",
                            explanation: "Governs the physics of motion across all macroscopic entities. The First Law (Inertia) states that an object resists state changes unless forced by an external net force. The Second Law defines force quantitatively as the product of mass and acceleration (F = ma), showing how velocity changes proportionally to net forces. The Third Law establishes that all actions trigger equal, opposite reactions, conserving net momentum across boundaries.",
                            examples: ["A spacecraft gliding endlessly through a cosmic vacuum.", "Recoil felt on your shoulder after firing a high-velocity projectile.", "A passenger shifting forward when a bus decelerates rapidly."]
                        },
                        {
                            title: "2. Work, Energy, and Power",
                            explanation: "Work is executed when a force causes mechanical displacement along the vector line (W = F * d * cos θ). Kinetic Energy represents moving energy (0.5 * m * v²), while Potential Energy represents stored capacity based on position (m * g * h). Power defines the speed of work execution.",
                            examples: ["A crane hoisting heavy structural beams to the top of a skyscraper.", "A compressed mechanical spring storing potential energy.", "An elevator motor lifting passengers upward."]
                        },
                        {
                            title: "3. Momentum and Impulse",
                            explanation: "Momentum is the product of an object's mass and velocity (p = mv), representing its quantity of motion. Impulse is the change in momentum caused by a force acting over a period of time (J = F * Δt). In closed systems, total momentum remains conserved during collisions.",
                            examples: ["A billiard ball striking another, transferring its speed.", "Airbags expanding to prolong crash duration and decrease impact forces.", "A baseball player swinging through the ball to maximize contact time."]
                        }
                    ]
                },
                {
                    group: "Thermodynamics & Heat",
                    topics: [
                        {
                            title: "4. Laws of Thermodynamics",
                            explanation: "The First Law establishes energy conservation (ΔU = Q - W). The Second Law mandates that total entropy (disorder) in isolated boundaries always increases, showing that heat cannot spontaneously flow from cold to hot. The Third Law states that entropy approaches a constant minimum as temperature approaches absolute zero.",
                            examples: ["Heat engines converting thermal energy into mechanical work.", "Ice melting spontaneously at room temperature as entropy increases.", "A refrigerator consuming electricity to pump heat out of its interior."]
                        },
                        {
                            title: "5. Heat Transfer Mechanics",
                            explanation: "Conduction transfers heat through molecular collisions in solids. Convection transfers heat through density currents in fluids. Radiation transfers thermal energy via electromagnetic waves without requiring a physical medium.",
                            examples: ["A metal spoon warming up while resting in a hot soup bowl.", "Boiling water circulating in a pot via convection currents.", "The Earth absorbing thermal radiation from the Sun through the vacuum of space."]
                        }
                    ]
                },
                {
                    group: "Waves and Optics",
                    topics: [
                        {
                            title: "6. Wave Properties & Propagation",
                            explanation: "Waves propagate energy through a medium (mechanical waves) or vacuum (electromagnetic waves). Transverse waves oscillate perpendicular to the travel direction, whereas longitudinal waves oscillate parallel to it.",
                            examples: ["Sound waves traveling through air as compression waves.", "Ripples spreading across a pond when a stone is dropped.", "Radio signals propagating through the atmosphere."]
                        },
                        {
                            title: "7. Light Reflection and Mirrors",
                            explanation: "Reflection occurs when light bounces off a boundary. The Law of Reflection states that the angle of incidence equals the angle of reflection. Mirrors utilize this principle to form virtual or real images.",
                            examples: ["Viewing a symmetrical reflection in a flat glass mirror.", "Concave make-up mirrors magnifying facial features.", "Convex side-view mirrors on cars providing a wider field of view."]
                        },
                        {
                            title: "8. Refraction, Snell's Law and Lenses",
                            explanation: "Refraction is the bending of light as it transitions between media with different refractive indices. Lenses utilize refraction to focus (convex) or disperse (concave) light rays.",
                            examples: ["A straw looking bent when placed in a half-filled glass of water.", "Prescription eyeglasses correcting near-sightedness.", "Camera lenses focusing light onto digital sensors."]
                        }
                    ]
                },
                {
                    group: "Electricity & Electromagnetism",
                    topics: [
                        {
                            title: "9. Electric Charge and Coulomb's Law",
                            explanation: "Electric charges create electromagnetic fields. Coulomb's Law dictates that the electrostatic force between two charges is directly proportional to the product of their charges and inversely proportional to the square of the distance between them.",
                            examples: ["Static electricity attracting paper bits to a rubbed plastic comb.", "Lightning striking a lightning rod on top of a building.", "An atom keeping its electrons in orbit around the positively charged nucleus."]
                        },
                        {

                        {

                            explanation: "Atoms form chemical bonds to achieve a stable valence shell. Ionic bonds occur through electron transfer (metal to non-metal). Covalent bonds form by sharing electron pairs (non-metals).",

                        {
                            title: "24. Cellular Organelles",
                            explanation: "Organelles are specialized sub-units within a cell that perform distinct tasks. Mitochondria generate energy (ATP), ribosomes synthesize proteins, and the cell membrane regulates transport.",

                {

                            explanation: "The process of creating proteins. Transcription copies DNA into mRNA inside the cell nucleus. Translation reads the mRNA codons in ribosomes to assemble chains of amino acids into proteins.",

        // Central React View Component
        function App() {
            const [loading, setLoading] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState("physics"); // 'physics' | 'chemistry' | 'biology'
            const [expandedTopicId, setExpandedTopicId] = React.useState(null);

            // Shimmer initial skeleton loop timer (1200ms)
            React.useEffect(() => {
                const timer = setTimeout(() => {
                    setLoading(false);
                }, 1200);
                return () => clearTimeout(timer);
            }, []);

            // Play sound FX helper
            const triggerSound = (id) => {
                if (window.playTouchSound) {
                    window.playTouchSound(id);
                }
            };

            // Switch active category tab with reset
            const handleTabChange = (tab) => {
                triggerSound(5);
                setActiveTab(tab);
                setExpandedTopicId(null);

                // Reset accordion panel heights
                const allAnswers = document.querySelectorAll('.faq-answer');
                allAnswers.forEach(ans => {
                    ans.style.maxHeight = null;
                });
            };

            // Exact slide-toggle accordion logic matching FAQs (3).html
            const handleAccordionToggle = (e, id) => {
                triggerSound(5);
                const currentItem = e.currentTarget.closest('.faq-item');
                if (!currentItem) return;

                const answerWrapper = currentItem.querySelector('.faq-answer');
                const isActive = currentItem.classList.contains('active');

                // Collapse all open entries smoothly
                const faqItems = document.querySelectorAll('.faq-item');
                faqItems.forEach(otherItem => {
                    if (otherItem !== currentItem) {
                        otherItem.classList.remove('active');
                        const otherAnswer = otherItem.querySelector('.faq-answer');
                        if (otherAnswer) {
                            otherAnswer.style.maxHeight = null;
                        }
                    }
                });

                if (isActive) {
                    currentItem.classList.remove('active');
                    if (answerWrapper) answerWrapper.style.maxHeight = null;
                    setExpandedTopicId(null);
                } else {
                    currentItem.classList.add('active');
                    if (answerWrapper) {
                        answerWrapper.style.maxHeight = answerWrapper.scrollHeight + "px";
                    }
                    setExpandedTopicId(id);
                }
            };

            // Get groups for current active tab
            const currentGroups = hardcodedScienceTopics[activeTab] || [];

            return (
                <div className="app-container">
                    <div className="app-card">
                        
                        {/* Section Pills with Active Gradient Outline Style */}
                        <div className="categories-filter-wrapper">
                            <div 
                                className={`category-pill ${activeTab === "physics" ? "active" : ""}`}
                                onClick={() => handleTabChange("physics")}
                            >
                                Physics
                            </div>
                            <div 
                                className={`category-pill ${activeTab === "chemistry" ? "active" : ""}`}
                                onClick={() => handleTabChange("chemistry")}
                            >
                                Chemistry
                            </div>
                            <div 
                                className={`category-pill ${activeTab === "biology" ? "active" : ""}`}
                                onClick={() => handleTabChange("biology")}
                            >
                                Biology
                            </div>
                        </div>

                        {/* Science Topics Viewport with Smooth Section Switching Entry Animation */}
                        <div className="category-group-wrapper section-switch-anim" key={activeTab}>
                            {loading ? (
                                Array(4).fill(0).map((_, idx) => (
                                    <div key={idx} className="skeleton-loading" style={{ height: "50px" }}></div>
                                ))
                            ) : currentGroups.length > 0 ? (
                                currentGroups.map((group, gIdx) => (
                                    <div key={gIdx} style={{ width: "100%" }}>
                                        <h3 className="group-heading">{group.group}</h3>
                                        <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                                            {group.topics.map((topic, tIdx) => {
                                                const uniqueId = `${activeTab}_${gIdx}_${tIdx}`;
                                                return (
                                                    <div key={uniqueId} className="faq-item">
                                                        <div 
                                                            className="faq-question"
                                                            onClick={(e) => handleAccordionToggle(e, uniqueId)}
                                                        >
                                                            <span>{topic.title}</span>
                                                            <i className="fas fa-chevron-down icon"></i>
                                                        </div>
                                                        <div className="faq-answer">
                                                            <div className="faq-answer-content">
                                                                <p style={{ marginBottom: "8px" }}>{topic.explanation}</p>
                                                                {topic.examples && (
                                                                    <div style={{ background: "rgba(255,255,255,0.05)", padding: "10px", borderRadius: "10px", border: "1px solid rgba(255,255,255,0.1)" }}>
                                                                        <strong style={{ fontSize: "0.92em", color: "var(--blue)" }}>Examples:</strong>
                                                                        <ul style={{ paddingLeft: "15px", marginTop: "5px" }}>
                                                                            {topic.examples.map((ex, eIdx) => (
                                                                                <li key={eIdx} style={{ fontSize: "0.95em", fontStyle: "italic" }}>{ex}</li>
                                                                            ))}
                                                                        </ul>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div style={{ textAlign: "center", padding: "30px", color: "var(--sub-text-color)" }}>
                                    No syllabus modules available under this scientific category.
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        // Render application instance
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
