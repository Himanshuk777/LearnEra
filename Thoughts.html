<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnEra - Thoughts</title>
    
    <!-- External Font Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- React & Babel CDN Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Import Maps for React, OGL, and Three.js dependencies (animated backgrounds) -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/client": "https://esm.sh/react-dom@18/client",

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <!-- Early theme bootstrap -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('appThemeMode') || 'system';
                const isDark = savedTheme === 'dark' ||
                    (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.setAttribute('data-dark-text', darkStyle);
                } else {
                    document.documentElement.removeAttribute('data-dark-text');
                }
                const savedBg = localStorage.getItem('appBackgroundStyle') || 'normal';
                if (savedBg && savedBg !== 'normal') {
                    document.documentElement.setAttribute('data-bg-active', '1');
                    document.documentElement.setAttribute('data-bg-style', savedBg);
                }
                const topSp = localStorage.getItem('appTopSpace') || '5';
                document.documentElement.style.setProperty('--top-space', topSp + 'vh');
            } catch (e) {
                document.documentElement.style.setProperty('--top-space', '5vh');
            }
            const savedLang = localStorage.getItem('appLanguageSelection') || 'en';
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>

    <style>
        /* CSS Reset Elements */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* Color Tokens & Global Variables */
        :root {
            --body-bg: #e6edf7; 
            --neu-shadow-light: #ffffff;
            --neu-shadow-dark: #c8d3e4;
            
            --text-color: #2d3748; 
            --sub-text-color: #718096; 
            --blue: #1E90FF;
            --select-active-color: #1E90FF;
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
            
            --top-space: 5vh;
            --transition-theme: background-color 0.8s ease, color 0.8s ease, box-shadow 0.8s ease, border-color 0.8s ease;
        }

        /* Standard Dark Mode Modifiers */
        html[data-theme="dark"] {
            --body-bg: #1e1e24; 
            --neu-shadow-dark: #101014;
            --neu-shadow-light: rgba(255, 255, 255, 0.05);
            
            --text-color: #d1d9e6; 
            --sub-text-color: #a3b1c6; 
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.02);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.02);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.02);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 5px rgba(255, 255, 255, 0.03);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px rgba(255, 255, 255, 0.02);
        }

        /* Deep-Dark Mode Specific Styles (Slate grey color theme applied globally) */
        html[data-dark-text="deep-dark"] {
            --body-bg: #0c0c0f; 
            --neu-shadow-dark: #050506;
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.01);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.01);
            --card-shadow-micro: 3px 3px 6px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.01);
            --card-shadow-inset: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.01);
            
            --blue: #7a8b9e;
            --select-active-color: #7a8b9e;
        }

        html[data-dark-text="deep-dark"] *,
        html[data-dark-text="deep-dark"] i,
        html[data-dark-text="deep-dark"] h3,
        html[data-dark-text="deep-dark"] h4,
        html[data-dark-text="deep-dark"] p,
        html[data-dark-text="deep-dark"] span,
        html[data-dark-text="deep-dark"] li,
        html[data-dark-text="deep-dark"] button {
            color: #7a8b9e !important;
        }

        /* Custom Scrollbar Visual Hidden Settings */
        ::-webkit-scrollbar {
            display: none !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--body-bg);
            color: var(--text-color);
            overflow: hidden; /* Prevent body scrolling directly */
            font-family: 'Poppins', sans-serif !important;
        }

        /* Fixed viewport scroll wrapper with mandatory snap-scrolling */
        #mainScrollWrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .thoughts-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: center;
        }

        /* Mandatory Snap-alignment for cards viewports */
        .thought-section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: center;
            scroll-snap-stop: always;
            padding: 20px;
        }

        /* Thought Neumorphic Card Base Layout */
        .thought-card {
            background: var(--body-bg);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255,255,255,0.3);
            width: 90%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            
            /* Butter-smooth Zoom & Fade transform transitions */
            transform: scale(0.7) translateY(50px);
            opacity: 0;
            filter: brightness(0.5);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.7s ease-out, 
                        filter 0.7s ease-out;
            will-change: transform, opacity, filter;
        }

        /* Fix 1: LearnEra.html text gradient border outline for cards ONLY in Light Mode */
        html:not([data-theme="dark"]):not([data-dark-text="deep-dark"]) .thought-card {
            border: 2px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        linear-gradient(135deg, #FF69B4 0%, #8A2BE2 50%, #1E90FF 100%) border-box !important;
            box-shadow: none !important;
        }

        /* Active Snap-focused State */
        .thought-card.active {
            transform: scale(1) translateY(0);
            opacity: 1;
            filter: brightness(1);
        }

        .thought-card-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }

        .quote-text {
            font-family: 'Playfair Display', serif !important;
            font-size: 1.85em;
            font-weight: 700;
            line-height: 1.45;
            font-style: italic;
            z-index: 2;
            color: var(--text-color);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
            margin-bottom: 25px;
        }

        .author-text {
            position: absolute;
            bottom: 25px;
            right: 25px;
            font-size: 0.85em;
            font-weight: 700;
            color: var(--sub-text-color);
            z-index: 2;
        }

        /* Custom Popup Box Overlay (Outer shadow removed completely) */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.45) !important;
            backdrop-filter: blur(16px) !important; 
            -webkit-backdrop-filter: blur(16px) !important;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 21000;
        }

        .custom-modal-overlay.show {
            display: flex !important;
        }

        .custom-modal {
            background: var(--body-bg);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 90%;
            max-width: 380px;
            box-shadow: none !important; /* Outer shadow removed completely as requested */
        }

        /* Shimmer Loading Skeletons rules */
        .skeleton-loading {
            background: var(--body-bg) !important;
            border-color: transparent !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
            color: transparent !important;
            pointer-events: none !important;
            position: relative !important;
            overflow: hidden !important;
            width: 100%;
            height: 100%;
        }

        .skeleton-loading::after {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: skeleton-shimmer-animation 1.5s infinite;
        }
        body[data-theme="dark"] .skeleton-loading::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }
        @keyframes skeleton-shimmer-animation {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        /* Neumorphic Timed Start Notification Bar */
        #customToast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--body-bg);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 99999;
            font-weight: 700;
            font-family: 'Poppins', sans-serif !important;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 320px;
            justify-content: center;
        }

        html[data-dark-text="deep-dark"] #customToast {
            background: #0c0c0f !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        /* Desktop centering and scaling media queries */
        @media (min-width: 768px) {
            body {
                justify-content: center;
                align-items: center;
                padding-bottom: 40px;
            }
        }

        /* ============================================================
           Minimal Arc Ring Loader (replaces shimmer skeleton loading)
           Purple -> Pink gradient arc
           ============================================================ */
        :root {
            --l4-size: 60px;
            --l4-speed: 0.8s;
            --l4-border-width: 2px;
            --l4-color: #8900FF;
            --l4-gradient-start: #FF69B4;
            --l4-gradient-mid: #C13AE0;
            --l4-gradient-end: #8A2BE2;
        }

        .arc-loader-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .arc-loader {
            position: relative;
            width: var(--l4-size);
            height: var(--l4-size);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arc-loader::before {
            content: "";
            box-sizing: border-box;
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border-top: var(--l4-border-width) solid var(--l4-color);
            border-right: var(--l4-border-width) solid transparent;
            animation: spinner8217 var(--l4-speed) linear infinite;
        }

        @keyframes spinner8217 {
            to { transform: rotate(360deg); }
        }

        .arc-loader-label {
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #FF69B4 0%, #8A2BE2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ============================================================
           Custom Notification Bar : shadow removed + gradient outline
           ============================================================ */
        #customToast {
            box-shadow: none !important;
            border: 2px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box,
                        linear-gradient(135deg, #FF69B4 0%, #C13AE0 50%, #8A2BE2 100%) border-box !important;
        }

        html[data-dark-text="deep-dark"] #customToast {
            box-shadow: none !important;
            border: 2px solid transparent !important;
            background: linear-gradient(#0c0c0f, #0c0c0f) padding-box,
                        linear-gradient(135deg, #FF69B4 0%, #C13AE0 50%, #8A2BE2 100%) border-box !important;
        }

        /* ============================================================
           Animated Background Layer (WebGL themes)
           ============================================================ */
        #bgRoot {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #mainScrollWrapper {
            z-index: 2;
        }

        #bgUiRoot {
            position: fixed;
            inset: 0;
            z-index: 30000;
            pointer-events: none;
        }

        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* Glassmorphism Common Styles */
        .glass-panel {
            background: rgba(18, 18, 24, 0.55);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.125);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Floating Toggle Button */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background-color 0.3s ease, 
                        border-color 0.3s ease;
            outline: none;
        }
        .floating-btn:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .floating-btn:active {
            transform: scale(0.95);
        }
        .floating-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }
        .floating-btn.open svg {
            transform: rotate(90deg);
        }

        /* Glass Popup Modal Box */
        .popup-modal {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 320px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            border-radius: 20px;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
        }
        .popup-modal::-webkit-scrollbar {
            width: 4px;
        }
        .popup-modal::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }
        .popup-modal.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        
        .popup-title {
            margin: 0 0 16px 0;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .popup-title span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
        }

        /* Card Selection Options */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .option-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateX(-2px);
        }
        .option-card.selected {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .option-preview {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .preview-waves {
            background: linear-gradient(135deg, #5227FF 0%, #FF9FFC 100%);
        }
        .preview-tunnel {
            background: radial-gradient(circle, #A855F7 0%, #5227FF 100%);
        }
        .preview-metal {
            background: linear-gradient(45deg, #5227FF 0%, #FF9FFC 50%, #ffffff 100%);
        }
        .preview-lines {
            background: linear-gradient(135deg, #2F4BA2 0%, #E947F5 100%);
        }
        .preview-topo {
            background: repeating-radial-gradient(circle, #5227FF 0, #FF9FFC 6px, #0b0b0b 12px);
        }
        .preview-threads {
            background: linear-gradient(90deg, #5227FF 0%, #FF9FFC 50%, #ffffff 100%);
        }
        .preview-galaxy {
            background: radial-gradient(circle, #00F0FF 0%, #7000FF 50%, #0b0b0b 100%);
        }
        .preview-blinds {
            background: repeating-linear-gradient(90deg, #FF9FFC 0, #FF9FFC 6px, #5227FF 6px, #5227FF 12px);
        }
        .preview-pillar {
            background: linear-gradient(180deg, #5227FF 0%, #FF9FFC 100%);
        }
        .option-info {
            flex-grow: 1;
        }
        .option-name {
            font-size: 13.5px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .option-desc {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.5);
        }
        .active-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #5227FF;
            box-shadow: 0 0 10px #FF9FFC;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .option-card.selected .active-dot {
            opacity: 1;
        }
        .light-pillar-fallback {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.1);
            color: #888;
            font-size: 14px;
        }

        /* Floating theme button relocated to the TOP-LEFT corner */
        .floating-btn.bg-theme-btn {
            top: 20px;
            left: 20px;
            bottom: auto;
            right: auto;
            z-index: 30000;
            pointer-events: auto;
        }

        .popup-modal.bg-theme-modal {
            top: 88px;
            left: 20px;
            bottom: auto;
            right: auto;
            z-index: 30001;
            max-height: calc(100vh - 120px);
            pointer-events: auto;
        }

        .popup-modal.bg-theme-modal .option-card:hover {
            transform: translateX(2px);
        }

        .preview-normal {
            background: linear-gradient(135deg, #FF69B4 0%, #8A2BE2 100%);
        }

        /* When an animated background is active the app surface goes transparent */
        html[data-bg-active="1"], html[data-bg-active="1"] body {
            background-color: transparent !important;
            background-image: none !important;
        }
        /* 1 : solid black page surface ONLY for Web Threads & Galaxy styles */
        html[data-bg-active="1"][data-bg-style="threads"],
        html[data-bg-active="1"][data-bg-style="threads"] body,
        html[data-bg-active="1"][data-bg-style="galaxy"],
        html[data-bg-active="1"][data-bg-style="galaxy"] body {
            background-color: #000000 !important;
        }

        /* 2 : keep every layer above the WebGL canvas fully see-through */
        html[data-bg-active="1"] #root,
