        `;

        const linesFragmentShader = `
        precision highp float;

        uniform float iTime;
        uniform vec3  iResolution;
        uniform float animationSpeed;

        uniform bool enableTop;
        uniform bool enableMiddle;
        uniform bool enableBottom;

        uniform int topLineCount;
        uniform int middleLineCount;
        uniform int bottomLineCount;

        uniform float topLineDistance;
        uniform float middleLineDistance;
        uniform float bottomLineDistance;

        uniform vec3 topWavePosition;
        uniform vec3 middleWavePosition;
        uniform vec3 bottomWavePosition;

        uniform vec2 iMouse;
        uniform bool interactive;
        uniform float bendRadius;
        uniform float bendStrength;
        uniform float bendInfluence;

        uniform bool parallax;
        uniform float parallaxStrength;
        uniform vec2 parallaxOffset;

        uniform vec3 lineGradient[8];
        uniform int lineGradientCount;

        const vec3 BLACK = vec3(0.0);
        const vec3 PINK  = vec3(233.0, 71.0, 245.0) / 255.0;
        const vec3 BLUE  = vec3(47.0,  75.0, 162.0) / 255.0;

        mat2 rotate(float r) {
          return mat2(cos(r), sin(r), -sin(r), cos(r));
        }

        vec3 background_color(vec2 uv) {
          vec3 col = vec3(0.0);

          float y = sin(uv.x - 0.2) * 0.3 - 0.1;
          float m = uv.y - y;

          col += mix(BLUE, BLACK, smoothstep(0.0, 1.0, abs(m)));
          col += mix(PINK, BLACK, smoothstep(0.0, 1.0, abs(m - 0.8)));
          return col * 0.5;
        }

        vec3 getLineColor(float t, vec3 baseColor) {
          if (lineGradientCount <= 0) {
            return baseColor;
          }

          vec3 gradientColor;
          
          if (lineGradientCount == 1) {
            gradientColor = lineGradient[0];
          } else {
            float clampedT = clamp(t, 0.0, 0.9999);
            float scaled = clampedT * float(lineGradientCount - 1);
            int idx = int(floor(scaled));
            float f = fract(scaled);
            int idx2 = min(idx + 1, lineGradientCount - 1);

            vec3 c1 = lineGradient[idx];
            vec3 c2 = lineGradient[idx2];
            
            gradientColor = mix(c1, c2, f);
          }
          
          return gradientColor * 0.5;
        }

        float wave(vec2 uv, float offset, vec2 screenUv, vec2 mouseUv, bool shouldBend) {
          float time = iTime * animationSpeed;

          float x_offset   = offset;
          float x_movement = time * 0.1;
          float amp        = sin(offset + time * 0.2) * 0.3;
          float y          = sin(uv.x + x_offset + x_movement) * amp;

          if (shouldBend) {
            vec2 d = screenUv - mouseUv;
            float influence = exp(-dot(d, d) * bendRadius);
            float bendOffset = (mouseUv.y - screenUv.y) * influence * bendStrength * bendInfluence;
            y += bendOffset;
          }

          float m = uv.y - y;
          return 0.0175 / max(abs(m) + 0.01, 1e-3) + 0.01;
        }

        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          vec2 baseUv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
          baseUv.y *= -1.0;
          
          if (parallax) {
            baseUv += parallaxOffset;
          }

          vec3 col = vec3(0.0);

          vec3 b = lineGradientCount > 0 ? vec3(0.0) : background_color(baseUv);

          vec2 mouseUv = vec2(0.0);
          if (interactive) {
            mouseUv = (2.0 * iMouse - iResolution.xy) / iResolution.y;
            mouseUv.y *= -1.0;
          }
          
          if (enableBottom) {
            for (int i = 0; i < bottomLineCount; ++i) {
              float fi = float(i);
              float t = fi / max(float(bottomLineCount - 1), 1.0);
              vec3 lineCol = getLineColor(t, b);
              
              float angle = bottomWavePosition.z * log(length(baseUv) + 1.0);
              vec2 ruv = baseUv * rotate(angle);
              col += lineCol * wave(
                ruv + vec2(bottomLineDistance * fi + bottomWavePosition.x, bottomWavePosition.y),
                1.5 + 0.2 * fi,
                baseUv,
                mouseUv,
                interactive
              ) * 0.2;
            }
          }

          if (enableMiddle) {
            for (int i = 0; i < middleLineCount; ++i) {
              float fi = float(i);
              float t = fi / max(float(middleLineCount - 1), 1.0);
              vec3 lineCol = getLineColor(t, b);
              
              float angle = middleWavePosition.z * log(length(baseUv) + 1.0);
              vec2 ruv = baseUv * rotate(angle);
              col += lineCol * wave(
                ruv + vec2(middleLineDistance * fi + middleWavePosition.x, middleWavePosition.y),
                2.0 + 0.15 * fi,
                baseUv,
                mouseUv,
                interactive
              );
            }
          }

          if (enableTop) {
            for (int i = 0; i < topLineCount; ++i) {
              float fi = float(i);
              float t = fi / max(float(topLineCount - 1), 1.0);
              vec3 lineCol = getLineColor(t, b);
              
              float angle = topWavePosition.z * log(length(baseUv) + 1.0);
              vec2 ruv = baseUv * rotate(angle);
              ruv.x *= -1.0;
              col += lineCol * wave(
                ruv + vec2(topLineDistance * fi + topWavePosition.x, topWavePosition.y),
                1.0 + 0.2 * fi,
                baseUv,
                mouseUv,
                interactive
              ) * 0.1;
            }
          }

          fragColor = vec4(col, 1.0);
        }

        void main() {
          vec4 color = vec4(0.0);
          mainImage(color, gl_FragCoord.xy);
          gl_FragColor = color;
        }
        `;

        const MAX_GRADIENT_STOPS = 8;

        function hexToVec3(hex) {
          let value = hex.trim();
          if (value.startsWith('#')) {
            value = value.slice(1);
          }

          let r = 255, g = 255, b = 255;
          if (value.length === 3) {
            r = parseInt(value[0] + value[0], 16);
            g = parseInt(value[1] + value[1], 16);
            b = parseInt(value[2] + value[2], 16);
          } else if (value.length === 6) {
            r = parseInt(value.slice(0, 2), 16);
            g = parseInt(value.slice(2, 4), 16);
            b = parseInt(value.slice(4, 6), 16);
          }

          return new THREE.Vector3(r / 255, g / 255, b / 255);
        }

        const FloatingLines = ({
          linesGradient = ['#5227FF', '#FF9FFC', '#FFFFFF'],
          enabledWaves = ['top', 'middle', 'bottom'],
          lineCount = [6],
          lineDistance = [5],
          topWavePosition,
          middleWavePosition,
          bottomWavePosition = { x: 2.0, y: -0.7, rotate: -1 },
          animationSpeed = 1,
          interactive = true,
          bendRadius = 5.0,
          bendStrength = -0.5,
          mouseDamping = 0.05,
          parallax = true,
          parallaxStrength = 0.2,
          mixBlendMode = 'screen'
        }) => {
          const containerRef = useRef(null);
          const targetMouseRef = useRef(new THREE.Vector2(-1000, -1000));
          const currentMouseRef = useRef(new THREE.Vector2(-1000, -1000));
          const targetInfluenceRef = useRef(0);
          const currentInfluenceRef = useRef(0);
          const targetParallaxRef = useRef(new THREE.Vector2(0, 0));
          const currentParallaxRef = useRef(new THREE.Vector2(0, 0));

          const getLineCount = waveType => {
            if (typeof lineCount === 'number') return lineCount;
            if (!enabledWaves.includes(waveType)) return 0;
            const index = enabledWaves.indexOf(waveType);
            return lineCount[index] ?? 6;
          };

          const getLineDistance = waveType => {
            if (typeof lineDistance === 'number') return lineDistance;
            if (!enabledWaves.includes(waveType)) return 0.1;
            const index = enabledWaves.indexOf(waveType);
            return lineDistance[index] ?? 0.1;
          };

          const topLineCount = enabledWaves.includes('top') ? getLineCount('top') : 0;
          const middleLineCount = enabledWaves.includes('middle') ? getLineCount('middle') : 0;
          const bottomLineCount = enabledWaves.includes('bottom') ? getLineCount('bottom') : 0;

          const topLineDistance = enabledWaves.includes('top') ? getLineDistance('top') * 0.01 : 0.01;
          const middleLineDistance = enabledWaves.includes('middle') ? getLineDistance('middle') * 0.01 : 0.01;
          const bottomLineDistance = enabledWaves.includes('bottom') ? getLineDistance('bottom') * 0.01 : 0.01;

          useEffect(() => {
            const container = containerRef.current;
            if (!container) return;

            let active = true;

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            camera.position.z = 1;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.domElement.style.width = '100%';
            renderer.domElement.style.height = '100%';
            container.appendChild(renderer.domElement);

            const uniforms = {
              iTime: { value: 0 },
              iResolution: { value: new THREE.Vector3(1, 1, 1) },
              animationSpeed: { value: animationSpeed },

              enableTop: { value: enabledWaves.includes('top') },
              enableMiddle: { value: enabledWaves.includes('middle') },
              enableBottom: { value: enabledWaves.includes('bottom') },

              topLineCount: { value: topLineCount },
              middleLineCount: { value: middleLineCount },
              bottomLineCount: { value: bottomLineCount },

              topLineDistance: { value: topLineDistance },
              middleLineDistance: { value: middleLineDistance },
              bottomLineDistance: { value: bottomLineDistance },

              topWavePosition: {
                value: new THREE.Vector3(topWavePosition?.x ?? 10.0, topWavePosition?.y ?? 0.5, topWavePosition?.rotate ?? -0.4)
              },
              middleWavePosition: {
                value: new THREE.Vector3(
                  middleWavePosition?.x ?? 5.0,
                  middleWavePosition?.y ?? 0.0,
                  middleWavePosition?.rotate ?? 0.2
                )
              },
              bottomWavePosition: {
                value: new THREE.Vector3(
                  bottomWavePosition?.x ?? 2.0,
                  bottomWavePosition?.y ?? -0.7,
                  bottomWavePosition?.rotate ?? 0.4
                )
              },

              iMouse: { value: new THREE.Vector2(-1000, -1000) },
              interactive: { value: interactive },
              bendRadius: { value: bendRadius },
              bendStrength: { value: bendStrength },
              bendInfluence: { value: 0 },

              parallax: { value: parallax },
              parallaxStrength: { value: parallaxStrength },
              parallaxOffset: { value: new THREE.Vector2(0, 0) },

              lineGradient: {
                value: Array.from({ length: MAX_GRADIENT_STOPS }, () => new THREE.Vector3(1, 1, 1))
              },
              lineGradientCount: { value: 0 }
            };

            if (linesGradient && linesGradient.length > 0) {
              const stops = linesGradient.slice(0, MAX_GRADIENT_STOPS);
              uniforms.lineGradientCount.value = stops.length;

              stops.forEach((hex, i) => {
                const color = hexToVec3(hex);
                uniforms.lineGradient.value[i].set(color.x, color.y, color.z);
              });
            }

            const material = new THREE.ShaderMaterial({
              uniforms,
              vertexShader: linesVertexShader,
              fragmentShader: linesFragmentShader
            });

            const geometry = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const clock = new THREE.Clock();

            const setSize = () => {
              if (!active) return;
              const width = container.clientWidth || 1;
              const height = container.clientHeight || 1;

              renderer.setSize(width, height, false);

              const canvasWidth = renderer.domElement.width;
              const canvasHeight = renderer.domElement.height;
              uniforms.iResolution.value.set(canvasWidth, canvasHeight, 1);
            };

            setSize();

            const ro = typeof ResizeObserver !== 'undefined'
                ? new ResizeObserver(() => {
                    if (!active) return;
                    setSize();
                  })
                : null;

            if (ro) ro.observe(container);

            const handlePointerMove = event => {
              const rect = renderer.domElement.getBoundingClientRect();
              const x = event.clientX - rect.left;
              const y = event.clientY - rect.top;
              const dpr = renderer.getPixelRatio();

              targetMouseRef.current.set(x * dpr, (rect.height - y) * dpr);
              targetInfluenceRef.current = 1.0;

              if (parallax) {
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const offsetX = (x - centerX) / rect.width;
                const offsetY = -(y - centerY) / rect.height;
                targetParallaxRef.current.set(offsetX * parallaxStrength, offsetY * parallaxStrength);
              }
            };

            const handlePointerLeave = () => {
              targetInfluenceRef.current = 0.0;
            };

            if (interactive) {
              renderer.domElement.addEventListener('pointermove', handlePointerMove);
              renderer.domElement.addEventListener('pointerleave', handlePointerLeave);
            }

            let raf = 0;
            const renderLoop = () => {
              if (!active) return;

              uniforms.iTime.value = clock.getElapsedTime();

              if (interactive) {
                currentMouseRef.current.lerp(targetMouseRef.current, mouseDamping);
                uniforms.iMouse.value.copy(currentMouseRef.current);

                currentInfluenceRef.current += (targetInfluenceRef.current - currentInfluenceRef.current) * mouseDamping;
                uniforms.bendInfluence.value = currentInfluenceRef.current;
              }

              if (parallax) {
                currentParallaxRef.current.lerp(targetParallaxRef.current, mouseDamping);
                uniforms.parallaxOffset.value.copy(currentParallaxRef.current);
              }

              renderer.render(scene, camera);
              raf = requestAnimationFrame(renderLoop);
            };
            renderLoop();

            return () => {
              active = false;
              cancelAnimationFrame(raf);
              if (ro) ro.disconnect();

              if (interactive) {
                renderer.domElement.removeEventListener('pointermove', handlePointerMove);
                renderer.domElement.removeEventListener('pointerleave', handlePointerLeave);
              }

              geometry.dispose();
              material.dispose();
              renderer.dispose();
              renderer.forceContextLoss();
              if (renderer.domElement.parentElement) {
                renderer.domElement.parentElement.removeChild(renderer.domElement);
              }
            };
          }, [
            linesGradient,
            enabledWaves,
            lineCount,
            lineDistance,
            topWavePosition,
            middleWavePosition,
            bottomWavePosition,
            animationSpeed,
            interactive,
            bendRadius,
            bendStrength,
            mouseDamping,
            parallax,
            parallaxStrength
          ]);

          return (
            <div
              ref={containerRef}
              className="canvas-container"
              style={{ mixBlendMode: mixBlendMode }}
            />
          );
        };

        /* =========================================================
           5. TOPOGRAPHY COMPONENT (OGL)
           ========================================================= */
        const colorModeToFloatTopo = mode => {
          if (mode === 'uniform') return 1.0;
          if (mode === 'alternating') return 2.0;
          return 0.0;
        };

        const topoVertex = `#version 300 es
        in vec2 position;
        void main() {
          gl_Position = vec4(position, 0.0, 1.0);
        }
        `;

        const topoFragment = `#version 300 es
        precision highp float;
        uniform vec2 iResolution;
        uniform float iTime;
        uniform float uMorphAmount;
        uniform float uBands;
        uniform float uThickness;
        uniform float uScale;
        uniform float uPixelSize;
        uniform float uGlow;
        uniform float uColorMode;
        uniform float uContrast;
        uniform float uBrightness;
        uniform float uFillBands;
        uniform float uOpacity;
        uniform vec3 uLow;
        uniform vec3 uMid;
        uniform vec3 uHigh;
        uniform vec2 uMouse;
        uniform float uMouseEnabled;
        uniform float uMouseRadius;
        uniform float uMouseStrength;
        uniform float uMouseActive;
        uniform float uGrain;
        uniform float uGrainIntensity;
        uniform vec4 uCtrlA;
        uniform vec4 uCtrlB;
        uniform vec4 uCtrlC;
        uniform vec4 uCtrlD;
        out vec4 fragColor;

        float bez(float t, vec4 c) {
          float w = 6.2831853 * t;
          return 0.5 * (c.x * sin(w) + c.y * cos(w) + c.z * sin(2.0 * w) + c.w * cos(2.0 * w));
        }

        float field(vec2 uv) {
          vec2 a = vec2(bez(uv.x, uCtrlA), bez(uv.x, uCtrlB));
          vec2 b = vec2(bez(uv.y, uCtrlC), bez(uv.y, uCtrlD));
          return distance(a, b);
        }

        vec3 elevationColor(float e) {
          vec3 c = mix(uLow, uMid, smoothstep(0.0, 0.5, e));
          c = mix(c, uHigh, smoothstep(0.5, 1.0, e));
          return c;
        }

        void main() {
          vec2 res = iResolution.xy;
          vec2 uv = gl_FragCoord.xy / res;

          vec2 suv = (uv - 0.5) / max(uScale, 0.001) + 0.5;

          vec2 sampleUv = suv;
          if (uPixelSize > 1.0) {
            vec2 px = res / uPixelSize;
            sampleUv = (floor(suv * px) + 0.5) / px;
          }

          float fv = field(sampleUv);

          if (uMouseEnabled > 0.5) {
            vec2 d = uv - uMouse;
            d.x *= res.x / max(res.y, 1.0);
            float r = max(uMouseRadius, 0.001);
            float bump = exp(-dot(d, d) / (r * r)) * uMouseStrength * uMouseActive;
            fv += bump;
          }

          float f = fv * uBands;
          float frac = fract(f);
          float lineDist = min(frac, 1.0 - frac);

          float aa = fwidth(f) + 0.0001;
          float mask = 1.0 - smoothstep(uThickness - aa, uThickness + aa, lineDist);

          float glowR = uThickness + uGlow * 0.5 + aa;
          float glow = (1.0 - smoothstep(uThickness, glowR, lineDist)) * step(0.0001, uGlow);

          float elev = clamp(fv / (uMorphAmount * 2.5 + 0.001), 0.0, 1.0);

          vec3 lineCol;
          if (uColorMode < 0.5) {
            lineCol = elevationColor(elev);
          } else if (uColorMode < 1.5) {
            lineCol = uMid;
          } else {
            float parity = mod(floor(f), 2.0);
            lineCol = mix(uMid, uHigh, parity);
          }

          float coverage = clamp(mask + glow * 0.55, 0.0, 1.0);
          coverage = pow(coverage, max(uContrast, 0.001));

          vec3 outColor = lineCol;
          float outAlpha = coverage;

          if (uFillBands > 0.5) {
            vec3 fillCol = elevationColor(elev);
            float fillA = 0.1 * elev;
            outColor = mix(fillCol, lineCol, coverage);
            outAlpha = clamp(coverage + fillA, 0.0, 1.0);
          }

          if (uGrain > 0.5) {
            float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + iTime) * 43758.5453);
            outAlpha += (g - 0.5) * uGrainIntensity;
          }

          outColor *= uBrightness;
          outColor = clamp(outColor, 0.0, 1.0);

          float a = clamp(outAlpha, 0.0, 1.0) * uOpacity;
          fragColor = vec4(outColor * a, a);
        }
        `;

        const CTRL_INDICES = [
          [1, -2, 3, -4],
          [9, -8, 7, -6],
          [5, 2, 5, -5],
          [-1, -3, 8, 9]
        ];

        const Topography = ({
          lowColor = '#5227FF',
          midColor = '#FF9FFC',
          highColor = '#FFFFFF',
          speed = 0.35,
          morphAmount = 3.0,
          morphSpeed = 0.05,
          bands = 2.0,
          thickness = 0.01,
          scale = 1.0,
          pixelSize = 1.0,
          glow = 0.5,
          colorMode = 'elevation',
          contrast = 3.0,
          brightness = 1.0,
          fillBands = false,
          opacity = 1.0,
          grain = true,
          grainIntensity = 0.05,
          mouseInteraction = true,
          mouseRadius = 0.3,
          mouseStrength = 0.4,
          className = ''
        }) => {
          const containerRef = useRef(null);

          useEffect(() => {
            const container = containerRef.current;
            if (!container) return;

            const renderer = new Renderer({
              webgl: 2,
              alpha: true,
              premultipliedAlpha: true,
              antialias: false,
              dpr: Math.min(window.devicePixelRatio || 1, 2)
            });

            const gl = renderer.gl;
            gl.clearColor(0, 0, 0, 0);
            const canvas = gl.canvas;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.display = 'block';
            container.appendChild(canvas);

            const geometry = new Triangle(gl);
            const program = new Program(gl, {
              vertex: topoVertex,
              fragment: topoFragment,
              uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new Float32Array([1, 1]) },
                uSpeed: { value: speed },
                uMorphAmount: { value: morphAmount },
                uMorphSpeed: { value: morphSpeed },
                uBands: { value: bands },
                uThickness: { value: thickness },
                uScale: { value: scale },
                uPixelSize: { value: pixelSize },
                uGlow: { value: glow },
                uColorMode: { value: colorModeToFloatTopo(colorMode) },
                uContrast: { value: contrast },
                uBrightness: { value: brightness },
                uFillBands: { value: fillBands ? 1.0 : 0.0 },
                uOpacity: { value: opacity },
                uGrain: { value: grain ? 1.0 : 0.0 },
                uGrainIntensity: { value: grainIntensity },
                uLow: { value: new Float32Array(hexToRgb(lowColor)) },
                uMid: { value: new Float32Array(hexToRgb(midColor)) },
                uHigh: { value: new Float32Array(hexToRgb(highColor)) },
                uMouse: { value: new Float32Array([0.5, 0.5]) },
                uMouseEnabled: { value: mouseInteraction ? 1.0 : 0.0 },
                uMouseRadius: { value: mouseRadius },
                uMouseStrength: { value: mouseStrength },
                uMouseActive: { value: 0.0 },
                uCtrlA: { value: new Float32Array([0, 0, 0, 0]) },
                uCtrlB: { value: new Float32Array([0, 0, 0, 0]) },
                uCtrlC: { value: new Float32Array([0, 0, 0, 0]) },
                uCtrlD: { value: new Float32Array([0, 0, 0, 0]) }
              }
            });

            const mesh = new OGLMesh(gl, { geometry, program });
            ctxMap.set(container, { renderer, program, mesh });

            const setSize = () => {
              const rect = container.getBoundingClientRect();
              const w = Math.max(1, Math.floor(rect.width));
              const h = Math.max(1, Math.floor(rect.height));
              renderer.setSize(w, h);
              const res = program.uniforms.iResolution.value;
              res[0] = gl.drawingBufferWidth;
              res[1] = gl.drawingBufferHeight;
              renderer.render({ scene: mesh });
            };

            const ro = new ResizeObserver(setSize);
            ro.observe(container);
            setSize();

            const currentMouse = [0.5, 0.5];
            const targetMouse = [0.5, 0.5];
            let mouseActive = 0;
            let mouseActiveTarget = 0;

            const onMouseMove = e => {
              const rect = canvas.getBoundingClientRect();
              targetMouse[0] = (e.clientX - rect.left) / rect.width;
              targetMouse[1] = 1.0 - (e.clientY - rect.top) / rect.height;
              mouseActiveTarget = 1;
            };
            const onMouseLeave = () => {
              mouseActiveTarget = 0;
            };
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseleave', onMouseLeave);

            const ctrlArrays = [
              program.uniforms.uCtrlA.value,
              program.uniforms.uCtrlB.value,
              program.uniforms.uCtrlC.value,
              program.uniforms.uCtrlD.value
            ];

            let raf = 0;
            let isVisible = true;
            let isPageVisible = !document.hidden;
            const t0 = performance.now();

            const loop = t => {
              const time = (t - t0) * 0.001;
              const u = program.uniforms;
              u.iTime.value = time;

              const ma = u.uMorphAmount.value;
              const sp = u.uSpeed.value;
              const msp = u.uMorphSpeed.value;
              for (let g = 0; g < 4; g++) {
                const arr = ctrlArrays[g];
                const idx = CTRL_INDICES[g];
                for (let j = 0; j < 4; j++) {
                  const i = idx[j];
                  arr[j] = ma * Math.sin(time * sp * Math.sin(i * msp) + i);
                }
              }

              currentMouse[0] += 0.05 * (targetMouse[0] - currentMouse[0]);
              currentMouse[1] += 0.05 * (targetMouse[1] - currentMouse[1]);
              u.uMouse.value[0] = currentMouse[0];
              u.uMouse.value[1] = currentMouse[1];

              mouseActive += 0.05 * (mouseActiveTarget - mouseActive);
              u.uMouseActive.value = mouseActive;

              renderer.render({ scene: mesh });
              raf = requestAnimationFrame(loop);
            };

            const tryStart = () => {
              if (isVisible && isPageVisible && raf === 0) raf = requestAnimationFrame(loop);
            };
            const tryStop = () => {
              if (raf !== 0) {
                cancelAnimationFrame(raf);
                raf = 0;
              }
            };

            const io = new IntersectionObserver(
              ([entry]) => {
                isVisible = entry.isIntersecting;
                isVisible ? tryStart() : tryStop();
              },
              { threshold: 0 }
            );
            io.observe(container);

            const onVisibility = () => {
              isPageVisible = !document.hidden;
              isPageVisible ? tryStart() : tryStop();
            };
            document.addEventListener('visibilitychange', onVisibility);

            tryStart();

            return () => {
              tryStop();
              ro.disconnect();
              io.disconnect();
              document.removeEventListener('visibilitychange', onVisibility);
              canvas.removeEventListener('mousemove', onMouseMove);
              canvas.removeEventListener('mouseleave', onMouseLeave);
              ctxMap.delete(container);
              try {
                container.removeChild(canvas);
              } catch {}
              gl.getExtension('WEBGL_lose_context')?.loseContext();
            };
          }, []);

          return <div ref={containerRef} className={`canvas-container ${className}`.trim()} />;
        };

        /* =========================================================
           6. WEB THREADS COMPONENT (OGL)
           ========================================================= */
        const FAN_MODE = { center: 0, left: 1, right: 2 };

        const threadsVertex = `#version 300 es
        in vec2 position;
        void main() {
          gl_Position = vec4(position, 0.0, 1.0);
        }
        `;

        const threadsFragment = `#version 300 es
        precision highp float;
        uniform vec2 iResolution;
        uniform float iTime;
        uniform float uSpeed;
        uniform float uThreadCount;
        uniform float uFrequency;
        uniform float uSpread;
        uniform float uTaper;
        uniform float uPosition;
        uniform float uFanMode;
        uniform float uGlow;
        uniform float uFalloff;
        uniform float uThickness;
        uniform float uBrightness;
        uniform float uOpacity;
        uniform float uMirror;
        uniform float uShimmer;
        uniform float uGrain;
        uniform float uGrainIntensity;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform vec2 uMouse;
        uniform float uMouseStrength;
        uniform float uEnableMouse;
        uniform float uMouseActive;
        out vec4 fragColor;

        #define TAU 6.28318530718
        #define MAX_THREADS 10

        float glow(float x, float str, float dist) {
          return dist / pow(max(x, 1e-4), str);
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / iResolution.xy;
          float n = max(uThreadCount, 1.0);

          float pinchX = uFanMode < 0.5 ? 0.5 : (uFanMode < 1.5 ? 0.0 : 1.0);
          if (uEnableMouse > 0.5) {
            pinchX = mix(pinchX, uMouse.x, clamp(uMouseStrength, 0.0, 1.0) * uMouseActive);
          }

          float spreadDx = uSpread * abs(uv.x - pinchX);
          float baseT = iTime * uSpeed;
          float tauOverN = TAU / n;
          float mirror = uMirror > 0.5 ? sign(pinchX - uv.x) : 1.0;
          bool doShimmer = uShimmer > 0.5;
          float shimmerT = iTime * 1.7;
          float invThickness = 1.0 / max(uThickness, 0.01);
          float xFreq = uv.x * uFrequency;
          float yOff = uv.y - uPosition;
          float ciScale = n > 1.0 ? 1.0 / (n - 1.0) : 0.0;

          vec3 col = vec3(0.0);
          float gsum = 0.0;

          for (int idx = 0; idx < MAX_THREADS; idx++) {
            float i = float(idx);
            if (i >= n) break;

            float amplitude = spreadDx * (1.0 + i * uTaper);
            float shimmer = doShimmer ? sin(shimmerT + i * 1.3) * 0.35 : 0.0;
            float phase = (baseT + i * tauOverN) * mirror + shimmer;

            float sdf = abs(yOff + sin(xFreq + phase) * amplitude) * invThickness;

            float g = glow(sdf, uFalloff, uGlow);
            float ci = i * ciScale;
            vec3 threadCol = mix(uColor1, uColor2, ci);

            col += g * threadCol;
            gsum += g;
          }

          float coreAmt = smoothstep(0.5, 2.2, gsum);
          col = mix(col, uColor3 * gsum, coreAmt * 0.5);

          float bright = uBrightness;
          if (uEnableMouse > 0.5) {
            vec2 md = uv - uMouse;
            float d2 = dot(md, md);
            bright += clamp(uMouseStrength, 0.0, 1.0) * uMouseActive * exp(-d2 * 6.0) * 0.6;
          }
          col *= bright;

          float alpha = clamp(gsum, 0.0, 1.0) * uOpacity;

          vec3 outRgb = col * alpha;

          if (uGrain > 0.5) {
            float gv = (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + iTime) * 43758.5453) - 0.5) * uGrainIntensity;
            outRgb = clamp(outRgb + gv, 0.0, 1.0);
            alpha = clamp(alpha + gv, 0.0, 1.0);
          }

          fragColor = vec4(outRgb, alpha);
        }
        `;

        const WebThreads = ({
          color1 = '#5227FF',
          color2 = '#FF9FFC',
          color3 = '#FFFFFF',
          speed = 0.2,
          threadCount = 6,
          frequency = 5.0,
          spread = 0.18,
          taper = 1.0,
          position = 0.5,
          fanMode = 'center',
          glow = 0.02,
          falloff = 0.6,
          thickness = 1.1,
          brightness = 0.6,
          opacity = 1.0,
          mirror = true,
          shimmer = false,
          grain = true,
          grainIntensity = 0.05,
          mouseInteraction = true,
          mouseStrength = 0.3,
          className = ''
        }) => {
          const containerRef = useRef(null);
          const mouseRef = useRef({ enabled: true, strength: 0.3 });

          useEffect(() => {
            const container = containerRef.current;
            if (!container) return;

            const renderer = new Renderer({
              webgl: 2,
              alpha: true,
              premultipliedAlpha: true,
              antialias: false,
              dpr: Math.min(window.devicePixelRatio || 1, 2)
            });

            const gl = renderer.gl;
            gl.clearColor(0, 0, 0, 0);
            const canvas = gl.canvas;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.display = 'block';
            container.appendChild(canvas);

            const geometry = new Triangle(gl);
            const program = new Program(gl, {
              vertex: threadsVertex,
              fragment: threadsFragment,
              uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new Float32Array([1, 1]) },
                uSpeed: { value: speed },
                uThreadCount: { value: threadCount },
                uFrequency: { value: frequency },
                uSpread: { value: spread },
                uTaper: { value: taper },
                uPosition: { value: position },
                uFanMode: { value: FAN_MODE[fanMode] ?? 0 },
                uGlow: { value: glow },
                uFalloff: { value: falloff },
                uThickness: { value: thickness },
                uBrightness: { value: brightness },
                uOpacity: { value: opacity },
                uMirror: { value: mirror ? 1.0 : 0.0 },
                uShimmer: { value: shimmer ? 1.0 : 0.0 },
                uGrain: { value: grain ? 1.0 : 0.0 },
                uGrainIntensity: { value: grainIntensity },
                uColor1: { value: new Float32Array(hexToRgb(color1)) },
                uColor2: { value: new Float32Array(hexToRgb(color2)) },
                uColor3: { value: new Float32Array(hexToRgb(color3)) },
                uMouse: { value: new Float32Array([0.5, 0.5]) },
                uMouseStrength: { value: mouseStrength },
                uEnableMouse: { value: mouseInteraction ? 1.0 : 0.0 },
                uMouseActive: { value: 0 }
              }
            });

            const mesh = new OGLMesh(gl, { geometry, program });
            ctxMap.set(container, { renderer, program, mesh });

            const setSize = () => {
              const rect = container.getBoundingClientRect();
              const w = Math.max(1, Math.floor(rect.width));
              const h = Math.max(1, Math.floor(rect.height));
              renderer.setSize(w, h);
              const res = program.uniforms.iResolution.value;
              res[0] = gl.drawingBufferWidth;
              res[1] = gl.drawingBufferHeight;
              renderer.render({ scene: mesh });
            };

            const ro = new ResizeObserver(setSize);
            ro.observe(container);
            setSize();

            const currentMouse = [0.5, 0.5];
            const targetMouse = [0.5, 0.5];
            let currentActive = 0;
            let targetActive = 0;

            const onMouseMove = e => {
              const rect = canvas.getBoundingClientRect();
              targetMouse[0] = (e.clientX - rect.left) / rect.width;
              targetMouse[1] = 1.0 - (e.clientY - rect.top) / rect.height;
              targetActive = 1;
            };
            const onMouseEnter = () => {
              targetActive = 1;
            };
            const onMouseLeave = () => {
              targetActive = 0;
            };
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseenter', onMouseEnter);
            canvas.addEventListener('mouseleave', onMouseLeave);

            let raf = 0;
            let isVisible = true;
            let isPageVisible = !document.hidden;
            const t0 = performance.now();

            const loop = t => {
              program.uniforms.iTime.value = (t - t0) * 0.001;
              currentMouse[0] += 0.05 * (targetMouse[0] - currentMouse[0]);
              currentMouse[1] += 0.05 * (targetMouse[1] - currentMouse[1]);
              currentActive += 0.05 * (targetActive - currentActive);
              program.uniforms.uMouse.value[0] = currentMouse[0];
              program.uniforms.uMouse.value[1] = currentMouse[1];
              program.uniforms.uMouseActive.value = currentActive;
              program.uniforms.uEnableMouse.value = mouseRef.current.enabled ? 1.0 : 0.0;
              program.uniforms.uMouseStrength.value = mouseRef.current.strength;
              renderer.render({ scene: mesh });
              raf = requestAnimationFrame(loop);
            };

            const tryStart = () => {
              if (isVisible && isPageVisible && raf === 0) raf = requestAnimationFrame(loop);
            };
            const tryStop = () => {
              if (raf !== 0) {
                cancelAnimationFrame(raf);
                raf = 0;
              }
            };

            const io = new IntersectionObserver(
              ([entry]) => {
                isVisible = entry.isIntersecting;
                isVisible ? tryStart() : tryStop();
              },
              { threshold: 0 }
            );
            io.observe(container);

            const onVisibility = () => {
              isPageVisible = !document.hidden;
              isPageVisible ? tryStart() : tryStop();
            };
            document.addEventListener('visibilitychange', onVisibility);

            tryStart();

            return () => {
              tryStop();
              ro.disconnect();
              io.disconnect();
              document.removeEventListener('visibilitychange', onVisibility);
              canvas.removeEventListener('mousemove', onMouseMove);
              canvas.removeEventListener('mouseenter', onMouseEnter);
              canvas.removeEventListener('mouseleave', onMouseLeave);
              ctxMap.delete(container);
              try {
                container.removeChild(canvas);
              } catch {}
              gl.getExtension('WEBGL_lose_context')?.loseContext();
            };
          }, []);

          return <div ref={containerRef} className={`canvas-container ${className}`.trim()} />;
        };

        /* =========================================================
           7. GALAXY COMPONENT (OGL)
           ========================================================= */
        const galaxyVertex = `
        attribute vec2 uv;
        attribute vec2 position;

        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = vec4(position, 0, 1);
        }
        `;

        const galaxyFragment = `
        precision highp float;

        uniform float uTime;
        uniform vec3 uResolution;
        uniform vec2 uFocal;
        uniform vec2 uRotation;
        uniform float uStarSpeed;
        uniform float uDensity;
        uniform float uHueShift;
        uniform float uSpeed;
        uniform vec2 uMouse;
        uniform float uGlowIntensity;
        uniform float uSaturation;
        uniform bool uMouseRepulsion;
        uniform float uTwinkleIntensity;
        uniform float uRotationSpeed;
        uniform float uRepulsionStrength;
        uniform float uMouseActiveFactor;
        uniform float uAutoCenterRepulsion;
        uniform bool uTransparent;

        varying vec2 vUv;

        #define NUM_LAYER 4.0
        #define STAR_COLOR_CUTOFF 0.2
        #define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
        #define PERIOD 3.0

        float Hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float tri(float x) {
          return abs(fract(x) * 2.0 - 1.0);
        }

        float tris(float x) {
          float t = fract(x);
          return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0));
        }

        float trisn(float x) {
          float t = fract(x);
          return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0;
        }

        vec3 hsv2rgb(vec3 c) {
          vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
          vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
          return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        float Star(vec2 uv, float flare) {
          float d = length(uv);
          float m = (0.05 * uGlowIntensity) / d;
          float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
          m += rays * flare * uGlowIntensity;
          uv *= MAT45;
          rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
          m += rays * 0.3 * flare * uGlowIntensity;
          m *= smoothstep(1.0, 0.2, d);
          return m;
        }

        vec3 StarLayer(vec2 uv) {
          vec3 col = vec3(0.0);

          vec2 gv = fract(uv) - 0.5; 
          vec2 id = floor(uv);

          for (int y = -1; y <= 1; y++) {
            for (int x = -1; x <= 1; x++) {
              vec2 offset = vec2(float(x), float(y));
              vec2 si = id + vec2(float(x), float(y));
              float seed = Hash21(si);
              float size = fract(seed * 345.32);
              float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
              float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;

              float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
              float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
              float grn = min(red, blu) * seed;
              vec3 base = vec3(red, grn, blu);
              
              float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
              hue = fract(hue + uHueShift / 360.0);
              float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
              float val = max(max(base.r, base.g), base.b);
              base = hsv2rgb(vec3(hue, sat, val));

              vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;

              float star = Star(gv - offset - pad, flareSize);
              vec3 color = base;

              float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
              twinkle = mix(1.0, twinkle, uTwinkleIntensity);
              star *= twinkle;
              
              col += star * size * color;
            }
          }

          return col;
        }

        void main() {
          vec2 focalPx = uFocal * uResolution.xy;
          vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;

          vec2 mouseNorm = uMouse - vec2(0.5);
          
          if (uAutoCenterRepulsion > 0.0) {
            vec2 centerUV = vec2(0.0, 0.0);
            float centerDist = length(uv - centerUV);
            vec2 repulsion = normalize(uv - centerUV) * (uAutoCenterRepulsion / (centerDist + 0.1));
            uv += repulsion * 0.05;
          } else if (uMouseRepulsion) {
            vec2 mousePosUV = (uMouse * uResolution.xy - focalPx) / uResolution.y;
            float mouseDist = length(uv - mousePosUV);
            vec2 repulsion = normalize(uv - mousePosUV) * (uRepulsionStrength / (mouseDist + 0.1));
            uv += repulsion * 0.05 * uMouseActiveFactor;
          } else {
            vec2 mouseOffset = mouseNorm * 0.1 * uMouseActiveFactor;
            uv += mouseOffset;
          }

          float autoRotAngle = uTime * uRotationSpeed;
          mat2 autoRot = mat2(cos(autoRotAngle), -sin(autoRotAngle), sin(autoRotAngle), cos(autoRotAngle));
          uv = autoRot * uv;

          uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;

          vec3 col = vec3(0.0);

          for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
            float depth = fract(i + uStarSpeed * uSpeed);
            float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
            float fade = depth * smoothstep(1.0, 0.9, depth);
            col += StarLayer(uv * scale + i * 453.32) * fade;
          }

          if (uTransparent) {
            float alpha = length(col);
            alpha = smoothstep(0.0, 0.3, alpha);
            alpha = min(alpha, 1.0);
            gl_FragColor = vec4(col, alpha);
          } else {
            gl_FragColor = vec4(col, 1.0);
          }
        }
        `;

        const Galaxy = ({
          focal = [0.5, 0.5],
          rotation = [1.0, 0.0],
          starSpeed = 0.5,
          density = 1,
          hueShift = 140,
          disableAnimation = false,
          speed = 1.0,
          mouseInteraction = false,
          glowIntensity = 0.3,
          saturation = 2.7,
          mouseRepulsion = true,
          repulsionStrength = 2,
          twinkleIntensity = 0.3,
          rotationSpeed = 0.1,
          autoCenterRepulsion = 0,
          transparent = true,
          className = ''
        }) => {
          const ctnDom = useRef(null);
          const targetMousePos = useRef({ x: 0.5, y: 0.5 });
          const smoothMousePos = useRef({ x: 0.5, y: 0.5 });
          const targetMouseActive = useRef(0.0);
          const smoothMouseActive = useRef(0.0);

          useEffect(() => {
            if (!ctnDom.current) return;
            const ctn = ctnDom.current;
            const renderer = new Renderer({
              alpha: transparent,
              premultipliedAlpha: false
            });
            const gl = renderer.gl;

            if (transparent) {
              gl.enable(gl.BLEND);
              gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
              gl.clearColor(0, 0, 0, 0);
            } else {
              gl.clearColor(0, 0, 0, 1);
            }

            let program;

            function resize() {
              renderer.setSize(ctn.offsetWidth, ctn.offsetHeight);
              if (program) {
                program.uniforms.uResolution.value = new Color(
                  gl.canvas.width,
                  gl.canvas.height,
                  gl.canvas.width / gl.canvas.height
                );
              }
            }
            const ro = new ResizeObserver(resize);
            ro.observe(ctn);
            resize();

            const geometry = new Triangle(gl);
            program = new Program(gl, {
              vertex: galaxyVertex,
              fragment: galaxyFragment,
              uniforms: {
                uTime: { value: 0 },
                uResolution: {
                  value: new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height)
                },
                uFocal: { value: new Float32Array(focal) },
                uRotation: { value: new Float32Array(rotation) },
                uStarSpeed: { value: starSpeed },
                uDensity: { value: density },
                uHueShift: { value: hueShift },
                uSpeed: { value: speed },
                uMouse: {
                  value: new Float32Array([smoothMousePos.current.x, smoothMousePos.current.y])
                },
                uGlowIntensity: { value: glowIntensity },
                uSaturation: { value: saturation },
                uMouseRepulsion: { value: mouseRepulsion },
                uTwinkleIntensity: { value: twinkleIntensity },
                uRotationSpeed: { value: rotationSpeed },
                uRepulsionStrength: { value: repulsionStrength },
                uMouseActiveFactor: { value: 0.0 },
                uAutoCenterRepulsion: { value: autoCenterRepulsion },
                uTransparent: { value: transparent }
              }
            });

            const mesh = new OGLMesh(gl, { geometry, program });
            let animateId;

            function update(t) {
              animateId = requestAnimationFrame(update);
              if (!disableAnimation) {
                program.uniforms.uTime.value = t * 0.001;
                program.uniforms.uStarSpeed.value = (t * 0.001 * starSpeed) / 10.0;
              }

              const lerpFactor = 0.05;
              smoothMousePos.current.x += (targetMousePos.current.x - smoothMousePos.current.x) * lerpFactor;
              smoothMousePos.current.y += (targetMousePos.current.y - smoothMousePos.current.y) * lerpFactor;

              smoothMouseActive.current += (targetMouseActive.current - smoothMouseActive.current) * lerpFactor;

              program.uniforms.uMouse.value[0] = smoothMousePos.current.x;
              program.uniforms.uMouse.value[1] = smoothMousePos.current.y;
              program.uniforms.uMouseActiveFactor.value = smoothMouseActive.current;

              renderer.render({ scene: mesh });
            }
            animateId = requestAnimationFrame(update);
            ctn.appendChild(gl.canvas);

            function handleMouseMove(e) {
              const rect = ctn.getBoundingClientRect();
              const x = (e.clientX - rect.left) / rect.width;
              const y = 1.0 - (e.clientY - rect.top) / rect.height;
              targetMousePos.current = { x, y };
              targetMouseActive.current = 1.0;
            }

            function handleMouseLeave() {
              targetMouseActive.current = 0.0;
            }

            if (mouseInteraction) {
              ctn.addEventListener('mousemove', handleMouseMove);
              ctn.addEventListener('mouseleave', handleMouseLeave);
            }

            return () => {
              cancelAnimationFrame(animateId);
              ro.disconnect();
              if (mouseInteraction) {
                ctn.removeEventListener('mousemove', handleMouseMove);
                ctn.removeEventListener('mouseleave', handleMouseLeave);
              }
              try {
                ctn.removeChild(gl.canvas);
              } catch {}
              gl.getExtension('WEBGL_lose_context')?.loseContext();
            };
          }, []);

          return <div ref={ctnDom} className={`canvas-container ${className}`.trim()} />;
        };

        /* =========================================================
           8. GRADIENT BLINDS COMPONENT (OGL)
           ========================================================= */
        const MAX_COLORS = 8;
        const prepStops = stops => {
          const base = (stops && stops.length ? stops : ['#FF9FFC', '#5227FF']).slice(0, MAX_COLORS);
          if (base.length === 1) base.push(base[0]);
          while (base.length < MAX_COLORS) base.push(base[base.length - 1]);
          const arr = [];
          for (let i = 0; i < MAX_COLORS; i++) arr.push(hexToRgb(base[i]));
          const count = Math.max(2, Math.min(MAX_COLORS, stops?.length ?? 2));
          return { arr, count };
        };

        const GradientBlinds = ({
          className = '',
          dpr,
          paused = false,
          gradientColors = ['#FF9FFC', '#5227FF'],
          angle = 0,
          noise = 0,
          blindCount = 16,
          blindMinWidth = 60,
          mouseDampening = 0.15,
          mirrorGradient = false,
          spotlightRadius = 0.5,
          spotlightSoftness = 1,
          spotlightOpacity = 0.5,
          distortAmount = 0,
          shineDirection = 'left',
          mixBlendMode = 'lighten'
        }) => {
          const containerRef = useRef(null);
          const rafRef = useRef(null);
          const programRef = useRef(null);
          const meshRef = useRef(null);
          const geometryRef = useRef(null);
          const rendererRef = useRef(null);
          const mouseTargetRef = useRef([0, 0]);
          const lastTimeRef = useRef(0);
          const firstResizeRef = useRef(true);

          useEffect(() => {
            const container = containerRef.current;
            if (!container) return;

            const renderer = new Renderer({
              dpr: dpr ?? (typeof window !== 'undefined' ? window.devicePixelRatio || 1 : 1),
              alpha: true,
              antialias: true
            });
            rendererRef.current = renderer;
            const gl = renderer.gl;
            const canvas = gl.canvas;

            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.display = 'block';
            container.appendChild(canvas);

            const vertex = `
            attribute vec2 position;
            attribute vec2 uv;
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = vec4(position, 0.0, 1.0);
            }
            `;

            const fragment = `
            #ifdef GL_ES
            precision mediump float;
            #endif

            uniform vec3  iResolution;
            uniform vec2  iMouse;
            uniform float iTime;

            uniform float uAngle;
            uniform float uNoise;
            uniform float uBlindCount;
            uniform float uSpotlightRadius;
            uniform float uSpotlightSoftness;
            uniform float uSpotlightOpacity;
            uniform float uMirror;
            uniform float uDistort;
            uniform float uShineFlip;
            uniform vec3  uColor0;
            uniform vec3  uColor1;
            uniform vec3  uColor2;
            uniform vec3  uColor3;
            uniform vec3  uColor4;
            uniform vec3  uColor5;
            uniform vec3  uColor6;
            uniform vec3  uColor7;
            uniform int   uColorCount;

            varying vec2 vUv;

            float rand(vec2 co){
              return fract(sin(dot(co, vec2(12.9898,78.233))) * 43758.5453);
            }

            vec2 rotate2D(vec2 p, float a){
              float c = cos(a);
              float s = sin(a);
              return mat2(c, -s, s, c) * p;
            }

            vec3 getGradientColor(float t){
              float tt = clamp(t, 0.0, 1.0);
              int count = uColorCount;
              if (count < 2) count = 2;
              float scaled = tt * float(count - 1);
              float seg = floor(scaled);
              float f = fract(scaled);

              if (seg < 1.0) return mix(uColor0, uColor1, f);
              if (seg < 2.0 && count > 2) return mix(uColor1, uColor2, f);
              if (seg < 3.0 && count > 3) return mix(uColor2, uColor3, f);
              if (seg < 4.0 && count > 4) return mix(uColor3, uColor4, f);
              if (seg < 5.0 && count > 5) return mix(uColor4, uColor5, f);
              if (seg < 6.0 && count > 6) return mix(uColor5, uColor6, f);
              if (seg < 7.0 && count > 7) return mix(uColor6, uColor7, f);
              if (count > 7) return uColor7;
              if (count > 6) return uColor6;
              if (count > 5) return uColor5;
              if (count > 4) return uColor4;
              if (count > 3) return uColor3;
              if (count > 2) return uColor2;
              return uColor1;
            }

            void mainImage( out vec4 fragColor, in vec2 fragCoord )
            {
                vec2 uv0 = fragCoord.xy / iResolution.xy;

                float aspect = iResolution.x / iResolution.y;
                vec2 p = uv0 * 2.0 - 1.0;
                p.x *= aspect;
                vec2 pr = rotate2D(p, uAngle);
                pr.x /= aspect;
                vec2 uv = pr * 0.5 + 0.5;

                vec2 uvMod = uv;
                if (uDistort > 0.0) {
                  float a = uvMod.y * 6.0;
                  float b = uvMod.x * 6.0;
                  float w = 0.01 * uDistort;
                  uvMod.x += sin(a) * w;
                  uvMod.y += cos(b) * w;
                }
                float t = uvMod.x;
                if (uMirror > 0.5) {
                  t = 1.0 - abs(1.0 - 2.0 * fract(t));
                }
                vec3 base = getGradientColor(t);

                vec2 offset = vec2(iMouse.x/iResolution.x, iMouse.y/iResolution.y);
              float d = length(uv0 - offset);
              float r = max(uSpotlightRadius, 1e-4);
              float dn = d / r;
              float spot = (1.0 - 2.0 * pow(dn, uSpotlightSoftness)) * uSpotlightOpacity;
              vec3 cir = vec3(spot);
              float stripe = fract(uvMod.x * max(uBlindCount, 1.0));
              if (uShineFlip > 0.5) stripe = 1.0 - stripe;
                vec3 ran = vec3(stripe);

                vec3 col = cir + base - ran;
                col += (rand(gl_FragCoord.xy + iTime) - 0.5) * uNoise;

                fragColor = vec4(col, 1.0);
            }

            void main() {
                vec4 color;
                mainImage(color, vUv * iResolution.xy);
                gl_FragColor = color;
            }
            `;

            const { arr: colorArr, count: colorCount } = prepStops(gradientColors);
            const uniforms = {
              iResolution: {
                value: [gl.drawingBufferWidth, gl.drawingBufferHeight, 1]
              },
              iMouse: { value: [0, 0] },
              iTime: { value: 0 },
              uAngle: { value: (angle * Math.PI) / 180 },
              uNoise: { value: noise },
              uBlindCount: { value: Math.max(1, blindCount) },
              uSpotlightRadius: { value: spotlightRadius },
              uSpotlightSoftness: { value: spotlightSoftness },
              uSpotlightOpacity: { value: spotlightOpacity },
              uMirror: { value: mirrorGradient ? 1 : 0 },
              uDistort: { value: distortAmount },
              uShineFlip: { value: shineDirection === 'right' ? 1 : 0 },
              uColor0: { value: colorArr[0] },
              uColor1: { value: colorArr[1] },
              uColor2: { value: colorArr[2] },
              uColor3: { value: colorArr[3] },
              uColor4: { value: colorArr[4] },
              uColor5: { value: colorArr[5] },
              uColor6: { value: colorArr[6] },
              uColor7: { value: colorArr[7] },
              uColorCount: { value: colorCount }
            };

            const program = new Program(gl, {
              vertex,
              fragment,
              uniforms
            });
            programRef.current = program;

            const geometry = new Triangle(gl);
            geometryRef.current = geometry;
            const mesh = new OGLMesh(gl, { geometry, program });
            meshRef.current = mesh;

            const resize = () => {
              const rect = container.getBoundingClientRect();
              renderer.setSize(rect.width, rect.height);
              uniforms.iResolution.value = [gl.drawingBufferWidth, gl.drawingBufferHeight, 1];

              if (blindMinWidth && blindMinWidth > 0) {
                const maxByMinWidth = Math.max(1, Math.floor(rect.width / blindMinWidth));

                const effective = blindCount ? Math.min(blindCount, maxByMinWidth) : maxByMinWidth;
                uniforms.uBlindCount.value = Math.max(1, effective);
              } else {
                uniforms.uBlindCount.value = Math.max(1, blindCount);
              }

              if (firstResizeRef.current) {
                firstResizeRef.current = false;
                const cx = gl.drawingBufferWidth / 2;
                const cy = gl.drawingBufferHeight / 2;
                uniforms.iMouse.value = [cx, cy];
                mouseTargetRef.current = [cx, cy];
              }
            };

            resize();
            const ro = new ResizeObserver(resize);
            ro.observe(container);

            const onPointerMove = e => {
              const rect = canvas.getBoundingClientRect();
              const scale = renderer.dpr || 1;
              const x = (e.clientX - rect.left) * scale;
              const y = (rect.height - (e.clientY - rect.top)) * scale;
              mouseTargetRef.current = [x, y];
              if (mouseDampening <= 0) {
                uniforms.iMouse.value = [x, y];
              }
            };
            canvas.addEventListener('pointermove', onPointerMove);

            const loop = t => {
              rafRef.current = requestAnimationFrame(loop);
              uniforms.iTime.value = t * 0.001;
              if (mouseDampening > 0) {
                if (!lastTimeRef.current) lastTimeRef.current = t;
                const dt = (t - lastTimeRef.current) / 1000;
                lastTimeRef.current = t;
                const tau = Math.max(1e-4, mouseDampening);
                let factor = 1 - Math.exp(-dt / tau);
                if (factor > 1) factor = 1;
                const target = mouseTargetRef.current;
                const cur = uniforms.iMouse.value;
                cur[0] += (target[0] - cur[0]) * factor;
                cur[1] += (target[1] - cur[1]) * factor;
              } else {
                lastTimeRef.current = t;
              }
              if (!paused && programRef.current && meshRef.current) {
                try {
                  renderer.render({ scene: meshRef.current });
                } catch (e) {
                  console.error(e);
                }
              }
            };
            rafRef.current = requestAnimationFrame(loop);

            return () => {
              if (rafRef.current) cancelAnimationFrame(rafRef.current);
              canvas.removeEventListener('pointermove', onPointerMove);
              ro.disconnect();
              if (canvas.parentElement === container) {
                container.removeChild(canvas);
              }
              try {
                gl.getExtension('WEBGL_lose_context')?.loseContext();
              } catch {}
            };
          }, [
            dpr,
            paused,
            gradientColors,
            angle,
            noise,
            blindCount,
            blindMinWidth,
            mouseDampening,
            mirrorGradient,
            spotlightRadius,
            spotlightSoftness,
            spotlightOpacity,
            distortAmount,
            shineDirection
          ]);

          return (
            <div
              ref={containerRef}
              className={`canvas-container ${className}`}
              style={{
                ...(mixBlendMode && { mixBlendMode })
              }}
            />
          );
        };

        /* =========================================================
           9. LIGHT PILLAR COMPONENT (THREE.JS)
           ========================================================= */
        const LightPillar = ({
          topColor = '#5227FF',
          bottomColor = '#FF9FFC',
          intensity = 1.0,
          rotationSpeed = 0.3,
          interactive = false,
          className = '',
          glowAmount = 0.005,
          pillarWidth = 3.0,
          pillarHeight = 0.4,
          noiseIntensity = 0,
          mixBlendMode = 'screen',
          pillarRotation = 0,
          quality = 'high'
        }) => {
          const containerRef = useRef(null);
          const rafRef = useRef(null);
          const rendererRef = useRef(null);
          const materialRef = useRef(null);
          const sceneRef = useRef(null);
          const cameraRef = useRef(null);
          const geometryRef = useRef(null);
          const mouseRef = useRef(new THREE.Vector2(0, 0));
          const timeRef = useRef(0);
          const rotationSpeedRef = useRef(rotationSpeed);
          const [webGLSupported, setWebGLSupported] = useState(true);

          useEffect(() => {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) {
              setWebGLSupported(false);
            }
          }, []);

          useEffect(() => {
            if (!containerRef.current || !webGLSupported) return;

            const container = containerRef.current;
            const width = container.clientWidth;
            const height = container.clientHeight;

            const scene = new THREE.Scene();
            sceneRef.current = scene;
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            cameraRef.current = camera;

            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isLowEndDevice = isMobile || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);

            let effectiveQuality = quality;
            if (isLowEndDevice && quality === 'high') effectiveQuality = 'medium';
            if (isMobile && quality !== 'low') effectiveQuality = 'low';

            const qualitySettings = {
              low: { iterations: 24, waveIterations: 1, pixelRatio: 0.5, precision: 'mediump', stepMultiplier: 1.5 },
              medium: { iterations: 40, waveIterations: 2, pixelRatio: 0.65, precision: 'mediump', stepMultiplier: 1.2 },
              high: {
                iterations: 80,
                waveIterations: 4,
                pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
                precision: 'highp',
                stepMultiplier: 1.0
              }
            };

            const settings = qualitySettings[effectiveQuality] || qualitySettings.medium;

            let renderer;
            try {
              renderer = new THREE.WebGLRenderer({
                antialias: false,
                alpha: true,
                powerPreference: effectiveQuality === 'high' ? 'high-performance' : 'low-power',
                precision: settings.precision,
                stencil: false,
                depth: false
              });
            } catch (error) {
              setWebGLSupported(false);
              return;
            }

            renderer.setSize(width, height);
            renderer.setPixelRatio(settings.pixelRatio);
            container.appendChild(renderer.domElement);
            rendererRef.current = renderer;

            const parseColor = hex => {
              const color = new THREE.Color(hex);
              return new THREE.Vector3(color.r, color.g, color.b);
            };

            const vertexShader = `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
              }
            `;

            const fragmentShader = `
              precision ${settings.precision} float;

              uniform float uTime;
              uniform vec2 uResolution;
              uniform vec2 uMouse;
              uniform vec3 uTopColor;
              uniform vec3 uBottomColor;
              uniform float uIntensity;
              uniform bool uInteractive;
              uniform float uGlowAmount;
              uniform float uPillarWidth;
              uniform float uPillarHeight;
              uniform float uNoiseIntensity;
              uniform float uRotCos;
              uniform float uRotSin;
              uniform float uPillarRotCos;
              uniform float uPillarRotSin;
              uniform float uWaveSin;
              uniform float uWaveCos;
              varying vec2 vUv;

              const float STEP_MULT = ${settings.stepMultiplier.toFixed(1)};
              const int MAX_ITER = ${settings.iterations};
              const int WAVE_ITER = ${settings.waveIterations};

              void main() {
                vec2 uv = (vUv * 2.0 - 1.0) * vec2(uResolution.x / uResolution.y, 1.0);
                uv = vec2(uPillarRotCos * uv.x - uPillarRotSin * uv.y, uPillarRotSin * uv.x + uPillarRotCos * uv.y);

                vec3 ro = vec3(0.0, 0.0, -10.0);
                vec3 rd = normalize(vec3(uv, 1.0));

                float rotC = uRotCos;
                float rotS = uRotSin;
                if(uInteractive && (uMouse.x != 0.0 || uMouse.y != 0.0)) {
                  float a = uMouse.x * 6.283185;
                  rotC = cos(a);
                  rotS = sin(a);
                }

                vec3 col = vec3(0.0);
                float t = 0.1;
                
                for(int i = 0; i < MAX_ITER; i++) {
                  vec3 p = ro + rd * t;
                  p.xz = vec2(rotC * p.x - rotS * p.z, rotS * p.x + rotC * p.z);

                  vec3 q = p;
                  q.y = p.y * uPillarHeight + uTime;
                  
                  float freq = 1.0;
                  float amp = 1.0;
                  for(int j = 0; j < WAVE_ITER; j++) {
                    q.xz = vec2(uWaveCos * q.x - uWaveSin * q.z, uWaveSin * q.x + uWaveCos * q.z);
                    q += cos(q.zxy * freq - uTime * float(j) * 2.0) * amp;
                    freq *= 2.0;
                    amp *= 0.5;
                  }
                  
                  float d = length(cos(q.xz)) - 0.2;
                  float bound = length(p.xz) - uPillarWidth;
                  float k = 4.0;
                  float h = max(k - abs(d - bound), 0.0);
                  d = max(d, bound) + h * h * 0.0625 / k;
                  d = abs(d) * 0.15 + 0.01;

                  float grad = clamp((15.0 - p.y) / 30.0, 0.0, 1.0);
                  col += mix(uBottomColor, uTopColor, grad) / d;

                  t += d * STEP_MULT;
                  if(t > 50.0) break;
                }

                float widthNorm = uPillarWidth / 3.0;
                col = tanh(col * uGlowAmount / widthNorm);
                
                col -= fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) / 15.0 * uNoiseIntensity;
                
                gl_FragColor = vec4(col * uIntensity, 1.0);
              }
            `;

            const pillarRotRad = (pillarRotation * Math.PI) / 180;
            const waveSin = Math.sin(0.4);
            const waveCos = Math.cos(0.4);

            const material = new THREE.ShaderMaterial({
              vertexShader,
              fragmentShader,
              uniforms: {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(width, height) },
                uMouse: { value: mouseRef.current },
                uTopColor: { value: parseColor(topColor) },
                uBottomColor: { value: parseColor(bottomColor) },
                uIntensity: { value: intensity },
                uInteractive: { value: interactive },
                uGlowAmount: { value: glowAmount },
                uPillarWidth: { value: pillarWidth },
                uPillarHeight: { value: pillarHeight },
                uNoiseIntensity: { value: noiseIntensity },
                uRotCos: { value: 1.0 },
                uRotSin: { value: 0.0 },
                uPillarRotCos: { value: Math.cos(pillarRotRad) },
                uPillarRotSin: { value: Math.sin(pillarRotRad) },
                uWaveSin: { value: waveSin },
                uWaveCos: { value: waveCos }
              },
              transparent: true,
              depthWrite: false,
              depthTest: false
            });
            materialRef.current = material;

            const geometry = new THREE.PlaneGeometry(2, 2);
            geometryRef.current = geometry;
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            let mouseMoveTimeout = null;
            const handleMouseMove = event => {
              if (!interactive) return;
              if (mouseMoveTimeout) return;
              mouseMoveTimeout = window.setTimeout(() => {
                mouseMoveTimeout = null;
              }, 16);
              const rect = container.getBoundingClientRect();
              const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
              const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
              mouseRef.current.set(x, y);
            };

            if (interactive) {
              container.addEventListener('mousemove', handleMouseMove, { passive: true });
            }

            let lastTime = performance.now();
            const targetFPS = effectiveQuality === 'low' ? 30 : 60;
            const frameTime = 1000 / targetFPS;

            const animate = currentTime => {
              if (!materialRef.current || !rendererRef.current || !sceneRef.current || !cameraRef.current) return;

              const deltaTime = currentTime - lastTime;

              if (deltaTime >= frameTime) {
                timeRef.current += 0.016 * rotationSpeedRef.current;
                const t = timeRef.current;
                materialRef.current.uniforms.uTime.value = t;
                materialRef.current.uniforms.uRotCos.value = Math.cos(t * 0.3);
                materialRef.current.uniforms.uRotSin.value = Math.sin(t * 0.3);
                rendererRef.current.render(sceneRef.current, cameraRef.current);
                lastTime = currentTime - (deltaTime % frameTime);
              }

              rafRef.current = requestAnimationFrame(animate);
            };
            rafRef.current = requestAnimationFrame(animate);

            let resizeTimeout = null;
            const handleResize = () => {
              if (resizeTimeout) {
                clearTimeout(resizeTimeout);
              }

              resizeTimeout = window.setTimeout(() => {
                if (!rendererRef.current || !materialRef.current || !containerRef.current) return;
                const newWidth = containerRef.current.clientWidth;
                const newHeight = containerRef.current.clientHeight;
                rendererRef.current.setSize(newWidth, newHeight);
                materialRef.current.uniforms.uResolution.value.set(newWidth, newHeight);
              }, 150);
            };

            window.addEventListener('resize', handleResize, { passive: true });

            return () => {
              window.removeEventListener('resize', handleResize);
              if (interactive) {
                container.removeEventListener('mousemove', handleMouseMove);
              }
              if (rafRef.current) {
                cancelAnimationFrame(rafRef.current);
              }
              if (rendererRef.current) {
                rendererRef.current.dispose();
                rendererRef.current.forceContextLoss();
                if (container.contains(rendererRef.current.domElement)) {
                  container.removeChild(rendererRef.current.domElement);
                }
              }
              if (materialRef.current) materialRef.current.dispose();
              if (geometryRef.current) geometryRef.current.dispose();

              rendererRef.current = null;
              materialRef.current = null;
              sceneRef.current = null;
              cameraRef.current = null;
              geometryRef.current = null;
              rafRef.current = null;
            };
          }, [webGLSupported, quality]);

          if (!webGLSupported) {
            return (
              <div className={`light-pillar-fallback ${className}`} style={{ mixBlendMode }}>
                WebGL not supported
              </div>
            );
          }

          return <div ref={containerRef} className={`canvas-container ${className}`} style={{ mixBlendMode }} />;
        };


        /* =========================================================
           10. BACKGROUND THEME SWITCHER (Glassmorphism UI, top-left)
           ========================================================= */

        const BG_OPTIONS = [
          { id: 'normal',     name: 'Normal',          desc: 'Default App Surface',      preview: 'preview-normal' },
          { id: 'waves',      name: 'Gradient Waves',  desc: '3D Raymarched Ocean',      preview: 'preview-waves' },
          { id: 'tunnel',     name: 'Light Tunnel',    desc: 'Cybernetic Fiber Cables',  preview: 'preview-tunnel' },
          { id: 'metal',      name: 'Molten Metal',    desc: 'Fluid Warp Distortion',    preview: 'preview-metal' },
          { id: 'lines',      name: 'Floating Lines',  desc: 'Interactive Sine Waves',   preview: 'preview-lines' },
          { id: 'topography', name: 'Topography',      desc: 'Morphing Contours',        preview: 'preview-topo' },
          { id: 'threads',    name: 'Web Threads',     desc: 'Pinch Glow Fibers',        preview: 'preview-threads' },
          { id: 'galaxy',     name: 'Galaxy',          desc: 'Deep Space Stars',         preview: 'preview-galaxy' },
          { id: 'blinds',     name: 'Gradient Blinds', desc: 'Striped Slats & Spotlight',preview: 'preview-blinds' },
          { id: 'pillar',     name: 'Light Pillar',    desc: '3D Volumetric Raymarching',preview: 'preview-pillar' }
        ];

        const BackgroundThemeApp = () => {

              setIsOpen(false);
            };

              document.documentElement.setAttribute('data-bg-style', activeBg);

          };

          const uiHost = document.getElementById('bgUiRoot');

          return (
            <React.Fragment>
              {/* Active WebGL Background Render */}
              {activeBg === 'waves' && <GradientWaves />}
              {activeBg === 'tunnel' && <LightTunnel />}
              {activeBg === 'metal' && <MoltenMetal />}
              {activeBg === 'lines' && <FloatingLines />}
              {activeBg === 'topography' && <Topography />}
              {activeBg === 'threads' && <WebThreads />}
              {activeBg === 'galaxy' && <Galaxy />}
              {activeBg === 'blinds' && <GradientBlinds />}
              {activeBg === 'pillar' && <LightPillar />}

              {createPortal(
                <React.Fragment>
              {/* Glassmorphism Floating Theme Button (top-left corner) */}

                aria-label="Toggle Background Theme Switcher"
              >
                {/* Theme / palette icon */}
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 3a9 9 0 0 0 0 18c1.66 0 2-1.34 2-3s.34-3 2-3h1a4 4 0 0 0 4-4 9 9 0 0 0-9-8z"></path>
                  <circle cx="8.5" cy="9.5" r="0.6"></circle>
                  <circle cx="12" cy="7.5" r="0.6"></circle>

                </svg>
              </button>

              {/* Glassmorphism Popup Controls Panel */}
              <div className={`popup-modal glass-panel bg-theme-modal ${isOpen ? 'active' : ''}`}>
                <div className="popup-title">
                  Background Style
                  <span>{BG_OPTIONS.length} Styles</span>

                <div className="options-grid">
                  {BG_OPTIONS.map(opt => (
                    <div
                      key={opt.id}

                    >
                      <div className={`option-preview ${opt.preview}`}></div>
                      <div className="option-info">
                        <div className="option-name">{opt.name}</div>
                        <div className="option-desc">{opt.desc}</div>
                      </div>
                      <div className="active-dot"></div>
                    </div>
                  ))}
                </div>
              </div>
                </React.Fragment>,
                uiHost
              )}
            </React.Fragment>
          );
        };

        const bgRootEl = document.getElementById('bgRoot');
        const bgRoot = createRoot(bgRootEl);
        bgRoot.render(<BackgroundThemeApp />);

    </script>
</body>
</html>
