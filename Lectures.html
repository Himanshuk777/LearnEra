<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnEra - Lectures</title>
    
    <!-- External Font Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- React & Babel CDN Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <!-- Early theme bootstrap -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('appThemeMode') || 'system';
                const isDark = savedTheme === 'dark' ||
                    (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const darkStyle = localStorage.getItem('darkTextStyle') || 'colorful';
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.setAttribute('data-dark-text', darkStyle);
                } else {
                    document.documentElement.removeAttribute('data-dark-text');
                }
                const topSp = localStorage.getItem('appTopSpace') || '5';
                document.documentElement.style.setProperty('--top-space', topSp + 'vh');
            } catch (e) {
                document.documentElement.style.setProperty('--top-space', '5vh');
            }
            const savedLang = localStorage.getItem('appLanguageSelection') || 'en';
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>

    <style>
        /* CSS Reset Elements */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* Color Tokens & Global Variables */
        :root {
            --body-bg: #e6edf7; 
            --neu-shadow-light: #ffffff;
            --neu-shadow-dark: #c8d3e4;
            
            --text-color: #2d3748; 
            --sub-text-color: #718096; 
            --blue: #1E90FF;
            --select-active-color: #1E90FF;
            --divider-color: rgba(138, 43, 226, 0.15);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), -2px -2px 5px var(--neu-shadow-light);
            --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -6px -6px 12px var(--neu-shadow-light);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
            
            --top-space: 5vh;
            --transition-theme: background-color 0.8s ease, color 0.8s ease, box-shadow 0.8s ease, border-color 0.8s ease;

            /* LearnEra Header Gradient Outline Tokens */
            --header-gradient: linear-gradient(135deg, #8A2BE2, #a158e6, #DA70D6);
        }

        /* Standard Dark Mode Modifiers */
        html[data-theme="dark"] {
            --body-bg: #1e1e24; 
            --neu-shadow-dark: #101014;
            --neu-shadow-light: rgba(255, 255, 255, 0.05);
            
            --text-color: #d1d9e6; 
            --sub-text-color: #a3b1c6; 
            --divider-color: rgba(255, 255, 255, 0.08);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.02);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.02);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.02);
            --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.02);
            --pressed-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -2px -2px 5px rgba(255, 255, 255, 0.03);
            --settings-shadow-inset-sharp: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px rgba(255, 255, 255, 0.02);
        }

        /* Deep-Dark Mode Specific Styles */
        html[data-dark-text="deep-dark"] {
            --body-bg: #0c0c0f; 
            --neu-shadow-dark: #050506;
            --divider-color: rgba(255, 255, 255, 0.04);
            
            --card-shadow: 8px 8px 16px var(--neu-shadow-dark), inset 2px 2px 6px rgba(255, 255, 255, 0.01);
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), inset 1px 1px 3px rgba(255, 255, 255, 0.01);
            --card-shadow-micro: 2px 2px 5px var(--neu-shadow-dark), inset 1px 1px 2px rgba(255, 255, 255, 0.01);
            --card-shadow-inset: inset 6px 6px 12px var(--neu-shadow-dark), inset -2px -2px 6px rgba(255, 255, 255, 0.01);
            
            --blue: #7a8b9e;
            --select-active-color: #7a8b9e;
            --header-gradient: linear-gradient(135deg, #7a8b9e, #55555d);
        }

        /* Enforce grey colors for deep-dark mode */
        html[data-dark-text="deep-dark"] *,
        html[data-dark-text="deep-dark"] i,
        html[data-dark-text="deep-dark"] h2,
        html[data-dark-text="deep-dark"] h3,
        html[data-dark-text="deep-dark"] h4,
        html[data-dark-text="deep-dark"] p,
        html[data-dark-text="deep-dark"] span,
        html[data-dark-text="deep-dark"] li,
        html[data-dark-text="deep-dark"] button,
        html[data-dark-text="deep-dark"] input {
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border-color: #55555d !important;
        }

        /* Custom Scrollbar Settings */
        ::-webkit-scrollbar {
            display: none !important;
        }

        /* Natural Scrolling Heights to fire window scroll listeners */
        html, body {
            width: 100%;
            min-height: 100%; 
            background-color: var(--body-bg);
            color: var(--text-color);
            overscroll-behavior: none;
            font-family: 'Poppins', sans-serif !important;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            font-size: 13px; 
            transition: var(--transition-theme);
            padding-top: var(--top-space);
        }

        /* Layout Framework Container */
        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px 15px 15px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: flex-start;
            height: auto;
            min-height: 100%;
        }

        /* Separate Floating Controls Card (Fade Up Animation on Header) */
        .controls-card {
            position: sticky;
            top: 15px;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            border-radius: 20px;
            padding: 16px;
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            z-index: 1000 !important;
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, visibility 0.4s ease;
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
            will-change: transform, opacity;
        }

        /* Exact Fade Up Hiding Logic */
        .controls-card.hidden {
            transform: translateY(-130%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        html[data-dark-text="deep-dark"] .controls-card {
            border: 1.5px solid rgba(122, 139, 158, 0.3) !important;
            background: #0c0c0f !important;
        }

        @media (max-width: 768px) {
            .controls-card {
                margin-bottom: 12px !important;
            }
        }
        @media (min-width: 769px) {
            .controls-card {
                margin-bottom: 0px !important;
            }
        }

        /* Main Dashboard Container Card */
        .app-card {
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            border-radius: 20px;
            padding: 20px;
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            display: flex;
            flex-direction: column;
            transition: var(--transition-theme);
            height: auto;
            width: 100%;
            z-index: 1;
        }

        html[data-dark-text="deep-dark"] .app-card {
            border: 1.5px solid rgba(122, 139, 158, 0.3) !important;
            background: #0c0c0f !important;
        }

        /* Search Input Wrapper: Neumorphic Inset default, Gradient Outline when Active */
        .search-wrapper {
            position: relative;
            width: 100%;
            height: 44px;
            border-radius: 14px;
            background: var(--body-bg);
            border: 1.5px solid transparent;
            transition: all 0.3s ease;
        }

        .search-wrapper:focus-within {
            border: 1.5px solid transparent;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            box-shadow: none !important;
        }

        .search-input {
            width: 100%;
            height: 100%;
            padding: 0 16px 0 42px;
            border: none;
            border-radius: 12px;
            background: var(--body-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif !important;
            font-size: 0.95em;
            font-weight: 500;
            box-shadow: var(--settings-shadow-inset-sharp);
            outline: none;
            transition: box-shadow 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-wrapper:focus-within .search-input {
            box-shadow: none;
            background: transparent;
        }

        /* Search Icon: Standard grey idle, Gradient Color when Search Bar Active */
        .search-wrapper-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--sub-text-color);
            font-size: 1.05em;
            pointer-events: none;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .search-wrapper:focus-within .search-wrapper-icon {
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        html[data-dark-text="deep-dark"] .search-wrapper:focus-within .search-wrapper-icon {
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: initial !important;
            color: #7a8b9e !important;
        }

        /* Categories Scroller */
        .categories-filter-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding: 2px 2px 4px 2px;
        }

        /* Category pills: Grey outline style when inactive, Gradient Outline when ACTIVE */
        .category-pill {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            background: transparent !important;
            color: var(--sub-text-color);
            box-shadow: none !important;
            border: 1.5px solid rgba(150, 150, 150, 0.35) !important;
            transition: all 0.2s ease;
        }

        html[data-theme="dark"] .category-pill {
            border: 1.5px solid rgba(180, 180, 180, 0.30) !important;
        }

        .category-pill:active {
            transform: scale(0.95);
        }

        /* Category pill Active State: Gradient Outline */
        .category-pill.active {
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background: linear-gradient(var(--body-bg), var(--body-bg)) padding-box, 
                        var(--header-gradient) border-box !important;
            color: #8A2BE2 !important;
            font-weight: 700;
        }

        html[data-dark-text="deep-dark"] .category-pill {
            border: 1.5px solid rgba(122, 139, 158, 0.3) !important;
            color: #7a8b9e !important;
        }

        html[data-dark-text="deep-dark"] .category-pill.active {
            border: 1.5px solid #7a8b9e !important;
            background: #0c0c0f !important;
            color: #7a8b9e !important;
        }

        /* Lectures cards grid layout with ListScrollingEffect */
        .lectures-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            overflow: visible;
        }

        /* Lecture Card with ListScrollingEffect animation */
        .lecture-card {
            background: var(--body-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow-micro);
            border: 1px solid rgba(255,255,255,0.25);
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.15s ease;
            will-change: transform, opacity;
        }

        .lecture-card.in-view {
            opacity: 1;
            transform: scale(1);
        }

        html[data-theme="dark"] .lecture-card {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lecture-card:active:not(.skeleton-loading) {
            box-shadow: var(--card-shadow-inset) !important;
            transform: scale(0.98);
        }

        .lecture-card-banner {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .lecture-card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lecture-title {
            font-size: 1.05em;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.3;
        }

        .lecture-desc {
            font-size: 0.82em;
            color: var(--sub-text-color);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lecture-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78em;
            font-weight: 700;
            color: var(--sub-text-color);
            margin-top: 5px;
        }

        .lecture-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Utility classes for Gradient Text & Gradient Icons */
        .gradient-icon {
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .gradient-text {
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        html[data-dark-text="deep-dark"] .gradient-icon,
        html[data-dark-text="deep-dark"] .gradient-text {
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: initial !important;
            color: #7a8b9e !important;
        }

        /* Full-screen Video Player Arrangement */
        .full-screen-arrangement { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            width: 100vw; 
            height: 100vh;
            height: 100dvh;
            display: none; 
            z-index: 2000; 
            overflow: hidden;
            background: var(--body-bg); 
            flex-direction: column !important;
            overscroll-behavior: contain;
        }

        .full-screen-arrangement.show {
            display: flex !important;
        }

        .back-btn-float-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2500;
        }

        .back-pill-button {
            position: relative; 
            background: var(--body-bg); 
            color: var(--text-color); 
            border: 2px solid var(--body-bg); 
            border-radius: 16px; 
            padding: 10px 14px; 
            cursor: pointer; 
            box-shadow: var(--card-shadow-micro), inset 1px 1px 2px rgba(255,255,255,0.7); 
            z-index: 70; 
            transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s ease; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            outline: none;
        }

        .back-pill-button:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 4px var(--neu-shadow-dark) !important;
        }

        .video-player-scroll-area {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            height: auto;
            min-height: 0;
            padding: 80px 18px 40px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .player-video-wrapper {
            width: 100%;
            max-width: 550px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow-micro);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }

        .player-video-wrapper iframe, .player-video-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Player Details Panel */
        .player-details-card {
            width: 100%;
            max-width: 550px;
            background: var(--body-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--settings-shadow-inset-sharp);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        /* Shimmer Loading Skeletons */
        .skeleton-loading {
            background: var(--body-bg) !important;
            border-color: transparent !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
            color: transparent !important;
            pointer-events: none !important;
            position: relative !important;
            overflow: hidden !important;
            min-height: 120px;
            border-radius: 20px;
        }

        .skeleton-loading * {
            visibility: hidden !important;
        }

        .skeleton-loading::after {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: skeleton-shimmer-animation 1.5s infinite;
        }
        body[data-theme="dark"] .skeleton-loading::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }
        @keyframes skeleton-shimmer-animation {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        /* Search wrapper skeleton loading effect - exact height matching real textbox */
        .search-wrapper.skeleton-loading {
            border-color: transparent !important;
            aspect-ratio: auto !important;
            height: 44px !important;
            min-height: 44px !important;
            max-height: 44px !important;
            border-radius: 14px !important;
            box-shadow: var(--settings-shadow-inset-sharp) !important;
        }

        @media (min-width: 768px) {
            body {
                justify-content: center;
                align-items: center;
                padding-bottom: 40px;
            }
        }

        /* ============================================================
           LearnEra Unified Header (identical to Laws.html header)
           ============================================================ */
        :root {
            --learnera-purple: #7c3aed;
            --learnera-pink: #ec4899;
            --themed-blue: var(--blue);
            --header-outline-start: var(--learnera-purple);
            --header-outline-end: var(--learnera-pink);
            --icon-gradient-start: var(--learnera-purple);
            --icon-gradient-end: var(--learnera-pink);
            --search-bar-bg: var(--body-bg);
            --search-icon-theme: var(--learnera-purple);
            --search-input-color: var(--learnera-purple);
            --search-input-placeholder-color: #a3b1c6;
        }

        html[data-theme="dark"] {
            --search-icon-theme: var(--learnera-purple);
            --search-input-color: var(--learnera-purple);
        }

        /* Deep Dark monochrome replaces every accent and outline. */
        html[data-theme="dark"][data-dark-text]:not([data-dark-text="colorful"]) {
            --blue: #ffffff;
            --select-active-color: #ffffff;
            --themed-blue: #ffffff;
            --search-input-color: #ffffff;
            --search-input-placeholder-color: #9b9b9f;
            --header-outline-start: #080808;
            --header-outline-end: #ffffff;
            --icon-gradient-start: #080808;
            --icon-gradient-end: #ffffff;
        }

        body {
            padding-top: 0 !important;
        }

        .app-container {
            padding-top: 0 !important;
            gap: 15px;
        }

        /* Neumorphic header with a LearnEra outline and no lower shadow. */
        .header-card {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            width: calc(100% + 30px);
            margin: 0 -15px;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            border-bottom-left-radius: 20px !important;
            border-bottom-right-radius: 20px !important;
            padding: 20px;
            box-shadow: none !important;
            border: 1.5px solid transparent !important;
            background:
                linear-gradient(var(--body-bg), var(--body-bg)) padding-box,
                linear-gradient(110deg, var(--header-outline-start), var(--header-outline-end)) border-box !important;
            outline: none !important;
            border-top: none !important;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition-theme), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, visibility 0.4s ease;
            z-index: 1000;
        }

        .header-card.hidden {
            transform: translateY(-130%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .header-card {
                width: calc(100% + 30px) !important;
                margin: 0 -15px !important;
                padding: 18px 15px !important;
            }
        }

        /* Search Row & Bar */
        .search-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            transition: gap 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .search-bar-container {
            flex: 1;
            min-width: 0;
            background: var(--search-bar-bg);
            border-radius: 25px;
            padding: 10px 18px;
            display: flex;
            align-items: center;

            mask: url('https://ik.imagekit.io/lssafvcmr/magnifying-glass%20(1).png') no-repeat center / contain;

            margin-right: 10px;

        .search-bar-container input {

            outline: none;
            color: transparent;
            background-image: linear-gradient(110deg, var(--icon-gradient-start), var(--icon-gradient-end));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            caret-color: var(--learnera-pink);
            font-size: 0.95em;
            font-weight: 600;
            font-family: 'Poppins', sans-serif !important;
            transition: color 0.3s ease;
        }

        .search-bar-container input::placeholder {
            color: var(--search-input-placeholder-color);
            -webkit-text-fill-color: var(--search-input-placeholder-color);
            font-weight: 500;
        }

        /* Filter Toggle Button with active 1px gradient outline */
        .filter-toggle-btn {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.35);

            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--card-shadow-micro);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        margin 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.3s ease, transform 0.2s ease, border-color 0.3s ease;
        }

        .filter-toggle-btn svg {
            width: 20px;
            height: 20px;
            stroke: url(#learneraIconGradient) !important;
            color: var(--themed-blue) !important;
            transition: stroke 0.3s ease;
        }

        .filter-toggle-btn:active {
            transform: scale(0.92);
            box-shadow: var(--card-shadow-inset);
        }

        .filter-toggle-btn.active {
            box-shadow: var(--card-shadow-inset) !important;
            color: var(--blue);
            border: 1px solid transparent !important;
            background:
                linear-gradient(var(--body-bg), var(--body-bg)) padding-box,
                linear-gradient(110deg, var(--icon-gradient-start), var(--icon-gradient-end)) border-box !important;
        }

        .search-row.search-active .filter-toggle-btn {
            width: 0 !important;
            opacity: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            pointer-events: none !important;
        }

        .search-row.search-active {
            gap: 0 !important;
        }

        /* Categories Scroller */
        .header-card .categories-filter-wrapper {
            display: flex;
            overflow-x: auto;
            width: 100%;
            padding: 6px 2px 4px 2px;
            gap: 10px;
            max-height: 100px;
            opacity: 1;
            margin: 0;
            transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.35s ease, margin 0.35s ease;
        }

        .header-card .categories-filter-wrapper.collapsed,
        .search-row.search-active ~ .categories-filter-wrapper {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .header-card .categories-filter-wrapper::-webkit-scrollbar { display: none; }

        /* Category Pill with 1px Gradient Outline when Active */
        .header-card .category-pill {
            flex-shrink: 0;
            background: var(--body-bg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 6px 16px;
            margin: 2px 0;
            color: var(--text-color);
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--card-shadow-micro);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .header-card .category-pill.active {
            box-shadow: var(--card-shadow-inset);
            border: 1px solid transparent !important;
            background:
                linear-gradient(var(--body-bg), var(--body-bg)) padding-box,
                linear-gradient(110deg, var(--icon-gradient-start), var(--icon-gradient-end)) border-box !important;
            font-weight: 700;
        }

        .header-card .category-pill.active span {
            background-image: linear-gradient(110deg, var(--icon-gradient-start), var(--icon-gradient-end));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

    </style>
</head>
<body>

    <!-- Target Root Mounting Division for React App -->
    <div id="root" style="width: 100%;"></div>

    <!-- Live Execution Module Scripts -->
    <script type="text/babel">
        // Sound FX System matching exact LearnEra implementation
        (function initDashboardSoundFX(){
            const LS_MASTER = 'touchSoundsEnabled';
            const LS_GROUPS = 'touchSoundsGroupState';

            const CLICK_SOUND_URLS = [
                "Click1.ogg", "Click2.ogg", "Click3.ogg", "Click4.ogg", "Click5.ogg",
                "Click6.ogg", "Click7.ogg", "Click8.ogg", "Click9.ogg", "Click10.ogg",
                "Click11.ogg", "Click12.ogg", "Click13.ogg", "Click14.ogg"
            ];

            const GROUP_TO_CLICKS = {
                'buttons'   : [1, 2, 3, 7, 8, 9, 14],
                'navigation': [5],
                'inputs'    : [4, 6],
                'reserved'  : [10, 11, 12, 13]
            };

            const CLICK_TO_GROUP = {};
            Object.keys(GROUP_TO_CLICKS).forEach(g => {
                GROUP_TO_CLICKS[g].forEach(n => { CLICK_TO_GROUP[n] = g; });
            });

            const audioCache = {};
            let _ac = null;
            let _masterGain = null;

            function getAC(){
                if (_ac) return _ac;
                try {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) {
                        _ac = new Ctx();
                        const comp = _ac.createDynamicsCompressor();
                        comp.threshold.value = -10;
                        comp.knee.value = 6;
                        comp.ratio.value = 12;
                        comp.attack.value = 0.001;
                        comp.release.value = 0.05;
                        _masterGain = _ac.createGain();
                        _masterGain.gain.value = 1.0;
                        comp.connect(_masterGain).connect(_ac.destination);
                        _ac._busIn = comp;
                    }
                } catch(e){}
                return _ac;
            }

            function synthClick(n){
                const ac = getAC();
                if (!ac) return;
                if (ac.state === 'suspended') { ac.resume().catch(()=>{}); }
                const SYNTH = {
                    1:  { f: 880,  d: 0.05, w: 'triangle', g: 0.18 },
                    2:  { f: 520,  d: 0.07, w: 'sine',     g: 0.22 },
                    3:  { f: 660,  d: 0.08, w: 'square',   g: 0.16 },
                    4:  { f: 1200, d: 0.03, w: 'sine',     g: 0.12 },
                    5:  { f: 740,  d: 0.05, w: 'triangle', g: 0.18 },
                    6:  { f: 1000, d: 0.025,w: 'sine',     g: 0.10 },
                    7:  { f: 600,  d: 0.05, w: 'square',   g: 0.16 },
                    8:  { f: 820,  d: 0.05, w: 'triangle', g: 0.18 },
                    9:  { f: 420,  d: 0.06, w: 'sine',     g: 0.18 },
                    10: { f: 480,  d: 0.05, w: 'triangle', g: 0.16 },
                    11: { f: 560,  d: 0.05, w: 'triangle', g: 0.16 },
                    12: { f: 640,  d: 0.05, w: 'triangle', g: 0.16 },
                    13: { f: 720,  d: 0.05, w: 'triangle', g: 0.16 },
                    14: { f: 440,  d: 0.08, w: 'sine',     g: 0.60 }
                };
                const r = SYNTH[n] || SYNTH[7];
                const t0 = ac.currentTime;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = r.w;
                osc.frequency.setValueAtTime(r.f, t0);
                osc.frequency.exponentialRampToValueAtTime(Math.max(80, r.f * 0.6), t0 + r.d);
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(r.g, t0 + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + r.d);
                osc.connect(gain).connect(ac._busIn || ac.destination);
                osc.start(t0);
                osc.stop(t0 + r.d + 0.02);
            }

            function playClick(n, opts){
                opts = opts || {};
                const isMasterOn = localStorage.getItem(LS_MASTER) === '1' || localStorage.getItem(LS_MASTER) === null;
                if (!opts.force && !isMasterOn) return;

                let groupState = {};
                try { groupState = JSON.parse(LS_GROUPS) || {}; } catch(e){}
                const groupId = CLICK_TO_GROUP[n];
                if (!opts.force && groupId && groupState[groupId] === false) return;

                const url = CLICK_SOUND_URLS[n - 1];
                try {
                    if (n === 14) {
                        const a = new Audio(url);
                        a.volume = 1.0;
                        a.play().catch(() => synthClick(14));
                        return;
                    }
                    if (!audioCache[n]) {
                        const a = new Audio(url);
                        a.volume = 0.5;
                        a.preload = 'auto';
                        audioCache[n] = a;
                    }
                    const a = audioCache[n];
                    a.currentTime = 0;
                    const p = a.play();
                    if (p && p.catch) p.catch(() => synthClick(n));
                    return;
                } catch(e) {
                    synthClick(n);
                }
            }

            window.playTouchSound = playClick;

            ['pointerdown','touchstart','keydown','click'].forEach(ev => {
                document.addEventListener(ev, () => {
                    const ac = getAC();
                    if (ac && ac.state === 'suspended') { ac.resume().catch(()=>{}); }
                }, { capture: true, passive: true });
            });
        })();

        // Firebase Configuration Setup
        const firebaseConfig = {
          apiKey: "AIzaSyBWOdk2_NJntQ4Pob7_tN6kb1W5rMy-tcw",
          authDomain: "learnera-d6309.firebaseapp.com",
          projectId: "learnera-d6309",
          messagingSenderId: "752970675909",
          appId: "1:752970675909:web:9c4513809ca51ea60122ac",
          databaseURL: "https://learnera-d6309-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // Standard dynamic categories list
        const categoriesList = ["All", "Mathematics", "Physics", "Chemistry", "Biology", "History", "Geography", "Computer Science", "Literature", "Economics"];

        // Fallback offline syllabus database
        const fallbackLectures = [
            {
                id: "lec-fb-1",
                category: "Physics",
                title: "Quantum Physics Fundamentals",
                instructor: "Dr. Richard Feynman",
                duration: "1 Hour 15 Mins",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                thumbnailUrl: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?q=80&w=400&auto=format&fit=crop",
                description: "An introductory crash course covering wave-particle duality, Planck's constant, and historical breakthroughs."
            },
            {
                id: "lec-fb-2",
                category: "Mathematics",
                title: "Calculus Limits & Continuity",
                instructor: "Prof. Gilbert Strang",
                duration: "45 Mins",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
                thumbnailUrl: "https://images.unsplash.com/photo-1509228468518-180dd4864904?q=80&w=400&auto=format&fit=crop",
                description: "Master limits, continuity theorems, and real-world mathematical differentiation models."
            }
        ];

        // Central React View Component
        function App() {
            const [loading, setLoading] = React.useState(true);
            const [lectures, setLectures] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState("");
            const [activeCategory, setActiveCategory] = React.useState("All");
            const [selectedLecture, setSelectedLecture] = React.useState(null);

            // Controls Scroll-Hiding States (Synced with AudioBook / News scroll logic)
            const [controlsHidden, setControlsHidden] = React.useState(false);

            // Controls for search & filter UI toggles (same logic as Laws.html)
            const [filterCollapsed, setFilterCollapsed] = React.useState(true);
            const [isSearchActive, setIsSearchActive] = React.useState(false);

            const toggleFilter = () => {
                if (window.playTouchSound) window.playTouchSound(4);
                setFilterCollapsed(!filterCollapsed);
            };

            const lastScrollYRef = React.useRef(0);

            // Scroll position tracking for hiding/floating controls panel
            React.useEffect(() => {
                const handleScroll = () => {
                    const currentScrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop;
                    const delta = currentScrollY - lastScrollYRef.current;
                    
                    if (Math.abs(delta) < 5) return; 

                    if (delta > 0 && currentScrollY > 10) {
                        setControlsHidden(true);
                    } else if (delta < 0) {
                        setControlsHidden(false);
                    }
                    lastScrollYRef.current = currentScrollY;
                };

                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Fetch dynamic lectures from Firebase under 'admin/Lectures' node
            React.useEffect(() => {
                const ref = database.ref('admin/Lectures');
                ref.once('value').then((snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const parsedList = Array.isArray(data) ? data : Object.values(data);
                        const cleanList = parsedList.filter(item => item !== null);
                        if (cleanList.length > 0) {
                            setLectures(cleanList);
                            setLoading(false);
                            return;
                        }
                    }
                    setLectures(fallbackLectures);
                    setLoading(false);
                }).catch((err) => {
                    console.error("Firebase lectures fetch error: ", err);
                    setLectures(fallbackLectures);
                    setLoading(false);
                });
            }, []);

            // ListScrollingEffect animation setup via IntersectionObserver for Lecture Cards
            React.useEffect(() => {
                if (loading || selectedLecture) return;

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('in-view');
                        } else {
                            entry.target.classList.remove('in-view');
                        }
                    });
                }, {
                    root: null,
                    threshold: 0.15
                });

                const cards = document.querySelectorAll('.lecture-card');
                cards.forEach(card => observer.observe(card));

                return () => {
                    cards.forEach(card => observer.unobserve(card));
                    observer.disconnect();
                };
            }, [lectures, searchQuery, activeCategory, loading, selectedLecture]);

            // Play sound wrapper helper
            const triggerSound = (id) => {
                if (window.playTouchSound) {
                    window.playTouchSound(id);
                }
            };

            // Switch Category filter
            const handleCategoryChange = (cat) => {
                triggerSound(4);
                setActiveCategory(cat);
            };

            // Video embed url generator
            const getEmbedUrl = (url) => {
                if (!url) return "";
                if (url.includes('youtube.com/watch?v=')) {
                    return url.replace('watch?v=', 'embed/');
                } else if (url.includes('youtu.be/')) {
                    return url.replace('youtu.be/', 'youtube.com/embed/');
                }
                return url;
            };

            // Filters logic for search bar
            const filteredLectures = lectures.filter(lec => {
                const matchesCategory = activeCategory === "All" || lec.category === activeCategory;
                const matchesSearch = 
                    (lec.title && lec.title.toLowerCase().includes(searchQuery.toLowerCase())) ||
                    (lec.instructor && lec.instructor.toLowerCase().includes(searchQuery.toLowerCase())) ||
                    (lec.description && lec.description.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchesCategory && matchesSearch;
            });

            return (
                <div className="app-container">
                    
                    {/* Header Card Area with Outline & Rounded Bottom Left/Right Corners */}
                    <div className={`header-card ${controlsHidden ? 'hidden' : ''}`} style={{ display: selectedLecture ? "none" : "flex" }}>

                        {/* Search Row & Filter Toggle matching Laws.html design */}
                        <div className={`search-row ${isSearchActive ? "search-active" : ""}`}>
                            <div className="search-bar-container">
                                <div className="search-icon-mask"></div>
                                <input
                                    type="text"
                                    placeholder="Search video lectures..."
                                    autoComplete="off"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    onFocus={() => {
                                        setIsSearchActive(true);
                                        setFilterCollapsed(true);
                                    }}
                                    onBlur={() => {
                                        setTimeout(() => setIsSearchActive(false), 150);
                                    }}
                                />
                            </div>
                            <button
                                className={`filter-toggle-btn ${!filterCollapsed ? "active" : ""}`}
                                onClick={toggleFilter}
                                aria-label="Toggle filters"
                                title="Toggle filters"
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                                    <defs>
                                        <linearGradient id="learneraIconGradient" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                                            <stop stopColor="var(--icon-gradient-start)" />
                                            <stop offset="1" stopColor="var(--icon-gradient-end)" />
                                        </linearGradient>
                                    </defs>
                                    <line x1="4" y1="6" x2="20" y2="6"></line>
                                    <line x1="7" y1="12" x2="17" y2="12"></line>
                                    <line x1="10" y1="18" x2="14" y2="18"></line>
                                </svg>
                            </button>
                        </div>

                        {/* Collapsible Category Filter Pills Row */}
                        <div className={`categories-filter-wrapper ${filterCollapsed ? "collapsed" : ""}`}>
                            {categoriesList.map((cat) => (
                                <div
                                    key={cat}
                                    className={`category-pill ${activeCategory === cat ? "active" : ""}`}
                                    onClick={() => {
                                        if (window.playTouchSound) window.playTouchSound(4);
                                        handleCategoryChange(cat);
                                    }}
                                >
                                    <span>{cat}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Primary Dashboard Interface / Lectures Grid Card */}
                    <div className="app-card" style={{ display: selectedLecture ? "none" : "flex" }}>
                        
                        {/* Video Lectures list wrapper */}
                        <div className="lectures-grid">
                            {loading ? (
                                Array(3).fill(0).map((_, idx) => (
                                    <div key={idx} className="skeleton-loading"></div>
                                ))
                            ) : filteredLectures.length > 0 ? (
                                filteredLectures.map((lec, idx) => (
                                    <div 
                                        key={lec.id || idx} 
                                        className="lecture-card"
                                        onClick={() => {
                                            triggerSound(1);
                                            setSelectedLecture(lec);
                                        }}
                                    >
                                        <img 
                                            className="lecture-card-banner" 
                                            src={lec.thumbnailUrl || "https://placehold.co/400x225/333333/FFFFFF?text=No+Thumbnail"} 
                                            alt={lec.title}
                                            onError={(e) => {
                                                e.target.src = "https://placehold.co/400x225/333333/FFFFFF?text=No+Thumbnail";
                                            }}
                                        />
                                        <div className="lecture-card-content">
                                            <h3 className="lecture-title">{lec.title}</h3>
                                            <p className="lecture-desc">{lec.description}</p>
                                            <div className="lecture-meta">
                                                <span><i className="fas fa-clock gradient-icon"></i> {lec.duration}</span>
                                                <span><i className="fas fa-chalkboard-teacher gradient-icon"></i> {lec.instructor}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div style={{ textAlign: "center", padding: "30px 10px", color: "var(--sub-text-color)" }}>
                                    No lectures found under the current search parameters.
                                </div>
                            )}
                        </div>

                    </div>

                    {/* Full-screen Video Player Screen */}
                    {selectedLecture && (
                        <div className="full-screen-arrangement show">
                            
                            {/* Floating Back Button */}
                            <div className="back-btn-float-container">
                                <button 
                                    className="back-pill-button" 
                                    onClick={() => {
                                        triggerSound(2);
                                        setSelectedLecture(null);
                                    }}
                                    title="Close Player"
                                >
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <line x1="19" y1="12" x2="5" y2="12"></line>
                                        <polyline points="12 19 5 12 12 5"></polyline>
                                    </svg>
                                </button>
                            </div>

                            {/* Player screen scrollable viewport */}
                            <div className="video-player-scroll-area">
                                
                                {/* Video playback element container */}
                                <div className="player-video-wrapper">
                                    {selectedLecture.videoUrl && selectedLecture.videoUrl.endsWith('.mp4') ? (
                                        <video 
                                            src={selectedLecture.videoUrl} 
                                            controls 
                                            playsInline 
                                            preload="metadata"
                                            poster={selectedLecture.thumbnailUrl}
                                        />
                                    ) : (
                                        <iframe 
                                            src={getEmbedUrl(selectedLecture.videoUrl)} 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                            allowFullScreen
                                        />
                                    )}
                                </div>

                                {/* Lecture information details card */}
                                <div className="player-details-card">
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                                        <span className="gradient-text" style={{ fontSize: "0.8em", fontWeight: "800", textTransform: "uppercase" }}>
                                            {selectedLecture.category}
                                        </span>
                                        <span style={{ fontSize: "0.78em", fontWeight: "700", color: "var(--sub-text-color)" }}>
                                            <i className="fas fa-clock gradient-icon"></i> {selectedLecture.duration}
                                        </span>
                                    </div>
                                    
                                    {/* Video Title in Gradient Text Style */}
                                    <h2 className="lecture-title gradient-text" style={{ fontSize: "1.25em" }}>{selectedLecture.title}</h2>
                                    
                                    <div style={{ fontSize: "0.85em", fontWeight: "700", color: "var(--text-color)", display: "flex", alignItems: "center", gap: "6px" }}>
                                        <i className="fas fa-chalkboard-teacher gradient-icon"></i> Instructor: {selectedLecture.instructor}
                                    </div>
                                    <hr style={{ border: "0", borderTop: "1px solid rgba(255,255,255,0.15)", margin: "5px 0" }} />
                                    <div style={{ fontSize: "0.82em", fontWeight: "700", color: "var(--text-color)" }}>About this Lecture:</div>
                                    <p style={{ fontSize: "0.8em", color: "var(--sub-text-color)", lineHeight: "1.55" }}>
                                        {selectedLecture.description}
                                    </p>
                                </div>

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render application instance
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
